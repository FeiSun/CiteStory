<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">

<title>Citation Flow</title>
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
 --bg:#f4f1ea;--surface:#fbf9f4;--ink:#1d1b17;--ink-2:#55504a;--ink-3:#6b655b;--rule:#e2dcd0;--rule-2:#cfc7b8;
 --node:#2b2823;--muted-node:#a39b8d;--halo:#f4f1ea;--sel:#d9e4f2;--focus:#2f5f9e;--tip:#fffdf8;--shadow:0 6px 24px rgba(60,48,30,.14);
 --rib:.5;--rib-dim:.08;--rib-on:.86;
 --c-asia:#2f6fb0;--c-na:#c2562e;--c-eu:#16906a;--c-oc:#8a5cb8;--c-sa:#a8800f;--c-af:#b54a6a;
 --serif:"Iowan Old Style","New York","Palatino Linotype",Palatino,Georgia,serif;
 --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#121417;--surface:#181b1f;--ink:#ebe7de;--ink-2:#b4aea3;--ink-3:#938d83;--rule:#262a30;--rule-2:#363b43;
 --node:#d9d4c9;--muted-node:#5f5b55;--halo:#121417;--sel:#2b3c55;--focus:#8db7ea;--tip:#1d2025;--shadow:0 8px 28px rgba(0,0,0,.5);
 --rib:.55;--rib-dim:.09;--rib-on:.92;
 --c-asia:#4a8bd4;--c-na:#d06a40;--c-eu:#2a9d78;--c-oc:#9a7ad4;--c-sa:#ad861a;--c-af:#d0668a;color-scheme:dark}}
:root[data-theme=dark]{
 --bg:#121417;--surface:#181b1f;--ink:#ebe7de;--ink-2:#b4aea3;--ink-3:#938d83;--rule:#262a30;--rule-2:#363b43;
 --node:#d9d4c9;--muted-node:#5f5b55;--halo:#121417;--sel:#2b3c55;--focus:#8db7ea;--tip:#1d2025;--shadow:0 8px 28px rgba(0,0,0,.5);
 --rib:.55;--rib-dim:.09;--rib-on:.92;
 --c-asia:#4a8bd4;--c-na:#d06a40;--c-eu:#2a9d78;--c-oc:#9a7ad4;--c-sa:#ad861a;--c-af:#d0668a;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--sel);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:10px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
h1,h2,h3,p,ul,ol{margin:0;padding:0}li{list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration-color:var(--rule-2);text-underline-offset:.2em}
a:hover{text-decoration-color:var(--ink-2)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1480px;margin:0 auto;padding:28px 40px 40px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.acts{display:flex;gap:8px;flex:none}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.2vw,44px);line-height:1.12;letter-spacing:-.01em}
.sub{margin-top:8px;color:var(--ink-2);font-size:14px}
.sub b{font-weight:600;color:var(--ink)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;color:var(--ink-2);border:1px solid var(--rule);flex:none;transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--ink);border-color:var(--rule-2)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}.theme[data-mode=dark] .sun{display:block}.theme[data-mode=dark] .moon{display:none}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px 36px;margin:26px 0 8px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.years{display:flex;align-items:flex-end;gap:16px}
.yr-val{font-family:var(--serif);font-size:26px;line-height:1;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;min-width:5.4em}
.brush{position:relative;width:280px;height:52px}
.brush svg{position:absolute;left:0;top:0;width:100%;height:32px;display:block}
.brush .hb{fill:var(--rule-2);transition:fill .2s}.brush .hb.in{fill:var(--ink-3)}
.brush .track{position:absolute;left:7px;right:7px;top:41px;height:2px;background:var(--rule);border-radius:2px}
.brush .fill{position:absolute;top:41px;height:2px;background:var(--ink-2);border-radius:2px}
.brush input{position:absolute;left:0;top:32px;width:100%;height:20px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.brush input::-webkit-slider-runnable-track{background:none;height:20px}
.brush input::-moz-range-track{background:none}
.brush input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:14px;height:20px;border-radius:5px;background:var(--surface);border:1.5px solid var(--ink-2);cursor:ew-resize}
.brush input::-moz-range-thumb{pointer-events:auto;width:11px;height:17px;border-radius:5px;background:var(--surface);border:1.5px solid var(--ink-2);cursor:ew-resize}
.brush input:focus-visible{outline:none}
.brush input:focus-visible::-webkit-slider-thumb{border-color:var(--focus);box-shadow:0 0 0 3px var(--sel)}
.brush input:focus-visible::-moz-range-thumb{border-color:var(--focus);box-shadow:0 0 0 3px var(--sel)}
.text-btn{font-size:12.5px;color:var(--ink-2);padding:4px 8px;border-radius:6px;border:1px solid var(--rule)}
.text-btn:hover{color:var(--ink);border-color:var(--rule-2)}
.seg{display:inline-flex;padding:3px;border-radius:9px;border:1px solid var(--rule)}
.seg button{padding:4px 12px;border-radius:6px;font-size:13px;color:var(--ink-3);transition:color .2s,background .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule-2)}
.legend{display:none;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;margin-top:12px}
.chart{position:relative;min-width:0}
#flow{display:block;width:100%;overflow:visible;user-select:none;-webkit-user-select:none}
.colhead{font:600 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;fill:var(--ink-3)}
.rib{fill-opacity:var(--rib);transition:fill-opacity .18s}
.hl .rib{fill-opacity:var(--rib-dim)}
.ov{fill-opacity:var(--rib-on);pointer-events:none}
.k-asia{fill:var(--c-asia)}.k-na{fill:var(--c-na)}.k-eu{fill:var(--c-eu)}.k-oc{fill:var(--c-oc)}.k-sa{fill:var(--c-sa)}.k-af{fill:var(--c-af)}
.bg-asia{background:var(--c-asia)}.bg-na{background:var(--c-na)}.bg-eu{background:var(--c-eu)}.bg-oc{background:var(--c-oc)}.bg-sa{background:var(--c-sa)}.bg-af{background:var(--c-af)}
.node{cursor:pointer}
.node .bar{fill:var(--node);transition:opacity .18s}
.node.muted .bar{fill:var(--muted-node)}
.node .hit{fill:transparent}
.node .ring{fill:none;stroke:none}
.node:focus-visible .ring{stroke:var(--focus);stroke-width:2}
.node text{font-size:12px;fill:var(--ink);transition:opacity .18s}
.node .cnt{fill:var(--ink-3)}
.node.cont text{font-size:12.5px;font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round}
.node.cont .cnt{font-weight:400}
.node.zero text{opacity:.4}
.hl .node.dim text,.hl .node.dim .bar{opacity:.28}
.node.pinned text.lab{font-weight:650}
.node:hover text.lab{text-decoration:underline;text-decoration-color:var(--rule-2)}
.placed{margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.tip{position:fixed;z-index:10;pointer-events:none;max-width:300px;padding:9px 12px;border-radius:9px;background:var(--tip);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--rule);font-size:12.5px;line-height:1.4;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip .t{font-weight:600}.tip .m{color:var(--ink-2);margin-top:2px}
aside.panel{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;padding:4px 4px 8px 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.p-meta i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.empty{margin-top:14px;color:var(--ink-2)}
.rib:focus-visible{outline:none;stroke:var(--focus);stroke-width:2;fill-opacity:var(--rib-on)}
.node:focus-visible{outline:none}
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.p-head .icon-btn{width:30px;height:30px}
.panel h2{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.22;margin-top:2px;overflow-wrap:anywhere}
.panel h2 a{text-decoration-thickness:1px}
.p-meta{color:var(--ink-2);font-size:12.5px;margin-top:6px}
.big{margin-top:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.big span{color:var(--ink-2);font-size:13px}
.sec{margin-top:20px}
.sec h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.yc{display:block;width:100%;height:84px}
.yc .b{fill:var(--rule-2)}.yc .b.in{fill:var(--ink-3)}
.yc text{font-size:10px;fill:var(--ink-3)}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) 64px 44px;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.rows .nm{display:flex;align-items:flex-start;gap:7px;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.rows button.nm{text-align:left;border-radius:4px}
.rows button.nm:hover span{text-decoration:underline;text-decoration-color:var(--rule-2)}
.rows .nm i{width:8px;height:8px;border-radius:2px;flex:none;margin-top:5px}
.rows .bw{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.rows .bw div{height:100%;border-radius:3px;background:var(--ink-2)}
.rows .v{text-align:right;color:var(--ink-2)}
.works li{padding:6px 0;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.4}
.works li:last-child{border-bottom:0}
.works .wm{color:var(--ink-3);font-size:12px;margin-top:2px}
.p-act{margin-top:12px}
.about{margin-top:44px;padding-top:20px;border-top:1px solid var(--rule);display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px 36px;color:var(--ink-2);font-size:13px}
.about h2{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink)}
.about p+p{margin-top:8px}
.about b{color:var(--ink);font-weight:600}
.foot{margin-top:14px;font-size:12.5px}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}aside.panel{position:static;max-height:none;max-width:640px}}
@media (max-width:640px){
 .wrap{padding:20px 16px 32px}
 .controls{gap:16px 24px;margin-top:18px}
 .years{flex-wrap:wrap;gap:6px 12px}
 .yr-val{font-size:22px}
 .brush{width:min(343px,calc(100vw - 32px))}
 .legend{display:flex}
 .node text{font-size:11px}
 .about{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div>
   <h1>Where the papers went</h1>
   <p class="sub" id="sub"></p>
  </div>
  <div class="acts"><a class="icon-btn" href="index.html" aria-label="All views" title="All views"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 11.25 12 4.5l8.25 6.75M6 9.75V19.5h4.5v-5.25h3v5.25H18V9.75"/></svg></a>
  <button class="icon-btn theme" id="theme" type="button" aria-label="Switch theme">
   <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
   <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  </button></div>
 </header>

 <div class="controls">
  <div>
   <div class="years" role="group" aria-label="Year range">
    <div class="yr-val" id="yr-val"></div>
    <div class="brush" id="brush">
     <svg id="hist" aria-hidden="true"></svg>
     <div class="track"></div><div class="fill" id="yr-fill"></div>
     <input type="range" id="y0" aria-label="From year">
     <input type="range" id="y1" aria-label="To year">
    </div>
    <button class="text-btn" id="yr-all" type="button" hidden>All years</button>
   </div>
  </div>
  <div>
   <div class="seg" role="group" aria-label="Papers shown">
    <button type="button" id="pp-top" aria-pressed="true"></button>
    <button type="button" id="pp-all" aria-pressed="false">All papers</button>
   </div>
  </div>
  <div class="legend" id="legend" aria-label="Continents"></div>
 </div>

 <div class="layout">
  <section class="chart" id="chart" aria-label="Flow from papers to continents to countries and regions">
   <svg id="flow" role="group" aria-label="Citation flow: papers, continents, countries and regions. Arrow keys move within a column, Tab moves between columns, Enter pins."></svg>
   <p class="placed" id="placed"></p>
  </section>
  <aside class="panel" id="panel-wrap" aria-label="Details"><p class="sr-only" id="live" aria-live="polite"></p><div id="panel"></div></aside>
 </div>

 <section class="about" id="about">
  <h2>About the data</h2>
  <div id="about-body"></div>
 </section>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script src="data.js"></script>
<script>
(function(){
'use strict';
const D=window.CITATION_DATA;
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const NF=new Intl.NumberFormat('en-US');const fmt=n=>NF.format(Math.round(n));
const reduceMQ=matchMedia('(prefers-reduced-motion: reduce)');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function sv(tag,a){const n=document.createElementNS(NS,tag);if(a)for(const k in a)n.setAttribute(k,a[k]);return n;}
function safeHref(u){try{const x=new URL(u);return(x.protocol==='https:'||x.protocol==='http:')?x.href:null;}catch(e){return null;}}
function link(text,url){const h=safeHref(url||'');const a=el(h?'a':'span',null,text);if(h){a.href=h;a.target='_blank';a.rel='noopener noreferrer';}return a;}
function workUrl(w){return w.doi||('https://openalex.org/'+w.id);}

/* ---------- theme ---------- */
const root=document.documentElement,themeBtn=$('theme'),darkMQ=matchMedia('(prefers-color-scheme: dark)');
const effTheme=()=>root.getAttribute('data-theme')||(darkMQ.matches?'dark':'light');
function syncThemeBtn(){const t=effTheme();themeBtn.dataset.mode=t;themeBtn.setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme');}
themeBtn.addEventListener('click',()=>{const t=effTheme()==='dark'?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('theme',t);}catch(e){}syncThemeBtn();});
darkMQ.addEventListener('change',syncThemeBtn);syncThemeBtn();
window.addEventListener('storage',e=>{if(e.key!=='theme')return;if(e.newValue==='light'||e.newValue==='dark')root.setAttribute('data-theme',e.newValue);else root.removeAttribute('data-theme');syncThemeBtn();});

/* ---------- reference data ---------- */
const CONTS=['Asia','North America','Europe','Oceania','South America','Africa'];
const CKEY={'Asia':'asia','North America':'na','Europe':'eu','Oceania':'oc','South America':'sa','Africa':'af'};
const SHORT={US:'United States'};
const TINY={US:'USA',BA:'Bosnia & Herz.',CD:'DR Congo',GB:'UK',KR:'S. Korea',AE:'UAE',HK:'Hong Kong',NL:'Netherl.',NZ:'N. Zealand',CH:'Switzerl.',SA:'Saudi Ar.',ZA:'S. Africa',BD:'Banglad.',PH:'Philippines'};
const CI={};
function cinfo(iso){if(CI[iso])return CI[iso];const c=(D.countries||{})[iso]||null;
 const r=c&&CONTS.includes(c.continent)?{iso,name:SHORT[iso]||c.name,tiny:TINY[iso]||SHORT[iso]||c.name,continent:c.continent}:null;CI[iso]=r;return r;}
const cityById=new Map(D.cities.map(c=>[c.id,c]));
const instCountries=new Map();
for(const c of D.cities)for(const i of c.institutions||[]){if(!instCountries.has(i))instCountries.set(i,new Map());instCountries.get(i).set(c.country,c.id);}
const asOf=Date.parse(D.manifest&&D.manifest.as_of||'');
const ASOFY=isNaN(asOf)?new Date().getUTCFullYear():new Date(asOf).getUTCFullYear();
const asOfText=isNaN(asOf)?'unknown date':new Date(asOf).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});

/* papers grouped by normalized title */
const norm=t=>String(t||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const groups=[],gByKey=new Map(),gOfTarget=new Map();
for(const t of D.targets){const k=t.key||norm(t.title)||t.id;let g=gByKey.get(k);
 if(!g){g={i:groups.length,key:k,ids:[],recs:[]};groups.push(g);gByKey.set(k,g);}
 g.ids.push(t.id);g.recs.push(t);gOfTarget.set(t.id,g.i);}
for(const g of groups){
 const rep=g.recs.slice().sort((a,b)=>((b.doi&&!/arxiv/i.test(b.doi))-(a.doi&&!/arxiv/i.test(a.doi)))||(b.cited_by_count||0)-(a.cited_by_count||0))[0];
 g.title=rep.title||rep.scholar_title||'Untitled';g.doi=rep.doi||('https://openalex.org/'+rep.id);
 g.year=Math.min(...g.recs.map(r=>r.publication_year||9999));if(g.year===9999)g.year=null;
}

/* works */
const W=[];let Y0=Infinity;
for(const w of D.works){
 let y=w.year==null?null:Math.min(w.year,ASOFY);if(y!=null&&y<Y0)Y0=y;
 const P=[...new Set((w.targets||[]).map(t=>gOfTarget.get(t)).filter(g=>g!=null))];
 const K=[...new Set((w.cities||[]).map(c=>cityById.get(c)).filter(Boolean).map(c=>c.country))].filter(iso=>cinfo(iso));
 W.push({w,y,P,K,located:(w.cities||[]).some(c=>(cityById.get(c)||{}).country),d:w.date||(w.year?String(w.year):'')});
}
if(!isFinite(Y0))Y0=ASOFY;const Y1=ASOFY;

/* full-range totals (fixed node identity and order) */
const gTot=new Array(groups.length).fill(0),isoTot=new Map();
for(const r of W){if(!r.K.length)continue;for(const g of r.P)gTot[g]++;for(const iso of r.K)isoTot.set(iso,(isoTot.get(iso)||0)+1);}
const isosOfCont=new Map(CONTS.map(c=>[c,new Set()]));
for(const iso of isoTot.keys())isosOfCont.get(cinfo(iso).continent).add(iso);
const contList=CONTS.filter(c=>isosOfCont.get(c).size);
const TOP_P=12,TOP_C=16;

/* ---------- state ---------- */
const S={y0:Y0,y1:Y1,expanded:false,hover:null,pin:null};
let ST=null;              // structure
let target=null,cur=null,tw=null,raf=0,HL=null,G=null;

function buildStructure(){
 const ranked=groups.map(g=>g.i).filter(i=>gTot[i]>0).sort((a,b)=>gTot[b]-gTot[a]);
 const shown=S.expanded?ranked:ranked.slice(0,TOP_P);
 const rest=groups.map(g=>g.i).filter(i=>!shown.includes(i));
 const pn=shown.map(i=>({id:'p'+i,kind:'paper',label:groups[i].title,full:groups[i].title,groups:new Set([i]),isos:null}));
 const restCited=rest.filter(i=>gTot[i]>0).length;
 if(restCited)pn.push({id:'pother',kind:'papers',other:true,label:'Other papers',full:restCited+' smaller papers',groups:new Set(rest),isos:null,n:restCited});
 const gToP=new Array(groups.length).fill(-1);pn.forEach((n,k)=>{for(const g of n.groups)gToP[g]=k;});
 const topIsos=[...isoTot.keys()].sort((a,b)=>isoTot.get(b)-isoTot.get(a)).slice(0,TOP_C);
 const kn=contList.map(c=>({id:'k:'+c,kind:'continent',label:c,full:c,cont:c,ck:CKEY[c],groups:null,isos:isosOfCont.get(c)}));
 const kIdx=new Map(contList.map((c,i)=>[c,i]));
 const cn=[];
 for(const c of contList){for(const iso of topIsos.filter(x=>cinfo(x).continent===c))cn.push({id:'c:'+iso,kind:'country',iso,label:cinfo(iso).name,tiny:cinfo(iso).tiny,full:cinfo(iso).name,cont:c,ck:CKEY[c],groups:null,isos:new Set([iso])});}
 const restIsos=[...isoTot.keys()].filter(x=>!topIsos.includes(x));
 if(restIsos.length)cn.push({id:'celse',kind:'countries',other:true,label:'Elsewhere',tiny:'Elsewhere',full:restIsos.length+' more countries and regions',groups:null,isos:new Set(restIsos),n:restIsos.length});
 const isoToC=new Map();cn.forEach((n,k)=>{for(const iso of n.isos)isoToC.set(iso,k);});
 ST={pn,kn,cn,gToP,isoToC,kIdx};
 const full=aggregate(Y0,Y1,true);
 /* barycentre ordering of papers against the continent column (minimises crossings); "Other papers" stays last */
 const bc=pn.map(()=>[0,0]);
 for(const [k,v] of full.L1){const [p,c]=k.split('>').map(Number);bc[p][0]+=c*v;bc[p][1]+=v;}
 const order=pn.map((n,i)=>i).sort((a,b)=>(!!pn[a].other-!!pn[b].other)||(bc[a][0]/(bc[a][1]||1))-(bc[b][0]/(bc[b][1]||1))||gTot[[...pn[a].groups][0]]-gTot[[...pn[b].groups][0]]);
 ST.pOrder=order;ST.pPos=new Array(pn.length);order.forEach((p,pos)=>ST.pPos[p]=pos);
 /* links (full range has every key any sub-range can have) */
 ST.l1=[...full.L1.keys()].map(k=>{const [p,c]=k.split('>').map(Number);return{key:k,p,c};});
 ST.l2=[...full.L2.keys()].map(k=>{const [c,n]=k.split('>').map(Number);return{key:k,c,n};});
 ST.l1.forEach(l=>{const P=pn[l.p],K=kn[l.c];l.f={id:'l1:'+l.key,kind:'flow',label:P.label+' to '+K.label,full:(P.other?'Other papers':P.full)+' to '+K.label,groups:P.groups,isos:K.isos,ck:K.ck};});
 ST.l2.forEach(l=>{const K=kn[l.c],N=cn[l.n];const is=new Set([...N.isos].filter(x=>K.isos.has(x)));l.f={id:'l2:'+l.key,kind:'flow',label:K.label+' to '+N.label,full:K.label+' to '+N.label,groups:null,isos:is,ck:K.ck};});
 ST.l1Idx=new Map(ST.l1.map((l,i)=>[l.key,i]));ST.l2Idx=new Map(ST.l2.map((l,i)=>[l.key,i]));
 /* stacking orders */
 ST.pOut=pn.map((_,p)=>ST.l1.map((l,i)=>i).filter(i=>ST.l1[i].p===p).sort((a,b)=>ST.l1[a].c-ST.l1[b].c));
 ST.kIn=kn.map((_,c)=>ST.l1.map((l,i)=>i).filter(i=>ST.l1[i].c===c).sort((a,b)=>ST.pPos[ST.l1[a].p]-ST.pPos[ST.l1[b].p]));
 ST.kOut=kn.map((_,c)=>ST.l2.map((l,i)=>i).filter(i=>ST.l2[i].c===c).sort((a,b)=>ST.l2[a].n-ST.l2[b].n));
 ST.cIn=cn.map((_,n)=>ST.l2.map((l,i)=>i).filter(i=>ST.l2[i].n===n).sort((a,b)=>ST.l2[a].c-ST.l2[b].c));
}

const inRange=(r,y0,y1,full)=>r.y==null?full:(r.y>=y0&&r.y<=y1);
function aggregate(y0,y1,forceFull){
 const full=forceFull||(y0===Y0&&y1===Y1);
 const T=new Map(),L1=new Map(),L2=new Map(),nu=new Map();let placed=0,unplaced=0,offmap=0;
 const inc=(m,k,v)=>m.set(k,(m.get(k)||0)+v);
 for(const r of W){if(!inRange(r,y0,y1,full))continue;if(!r.K.length){if(r.located)offmap++;else unplaced++;continue;}placed++;
  const ps=new Set(),cs=new Set(),ks=new Set();
  for(const g of r.P){ps.add(ST.gToP[g]);for(const iso of r.K)inc(T,g+'|'+iso,1);}
  for(const iso of r.K){cs.add(ST.isoToC.get(iso));ks.add(ST.kIdx.get(cinfo(iso).continent));}
  ps.forEach(p=>p>=0&&inc(nu,'p'+p,1));cs.forEach(c=>inc(nu,'c'+c,1));ks.forEach(k=>inc(nu,'k'+k,1));}
 for(const [k,v] of T){const bar=k.indexOf('|'),g=+k.slice(0,bar),iso=k.slice(bar+1);const p=ST.gToP[g];if(p<0)continue;
  const c=ST.kIdx.get(cinfo(iso).continent),n=ST.isoToC.get(iso);inc(L1,p+'>'+c,v);inc(L2,c+'>'+n,v);}
 return {T,L1,L2,nu,placed,unplaced,offmap,y0,y1,full};
}

/* ---------- highlight (filter over citing works) ---------- */
function matches(r,f){if(f.groups&&!r.P.some(g=>f.groups.has(g)))return false;if(f.isos&&!r.K.some(i=>f.isos.has(i)))return false;return true;}
function computeHL(f){
 if(!f)return null;
 const ov1=new Float64Array(ST.l1.length),ov2=new Float64Array(ST.l2.length),cnt=new Map();
 for(const [k,v] of target.T){const bar=k.indexOf('|'),g=+k.slice(0,bar),iso=k.slice(bar+1);
  if(f.groups&&!f.groups.has(g))continue;if(f.isos&&!f.isos.has(iso))continue;const p=ST.gToP[g];if(p<0)continue;
  const c=ST.kIdx.get(cinfo(iso).continent),n=ST.isoToC.get(iso);
  const a=ST.l1Idx.get(p+'>'+c),b=ST.l2Idx.get(c+'>'+n);if(a!=null)ov1[a]+=v;if(b!=null)ov2[b]+=v;}
 const inc=k=>cnt.set(k,(cnt.get(k)||0)+1);
 for(const r of W){if(!r.K.length||!inRange(r,target.y0,target.y1,target.full)||!matches(r,f))continue;
  const ps=new Set(),cs=new Set(),ks=new Set();
  for(const g of r.P)if(!f.groups||f.groups.has(g))ps.add(ST.gToP[g]);
  for(const iso of r.K)if(!f.isos||f.isos.has(iso)){cs.add(ST.isoToC.get(iso));ks.add(ST.kIdx.get(cinfo(iso).continent));}
  ps.forEach(p=>p>=0&&inc('p'+p));cs.forEach(c=>inc('c'+c));ks.forEach(k=>inc('k'+k));}
 return {f,ov1,ov2,cnt};
}
const active=()=>S.hover||S.pin;
function refreshHL(){const f=active();HL=f?computeHL(f):null;render();}

/* ---------- geometry ---------- */
const measureCtx=document.createElement('canvas').getContext('2d');
function textW(s,px,weight){measureCtx.font=(weight||400)+' '+px+'px '+getComputedStyle(document.body).fontFamily;return measureCtx.measureText(s).width;}
function fit(s,px,maxW,weight){if(textW(s,px,weight)<=maxW)return s;let lo=0,hi=s.length;while(lo<hi){const m=(lo+hi+1)>>1;if(textW(s.slice(0,m).trimEnd()+'…',px,weight)<=maxW)lo=m;else hi=m-1;}if(!lo)return '';let cut=lo;if(/\w/.test(s[lo]||'')){const sp=s.lastIndexOf(' ',lo);if(sp>=lo*0.45)cut=sp;}return s.slice(0,cut).replace(/[\s:,\-]+$/,'')+'…';}

function wrap(s,px,maxW,maxLines){const words=s.split(/\s+/).filter(Boolean),lines=[];let cur='';
 for(let i=0;i<words.length;i++){const t=cur?cur+' '+words[i]:words[i];
  if(!cur||textW(t,px)<=maxW){cur=t;continue;}
  lines.push(cur);cur=words[i];
  if(lines.length===maxLines-1){cur=words.slice(i).join(' ');break;}}
 if(cur)lines.push(cur);
 return lines.map(l=>textW(l,px)<=maxW?l:fit(l,px,maxW));}
function geometry(){
 const w=$('chart').clientWidth,narrow=w<600,dense=ST.pn.length>20;
 const fs=narrow||dense?11:12,m=dense?14:(narrow?15:18),gap=dense?3:(narrow?4:6),nw=narrow?6:9;
 const cntW=textW(narrow?'0,000':'00,000',fs)+(narrow?4:6);
 const LW=narrow?Math.round(w*0.41):Math.round(Math.min(360,Math.max(190,w*0.32)));
 const RW=narrow?Math.round(w*0.315):Math.round(Math.min(220,Math.max(150,w*0.17)));
 const xP=LW,xK=w-RW-nw,xC=Math.round((xP+nw+xK)/2-nw/2-(narrow?0:30));
 /* full paper titles, wrapped; only the last allowed line may end in an ellipsis */
 const lh=fs+3,maxLines=narrow?8:4,labW=LW-14-cntW;
 const pLines=ST.pn.map(n=>wrap(n.label,fs,labW,maxLines));
 const pMin=pLines.map(l=>Math.max(m,l.length*lh+3));
 const needP=pMin.reduce((a,b)=>a+b,0)+(pMin.length-1)*gap,needC=ST.cn.length*(m+gap);
 const base=narrow?440:Math.max(460,Math.min(760,window.innerHeight-250));
 const need=Math.max(needP,needC);const H=need>base*0.8?need+base*0.7:base;
 return {w,narrow,fs,m,gap,nw,cntW,LW,RW,xP,xK,xC,H,top:30,lh,pLines,pMin};
}

const minOf=(m,i)=>Array.isArray(m)?m[i]:m;
function solveK(vals,H,m,gap){const tot=vals.reduce((a,b)=>a+b,0);if(!tot)return Infinity;const avail=H-(vals.length-1)*gap;let k=avail/tot;
 for(let it=0;it<10;it++){let small=0,big=0;vals.forEach((v,i)=>{const mi=minOf(m,i);if(k*v<mi)small+=mi;else big+=v;});if(!big)break;k=(avail-small)/big;}return k>0?k:0;}
function placeCol(vals,order,k,H,m,gap){const slots=vals.map((v,i)=>Math.max(k*v,minOf(m,i)));const tot=order.reduce((a,i)=>a+slots[i],0)+(order.length-1)*gap;
 let y=Math.max(0,Math.min((H-tot)/2,40));const out=new Array(vals.length);   // short columns sit near the top, not in the middle of a tall chart
 for(const i of order){const h=k*vals[i];out[i]={sy:y,sh:slots[i],y:y+(slots[i]-h)/2,h};y+=slots[i]+gap;}return out;}

function layout(st){
 const g=G,pv=ST.pn.map(()=>0),kv=ST.kn.map(()=>0),cv=ST.cn.map(()=>0);
 const v1=ST.l1.map(l=>st.L1.get(l.key)||0),v2=ST.l2.map(l=>st.L2.get(l.key)||0);
 ST.l1.forEach((l,i)=>{pv[l.p]+=v1[i];kv[l.c]+=v1[i];});ST.l2.forEach((l,i)=>{cv[l.n]+=v2[i];});
 const Hc=g.H-g.top-6;
 let k=Math.min(solveK(pv,Hc,g.pMin,g.gap),solveK(kv,Hc,g.m,g.gap),solveK(cv,Hc,g.m,g.gap));if(!isFinite(k))k=0;
 const P=placeCol(pv,ST.pOrder,k,Hc,g.pMin,g.gap),K=placeCol(kv,ST.kn.map((_,i)=>i),k,Hc,g.m,g.gap),C=placeCol(cv,ST.cn.map((_,i)=>i),k,Hc,g.m,g.gap);
 const a1=ST.l1.map(()=>({})),a2=ST.l2.map(()=>({}));
 ST.pOut.forEach((ls,p)=>{let y=P[p].y;for(const i of ls){a1[i].sy=y;a1[i].w=v1[i]*k;y+=v1[i]*k;}});
 ST.kIn.forEach((ls,c)=>{let y=K[c].y;for(const i of ls){a1[i].ty=y;y+=v1[i]*k;}});
 ST.kOut.forEach((ls,c)=>{let y=K[c].y;for(const i of ls){a2[i].sy=y;a2[i].w=v2[i]*k;y+=v2[i]*k;}});
 ST.cIn.forEach((ls,n)=>{let y=C[n].y;for(const i of ls){a2[i].ty=y;y+=v2[i]*k;}});
 return {k,P,K,C,a1,a2,pv,kv,cv};
}
function ribbon(x0,x1,y0,y1,w){const xm=(x0+x1)/2,t=g=>g.toFixed(2);

/* ---------- animation ---------- */
const ease=t=>1-Math.pow(1-t,3);
function lerpMap(a,b,q){const m=new Map();for(const [k,v] of b)m.set(k,(a.get(k)||0)+(v-(a.get(k)||0))*q);for(const [k,v] of a)if(!b.has(k)&&q<1)m.set(k,v*(1-q));return m;}
function retarget(dur){
 target=aggregate(S.y0,S.y1);
 const from=cur||{L1:new Map(),L2:new Map(),nu:new Map()};
 if(reduceMQ.matches||!dur){cur={L1:target.L1,L2:target.L2,nu:target.nu};tw=null;refreshHL();return;}
 tw={from:{L1:from.L1,L2:from.L2,nu:from.nu},t0:performance.now(),dur};
 if(active())HL=computeHL(active());
 if(!raf)raf=requestAnimationFrame(step);
}
function step(now){raf=0;if(!tw)return;const e=Math.min(1,(now-tw.t0)/tw.dur),q=ease(e);
 cur={L1:lerpMap(tw.from.L1,target.L1,q),L2:lerpMap(tw.from.L2,target.L2,q),nu:lerpMap(tw.from.nu,target.nu,q)};
 render();if(e<1)raf=requestAnimationFrame(step);else{tw=null;cur={L1:target.L1,L2:target.L2,nu:target.nu};render();}}

/* ---------- interactions ---------- */
const tip=$('tip');
function nodeFromEl(t){const gn=t.closest&&t.closest('.node');if(gn){const id=gn.dataset.n,i=+id.slice(1);return ({p:E.p,k:E.k,c:E.c})[id[0]][i].n;}
 const p=t.closest&&t.closest('path.rib');if(p)return p.f;return null;}
function tipFor(f){const box=[];const t=el('div','t',f.kind==='paper'?f.full:(f.kind==='flow'?f.full:f.label));box.push(t);
 const n=matchCount(f);box.push(el('div','m',fmt(n)+' citing paper'+(n===1?'':'s')+(f.other?' · '+f.full:'')));return box;}
function matchCount(f){let n=0;for(const r of W)if(r.K.length&&inRange(r,target.y0,target.y1,target.full)&&matches(r,f))n++;return n;}
function showTip(f,ev){tip.textContent='';for(const b of tipFor(f))tip.appendChild(b);tip.classList.add('on');moveTip(ev);}
function moveTip(ev){const r=tip.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY+14;if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14;if(y+r.height>innerHeight-8)y=ev.clientY-r.height-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';}
function hideTip(){tip.classList.remove('on');}
let lastHoverId=null;
svg.addEventListener('pointermove',ev=>{if(ev.pointerType==='touch')return;const f=nodeFromEl(ev.target);
 if(!f){if(lastHoverId){lastHoverId=null;S.hover=null;hideTip();refreshHL();}return;}
 if(f.id!==lastHoverId){lastHoverId=f.id;S.hover=f;refreshHL();showTip(f,ev);}else moveTip(ev);});
svg.addEventListener('pointerleave',()=>{lastHoverId=null;hideTip();if(S.hover){S.hover=null;refreshHL();}});
svg.addEventListener('click',ev=>{const f=nodeFromEl(ev.target);togglePin(f&&!(S.pin&&S.pin.id===f.id)?f:null,true);});
svg.addEventListener('focusin',ev=>{
 if(tabNav&&!tabBack&&!svg.contains(ev.relatedTarget)&&ev.target!==holder(0)){focusGroup(0);return;}
 const f=nodeFromEl(ev.target);if(f){ev.target.setAttribute('aria-label',f.full+', '+fmt(matchCount(f))+' citing paper'+(matchCount(f)===1?'':'s')+', '+rangeText());S.hover=f;refreshHL();}});
svg.addEventListener('focusout',()=>{S.hover=null;refreshHL();});
document.addEventListener('keydown',ev=>{if(ev.key==='Tab'){tabNav=true;tabBack=ev.shiftKey;}},true);
document.addEventListener('pointerdown',()=>{tabNav=false;},true);
const usable=e=>e&&!(e.tagName==='path'&&!e.getAttribute('d'));
function holder(gi){return (ROV[gi]||[]).find(e=>e.getAttribute('tabindex')==='0')||null;}
function setHolder(gi,e){for(const x of ROV[gi])x.setAttribute('tabindex',x===e?'0':'-1');}
function focusGroup(gi){let e=holder(gi);if(!usable(e))e=ROV[gi].find(usable)||e;if(e){setHolder(gi,e);e.focus();}}
svg.addEventListener('keydown',ev=>{
 const gi=ROV.findIndex(g=>g.includes(ev.target));if(gi<0)return;
 if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const g=ROV[gi],d=ev.key==='ArrowDown'?1:-1;let i=g.indexOf(ev.target)+d;while(i>=0&&i<g.length&&!usable(g[i]))i+=d;if(i>=0&&i<g.length){setHolder(gi,g[i]);g[i].focus();}return;}
 if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();const t=gi+(ev.key==='ArrowRight'?1:-1);if(t>=0&&t<ROV.length)focusGroup(t);return;}
 if(ev.key==='Home'||ev.key==='End'){ev.preventDefault();const g=ROV[gi].filter(usable);const e=ev.key==='Home'?g[0]:g[g.length-1];if(e){setHolder(gi,e);e.focus();}return;}
 if(ev.key==='Tab'){const t=gi+(ev.shiftKey?-1:1);if(t>=0&&t<ROV.length){ev.preventDefault();focusGroup(t);}
  else{const hs=ROV.map((g,k)=>holder(k)).filter(Boolean);hs.forEach(h=>h.setAttribute('tabindex','-1'));setTimeout(()=>hs.forEach(h=>h.setAttribute('tabindex','0')),0);}return;}
});
svg.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){const f=nodeFromEl(ev.target);if(f){ev.preventDefault();togglePin(S.pin&&S.pin.id===f.id?null:f,false);}}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.pin){togglePin(null,false);}});
function togglePin(f,fromPointer){S.pin=f;hideTip();if(fromPointer)S.hover=null;lastHoverId=null;refreshHL();renderPanel();
 if(f&&fromPointer&&G&&G.narrow){$('panel').scrollIntoView({behavior:reduceMQ.matches?'auto':'smooth',block:'start'});}}

/* ---------- year control ---------- */
const y0in=$('y0'),y1in=$('y1');
for(const i of [y0in,y1in]){i.min=Y0;i.max=Y1;i.step=1;}
y0in.value=Y0;y1in.value=Y1;
const histCounts=[];for(let y=Y0;y<=Y1;y++)histCounts.push(0);
for(const r of W)if(r.K.length&&r.y!=null)histCounts[r.y-Y0]++;
function drawHist(){const b=$('brush'),w=b.clientWidth,h=32,svgH=$('hist');svgH.setAttribute('viewBox','0 0 '+w+' '+h);svgH.textContent='';
 const n=Y1-Y0,max=Math.max(1,...histCounts),inner=w-14,bw=Math.max(2,Math.min(14,(n?inner/n:inner)*0.62));
 histCounts.forEach((c,i)=>{const x=7+(n?i/n:0.5)*inner,bh=Math.max(1.5,Math.sqrt(c/max)*(h-4));const r=sv('rect',{class:'hb',x:(x-bw/2).toFixed(1),y:(h-bh).toFixed(1),width:bw.toFixed(1),height:bh.toFixed(1),rx:1.5});r.dataset.y=Y0+i;svgH.appendChild(r);});
 syncYears();}
function syncYears(){const a=S.y0,b=S.y1,n=Y1-Y0||1,w=$('brush').clientWidth-14;
 $('yr-val').textContent=a===b?String(a):a+'–'+b;
 const f=$('yr-fill');f.style.left=(7+(a-Y0)/n*w)+'px';f.style.width=((b-a)/n*w)+'px';
 for(const r of $('hist').children){const y=+r.dataset.y;r.classList.toggle('in',y>=a&&y<=b);}
 y0in.setAttribute('aria-valuetext','From '+a);y1in.setAttribute('aria-valuetext','To '+b);
 $('yr-all').hidden=(a===Y0&&b===Y1);
 y0in.style.zIndex=(a===b&&a>Y0)?'3':'';}
function onYear(which){let a=+y0in.value,b=+y1in.value;if(a>b){if(which===0)b=a;else a=b;y0in.value=a;y1in.value=b;}
 if(a===S.y0&&b===S.y1)return;S.y0=a;S.y1=b;syncYears();retarget(620);renderPlaced();schedulePanel();}
y0in.addEventListener('input',()=>onYear(0));y1in.addEventListener('input',()=>onYear(1));
/* keep the upper thumb reachable when both sit at the max */
$('yr-all').addEventListener('click',()=>{y0in.value=Y0;y1in.value=Y1;onYear(1);});
let panelT=0;function schedulePanel(){clearTimeout(panelT);panelT=setTimeout(renderPanel,120);}

/* ---------- papers toggle ---------- */
const ppTop=$('pp-top'),ppAll=$('pp-all');ppTop.textContent='Top '+TOP_P;
function setExpanded(x){if(S.expanded===x)return;S.expanded=x;ppTop.setAttribute('aria-pressed',String(!x));ppAll.setAttribute('aria-pressed',String(x));
 S.hover=null;buildStructure();buildDOM();cur=null;retarget(0);renderPanel();}
ppTop.addEventListener('click',()=>setExpanded(false));ppAll.addEventListener('click',()=>setExpanded(true));

/* ---------- detail panel ---------- */
const ALL={id:'all',kind:'all',label:'All papers',groups:null,isos:null};
function rangeText(){return target.full?'all years':(S.y0===S.y1?String(S.y0):S.y0+'–'+S.y1);}
function topN(map,n){return [...map.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n);}
function rows(title,entries){if(!entries.length)return null;const sec=el('section','sec');sec.appendChild(el('h3',null,title));const ul=el('ul','rows');const max=Math.max(1,...entries.map(e=>e.v));
 for(const e of entries){const li=el('li');let nm;
  if(e.go){nm=el('button','nm');nm.type='button';nm.addEventListener('click',()=>{togglePin(e.go,false);focusPanel();});}else nm=el('div','nm');
  if(e.ck){nm.appendChild(el('i','bg-'+e.ck));}const sp=el('span',null,e.name);if(e.title)nm.title=e.title;nm.appendChild(sp);
  const bw=el('div','bw'),bi=el('div');bi.style.width=(e.v/max*100).toFixed(1)+'%';bw.appendChild(bi);
  li.append(nm,bw,el('div','v',fmt(e.v)));ul.appendChild(li);}
 sec.appendChild(ul);return sec;}
function countryFilter(iso){const n=ST.cn.find(x=>x.iso===iso);if(n)return n;const c=cinfo(iso);return{id:'c:'+iso,kind:'country',iso,label:c.name,full:c.name,cont:c.continent,ck:CKEY[c.continent],groups:null,isos:new Set([iso])};}
function paperFilter(g){const n=ST.pn.find(x=>!x.other&&x.groups.has(g));if(n)return n;return{id:'p'+g,kind:'paper',label:groups[g].title,full:groups[g].title,groups:new Set([g]),isos:null};}
/* per-year bars over the selected range only */
function yearChart(M){const a=S.y0,b=S.y1,n=b-a+1,counts=new Array(n).fill(0);for(const r of M)if(r.y!=null&&r.y>=a&&r.y<=b)counts[r.y-a]++;
 const s=sv('svg',{class:'yc',viewBox:'0 0 300 84',preserveAspectRatio:'none',role:'img'});const max=Math.max(1,...counts),bw=300/n,pad=n===1?bw*0.4:bw*0.18;
 s.setAttribute('aria-label','Citing papers per year, '+a+(n>1?' to '+b:'')+', peak '+fmt(max));
 counts.forEach((c,i)=>{const h=c?Math.max(1.5,c/max*58):0,y=a+i;const r=sv('rect',{class:'b in',x:(i*bw+pad).toFixed(1),y:(68-h).toFixed(1),width:(bw-2*pad).toFixed(1),height:h.toFixed(1),rx:1});
  const t=sv('title');t.textContent=y+': '+fmt(c);r.appendChild(t);s.appendChild(r);});
 const tl=(x,an,txt)=>{const t=sv('text',{x,y:82,'text-anchor':an});t.textContent=txt;s.appendChild(t);};
 if(n===1)tl(150,'middle',String(a));else{tl(pad,'start',String(a));tl(300-pad,'end',String(b));}
 const mt=sv('text',{x:0,y:9});mt.textContent='peak '+fmt(max);s.appendChild(mt);
 return s;}
function focusPanel(){const h=$('panel').querySelector('h2');if(h)h.focus({preventScroll:true});}
function renderPanel(){
 const P=$('panel');P.textContent='';if(!target)return;const f=S.pin||ALL;
 const M=[];for(const r of W)if(r.K.length&&inRange(r,target.y0,target.y1,target.full)&&matches(r,f))M.push(r);
 const head=el('div','p-head'),hl=el('div');
 const h2=el('h2');
 if(f.kind==='paper'){const g=groups[[...f.groups][0]];h2.appendChild(link(g.title,g.doi));}
 else h2.textContent=f.kind==='flow'?f.full:(f.other?(f.kind==='papers'?f.n+' other papers':f.n+' more countries and regions'):f.label);
 h2.tabIndex=-1;hl.appendChild(h2);
 const meta=[];
 if(f.kind==='paper'){const g=groups[[...f.groups][0]];if(g.year)meta.push('Published '+g.year);if(g.recs.length>1)meta.push(g.recs.length+' versions merged');}
 if(f.kind==='country')meta.push(f.cont);
 if(meta.length){const pm=el('p','p-meta');if(f.kind==='country'&&f.ck)pm.appendChild(el('i','bg-'+f.ck));pm.appendChild(document.createTextNode(meta.join(' · ')));hl.appendChild(pm);}
 head.appendChild(hl);
 if(S.pin){const x=el('button','icon-btn');x.type='button';x.setAttribute('aria-label','Close details');x.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';x.addEventListener('click',()=>{togglePin(null,false);focusPanel();});head.appendChild(x);}
 P.appendChild(head);
 const countText=fmt(M.length)+' citing paper'+(M.length===1?'':'s')+' with a known location, '+rangeText();
 const big=el('div','big');big.append(el('b',null,fmt(M.length)),el('span',null,'citing paper'+(M.length===1?'':'s')+' with a known location, '+rangeText()));P.appendChild(big);
 const live=$('live');if(live.textContent!==countText)live.textContent=countText;
 const add=x=>{if(x)P.appendChild(x);};
 if(!M.length){P.appendChild(el('p','empty','No citing papers with a known location in '+rangeText()+'.'));
  if(f.kind==='papers')add(papersToggle());return;}
 const ys=el('section','sec');ys.appendChild(el('h3',null,'Per year'));ys.appendChild(yearChart(M));P.appendChild(ys);
 const isoOK=i=>!f.isos||f.isos.has(i),gOK=g=>!f.groups||f.groups.has(g);
 if(f.kind!=='country'){
  const cc=new Map(),kc=new Map();for(const r of M){const ks=new Set();for(const i of r.K)if(isoOK(i)){cc.set(i,(cc.get(i)||0)+1);ks.add(cinfo(i).continent);}ks.forEach(k=>kc.set(k,(kc.get(k)||0)+1));}
  if(f.kind!=='continent'&&kc.size>1)add(rows('Continents',topN(kc,8).map(([c,v])=>({name:c,v,ck:CKEY[c]}))));
  add(rows('Countries and regions',topN(cc,8).map(([i,v])=>({name:cinfo(i).name,v,ck:CKEY[cinfo(i).continent],go:countryFilter(i)}))));
 }
 if(f.kind!=='paper'){const pc=new Map();for(const r of M)for(const g of r.P)if(gOK(g))pc.set(g,(pc.get(g)||0)+1);
  add(rows(f.kind==='papers'?'Papers in this group':'Papers cited',topN(pc,f.kind==='papers'?40:8).map(([g,v])=>({name:groups[g].title,v,go:paperFilter(g)}))));
  if(f.kind==='papers')add(papersToggle());}
 const cityC=new Map(),instC=new Map();
 for(const r of M){const cs=new Set();for(const c of r.w.cities||[]){const ci=cityById.get(c);if(ci&&isoOK(ci.country)&&cinfo(ci.country))cs.add(c);}cs.forEach(c=>cityC.set(c,(cityC.get(c)||0)+1));
  if(f.isos){const is=new Set();for(const i of r.w.inst||[]){const m=instCountries.get(i);if(m&&[...m.keys()].some(isoOK))is.add(i);}is.forEach(i=>instC.set(i,(instC.get(i)||0)+1));}}
 const single=f.kind==='country';
 add(rows('Top cities',topN(cityC,6).map(([c,v])=>{const ci=cityById.get(c);return{name:ci.name+(single?'':' · '+cinfo(ci.country).name),v};})));
 if(f.isos)add(rows('Top institutions',topN(instC,6).map(([i,v])=>({name:(D.institutions[i]&&D.institutions[i].display_name)||i,v}))));
 const sw=M.slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')).slice(0,6);
 const sec=el('section','sec');sec.appendChild(el('h3',null,'Recent citing papers'));const ul=el('ul','works');
 if(!D.detailsLoaded){sec.appendChild(el('p','empty','Loading papers…'));P.appendChild(sec);return;}
 for(const r of sw){const li=el('li');li.appendChild(link(r.w.title||'Untitled',workUrl(r.w)));const where=r.K.filter(isoOK).map(i=>cinfo(i).name);const mt=[r.y!=null?String(r.y):'Undated'].concat(where.slice(0,3));li.appendChild(el('div','wm',mt.join(' · ')+(where.length>3?' +'+(where.length-3):'')));ul.appendChild(li);}
 sec.appendChild(ul);P.appendChild(sec);
}
function papersToggle(){const b=el('button','text-btn p-act',S.expanded?'Show top '+TOP_P:'Show all papers');b.type='button';b.addEventListener('click',()=>{setExpanded(!S.expanded);focusPanel();});return b;}

/* ---------- text ---------- */
function renderPlaced(){$('placed').textContent=fmt(target.placed)+' citing papers with a known location, '+rangeText()+'; not shown: '+fmt(target.unplaced)+' without author affiliation'+(target.offmap?', '+fmt(target.offmap)+' only in places outside the six continents':'')+'. Ribbon width counts each (citing paper, cited paper, country) pair.';}
function renderText(){
 const st=D.stats||{};const nP=groups.length;
 const sub=$('sub');sub.textContent='';
 const add=(b,t)=>{const x=el('b',null,b);sub.append(x,document.createTextNode(t));};
 sub.append(document.createTextNode((D.owner||'')+' · '));add(String(nP),' papers · ');add(fmt(st.citing_works||D.works.length),' citing papers · ');add(String(isoTot.size),' countries and regions');
 const ab=$('about-body');ab.textContent='';
 const para=parts=>{const p=el('p');for(const x of parts){if(Array.isArray(x))p.appendChild(el('b',null,x[0]));else p.appendChild(document.createTextNode(x));}ab.appendChild(p);};
 para([['Source. '],'The Google Scholar publication list ('+(D.scholar_count||'')+' entries) matched to OpenAlex: '+D.targets.length+' records, grouped by normalized title into '+nP+' papers (preprint and proceedings versions merged); '+((D.unmatched||[]).length)+' Scholar entries were not found. Citing papers and author affiliations come from OpenAlex, snapshot of '+asOfText+'.']);
 para([['Counting. '],'Ribbon width counts (citing paper, cited paper, country) pairs: a paper that cites two of these papers, or has authors in two countries, adds to each pair, so ribbons sum to more than the number of citing papers. Numbers beside nodes and in the panel count each citing paper once per paper, continent or country. Self-citations are included. Institution locations are usually the headquarters or main campus.']);
 para([['Not shown. '],fmt(st.unmapped_works!=null?st.unmapped_works:0)+' citing papers list no author affiliation and cannot be placed; papers whose authors are all in places outside the six continents shown are left out too. Undated papers appear only when all years are selected; papers dated after the snapshot count in '+ASOFY+'. Countries and regions beyond the top '+TOP_C+' are folded into Elsewhere.']);
 const p=el('p','foot');const a=el('a',null,'All views');a.href='index.html';p.appendChild(a);ab.appendChild(p);
}

/* ---------- init & resize ---------- */
buildStructure();buildDOM();renderText();
/* titles, DOIs and authors arrive after first paint (data-details.js); re-render the panel then */
let detailsSeen=!!D.detailsLoaded;const onDetails=()=>{if(detailsSeen||!D.detailsLoaded)return;detailsSeen=true;renderPanel();};
window.addEventListener('citation-details',onDetails);
const askDetails=()=>{if(typeof window.loadCitationDetails==='function')Promise.resolve(window.loadCitationDetails()).then(onDetails,()=>{});};
if(document.readyState==='complete')askDetails();else window.addEventListener('load',askDetails);
retarget(reduceMQ.matches?0:900);renderPlaced();renderPanel();drawHist();
let lastW=$('chart').clientWidth,rz=0;
new ResizeObserver(()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{const w=$('chart').clientWidth;if(w!==lastW){lastW=w;buildDOM();refreshHL();}drawHist();});}).observe($('chart'));
})();
</script>
</body>
