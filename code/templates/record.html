<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Citation Record</title>
<script src="views.js"></script>
<!--SHELL-->
<!--PAPER_PICKER-->
<style>
/* The record is dark in both themes, so its cuts (and their legend) keep the dark theme's pair of colours. */
.plate { position: relative; }
:root[data-theme="light"] .plate { --dot: #e9d8ad; --accent: #f08a5d; }
.platter { position: relative; height: clamp(380px, calc(100vh - 170px), 900px); }
.platter canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#disc { touch-action: none; cursor: grab; border-radius: 6px; }
#disc.dragging { cursor: grabbing; }
#hud { pointer-events: none; }
.nogl { position: absolute; inset: 0; margin: 0; padding: 0 24px; display: grid; place-items: center; text-align: center; color: var(--ink-2); }
.plate .key { position: absolute; left: 4px; bottom: 8px; pointer-events: none; }
.plate .key i { width: 14px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, transparent 5.5px, var(--dot) 5.5px, var(--dot) 8.5px, transparent 8.5px) #131215; }
.plate .key i.several { background: linear-gradient(90deg, transparent 5.5px, var(--accent) 5.5px, var(--accent) 8.5px, transparent 8.5px) #131215; }
.controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
@media (max-width: 820px) {
  .platter { height: min(calc(100vw - 32px), 70vh); }
  .plate .key { position: static; justify-content: center; margin-top: 4px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Record</h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="tools">
    <button type="button" class="text-btn" id="aboutBtn">About the data</button>
    <a class="icon-btn" href="index.html" aria-label="All views" title="All views"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg></a>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="Record">
    <div class="plate" id="plate">
      <div class="platter">
        <canvas id="disc" tabindex="0" role="img" aria-label="A record whose groove is a spiral, one revolution per calendar year. Every citing paper is a cut in the groove. Space plays or pauses, the left and right arrow keys step one citing paper at a time."></canvas>
        <canvas id="hud" aria-hidden="true"></canvas>
        <p class="nogl" id="noGl" hidden>The record needs WebGL2, which this browser does not provide.</p>
      </div>
      <div class="key" aria-hidden="true"><span><i></i>cites one</span><span><i class="several"></i>cites several</span></div>
    </div>
    <div class="timeline">
      <button type="button" class="play" id="playBtn" aria-label="Play"></button>
      <div class="track">
        <canvas id="spark" aria-hidden="true"></canvas>
        <input type="range" id="time" aria-label="Needle position by date">
        <div class="years" aria-hidden="true"><span id="yStart"></span><span id="yEnd"></span></div>
      </div>
      <div class="when" id="when" aria-live="off"></div>
    </div>
  </section>

  <aside class="side">
    <div class="field"><button type="button" id="paperBtn"></button></div>
    <div class="controls">
      <button type="button" class="text-btn" id="soundBtn" aria-pressed="false">Sound</button>
      <div class="seg" role="group" aria-label="Speed" id="speedSeg">
        <button type="button" data-speed="0.5" aria-pressed="false">½×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
      </div>
    </div>

    <section id="now" aria-label="Citing paper under the needle" hidden>
      <div class="detail-head"><h2 id="nTitle"></h2></div>
      <p class="detail-sub" id="nBy"></p>
      <div class="chips"><div class="chip"><b id="nDate"></b><span id="nPlace"></span></div></div>
      <h3>Cites</h3>
      <ul class="papers" id="nCites"></ul>
    </section>
  </aside>
</main>

<dialog id="about" aria-labelledby="aboutH">
  <button type="button" class="icon-btn close" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  <h2 id="aboutH">About the data</h2>
  <div id="aboutBody"></div>
</dialog>
<span id="live" class="sr" aria-live="polite"></span>

<script>
(function () {
  "use strict";
  var S = window.Shell, V = S.V, P = V.papers, W = V.works, C = S.C, $ = S.$, fmt = S.fmt, el = S.el;
  var plate = $("plate"), disc = $("disc"), hud = $("hud");
  var TAU = Math.PI * 2, NEEDLE = -Math.PI / 3;            // the needle sits at two o'clock
  var SPIN = 1;                                             // 1: the record turns clockwise as time advances
  var R_IN = 0.165, R_OUT = 0.945;                          // groove band, as fractions of the record's radius
  var t0 = V.years[0], lastYear = V.years[V.years.length - 1], tEnd = S.tEnd, span = Math.max(1, tEnd - t0);
  var clamp01 = function (v) { return Math.max(0, Math.min(1, v)); };

  // ---------- where each citing paper is cut ----------
  /* Papers that share a date sit side by side. Papers known only by year are spread evenly around
     that year's revolution (golden-ratio steps) instead of piling up on one mid-year spoke. */
  var shown = new Float64Array(W.length), sameDate = new Map(), seen = new Map(), yearOnly = 0;
  W.forEach(function (w) { if (w[0] != null && !(w[3] & 2)) sameDate.set(w[0], (sameDate.get(w[0]) || 0) + 1); });
  W.forEach(function (w, i) {
    var t = w[0];
    if (t == null) { shown[i] = NaN; return; }
    if (w[3] & 2) {
      var y = Math.floor(t), room = Math.min(y + 1, tEnd) - y; yearOnly++;
      shown[i] = y + (0.03 + 0.94 * ((yearOnly * 0.61803398875) % 1)) * room;
    } else {
      var k = seen.get(t) || 0; seen.set(t, k + 1);
      shown[i] = Math.min(tEnd, t + k / sameDate.get(t) * 0.00085);
    }
  });
  var dated = [];
  W.forEach(function (w, i) { if (w[0] != null) dated.push(i); });
  dated.sort(function (a, b) { return shown[a] - shown[b]; });
  var radius = function (i) { return clamp01((shown[i] - t0) / span); };
  var angle = function (i) { return NEEDLE - SPIN * (shown[i] - tEnd) * TAU; };     // on the record, before it turns

  // ---------- state ----------
  var filter = -1, events = dated, undated = V.stats.undated;   // events: work indices in the order the needle meets them
  var cursor = tEnd, active = -1, angVel = 0, turning = false;
  var pulseR = -1, pulseAge = 9, pulseMix = 0, lightX = 0, lightY = 0;
  var width = 0, height = 0, dpr = 1, cx = 0, cy = 0, R = 180, hudCtx = null;

  function indexAt(t) {
    var lo = 0, hi = events.length;
    while (lo < hi) { var m = (lo + hi) >> 1; if (shown[events[m]] <= t + 1e-7) lo = m + 1; else hi = m; }
    return lo - 1;
  }
  var rotation = function () { return S.reduce ? 0 : SPIN * (cursor - tEnd) * TAU; };
  function needle() {
    var r = (R_IN + clamp01((cursor - t0) / span) * (R_OUT - R_IN)) * R, a = S.reduce ? NEEDLE - SPIN * (cursor - tEnd) * TAU : NEEDLE;
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, a: a };
  }

  // ---------- colours ----------
  var probe = document.createElement("canvas").getContext("2d", { willReadFrequently: true }), col = {};
  probe.canvas.width = probe.canvas.height = 1;
  function rgb(css) {
    probe.clearRect(0, 0, 1, 1); probe.fillStyle = "#000"; probe.fillStyle = css; probe.fillRect(0, 0, 1, 1);
    var d = probe.getImageData(0, 0, 1, 1).data; return [d[0] / 255, d[1] / 255, d[2] / 255];
  }
  var rgba = function (c, a) { return "rgba(" + Math.round(c[0] * 255) + "," + Math.round(c[1] * 255) + "," + Math.round(c[2] * 255) + "," + a + ")"; };
  function colours() {
    var cs = getComputedStyle(plate);
    col.one = rgb(cs.getPropertyValue("--dot").trim()); col.several = rgb(cs.getPropertyValue("--accent").trim());
    col.label = rgb(C.surface); col.ink = rgb(C.ink);
    tick();
  }

  // ---------- WebGL2: the record, then the cuts as instances ----------
  var gl = null, discProg = null, cutProg = null, discU = null, cutU = null, quadVAO = null, cutVAO = null, cutVBO = null, cutCount = 0;
  try { gl = disc.getContext("webgl2", { antialias: true, alpha: true, premultipliedAlpha: false }); } catch (e) { gl = null; }
  function program(vs, fs) {
    var p = gl.createProgram();
    [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(function (s) {
      var sh = gl.createShader(s[0]); gl.shaderSource(sh, s[1]); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
      gl.attachShader(p, sh);
    });
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  function uniforms(p, names) { var u = {}; names.forEach(function (n) { u[n] = gl.getUniformLocation(p, n); }); return u; }

  if (gl) try {
    discProg = program(`#version 300 es
      layout(location=0) in vec2 aQuad;
      uniform vec2 uCenterPx;
      uniform float uRadiusPx;
      uniform vec2 uViewport;
      out vec2 vLocal;
      void main() {
        vLocal = aQuad * 1.08;
        vec2 px = uCenterPx + vLocal * uRadiusPx;
        gl_Position = vec4((px.x / uViewport.x) * 2.0 - 1.0, 1.0 - (px.y / uViewport.y) * 2.0, 0.0, 1.0);
      }`, `#version 300 es
      precision highp float;
      in vec2 vLocal;
      uniform float uRot;
      uniform float uSpan;
      uniform float uSpin;
      uniform float uPhase;
      uniform vec2 uLightShift;
      uniform float uPulseR;
      uniform float uPulseAge;
      uniform vec3 uPulseCol;
      uniform vec3 uLabel;
      uniform vec3 uInk;
      out vec4 outColor;

      const float TAU = 6.28318530718;

      float hash11(float p) {
        p = fract(p * 0.1031);
        p *= p + 33.33;
        p *= p + p;
        return fract(p);
      }

      void main() {
        float r = length(vLocal);
        if (r > 1.06) discard;

        // soft shadow around the record
        if (r > 1.0) {
          outColor = vec4(0.0, 0.0, 0.0, smoothstep(1.06, 1.0, r) * 0.3);
          return;
        }

        float worldAng = atan(vLocal.y, vLocal.x);     // fixed on the page
        float diskAng = worldAng - uRot;               // turns with the record

        // spindle hole
        if (r < 0.022) {
          float rim = smoothstep(0.017, 0.022, r);
          outColor = vec4(mix(vec3(0.05, 0.05, 0.055), vec3(0.74, 0.71, 0.66), rim), 1.0);
          return;
        }

        // paper label, in the page's surface colour
        if (r < 0.138) {
          vec3 lab = mix(uLabel, uInk, 0.03 + 0.05 * r / 0.138);
          float ring = 1.0 - smoothstep(0.0, 0.0035, abs(r - 0.118));
          outColor = vec4(mix(lab, uInk, ring * 0.35), 1.0);
          return;
        }

        vec3 base = vec3(0.070, 0.068, 0.074);

        // the spiral groove: one turn per year
        float uNorm = clamp((r - 0.165) / (0.945 - 0.165), 0.0, 1.0);
        float inGrooveBand = smoothstep(0.155, 0.168, r) * smoothstep(0.962, 0.945, r);
        float spiralTurns = uNorm * uSpan + uSpin * diskAng / TAU + uPhase;
        float mainGroove = sin(spiralTurns * TAU);
        float micro = sin((r * 290.0 + diskAng / TAU) * TAU) * 0.5 + 0.5;
        float ringVar = hash11(floor(r * 220.0));

        // anisotropic sheen: brightest where the radius lines up with a light
        vec2 radDir = vLocal / max(r, 1e-4);
        vec2 lightA = normalize(vec2(-0.58, -0.81) + uLightShift * 0.28);
        vec2 lightB = normalize(vec2(0.78, 0.62) - uLightShift * 0.22);
        float anisoA = pow(abs(dot(radDir, lightA)), 14.0);
        float anisoB = pow(abs(dot(radDir, lightB)), 22.0);
        float broadSheen = pow(abs(dot(radDir, normalize(vec2(-0.35, 0.93)))), 5.0);
        vec3 sheenCol =
          vec3(0.86, 0.82, 0.76) * anisoA * (0.16 + 0.09 * ringVar) +
          vec3(0.66, 0.74, 0.82) * anisoB * 0.13 +
          vec3(0.46, 0.44, 0.42) * broadSheen * 0.07;
        vec3 col = base + sheenCol * smoothstep(0.138, 0.16, r);

        float grooveLine = smoothstep(0.72, 0.99, mainGroove) * inGrooveBand;
        float grooveTrough = smoothstep(0.65, 0.98, -mainGroove) * inGrooveBand;
        col += vec3(0.34, 0.32, 0.30) * grooveLine * 0.22;
        col -= vec3(0.035) * grooveTrough * (0.6 + 0.4 * micro);

        // ripple when a note sounds
        if (uPulseAge < 1.0 && uPulseR > 0.0) {
          float waveR = 0.165 + uPulseR * (0.945 - 0.165);
          float dist = abs(r - waveR - uPulseAge * 0.08);
          col += uPulseCol * exp(-dist * 110.0) * (1.0 - uPulseAge) * 0.28;
        }

        // rim
        float rimOuter = 1.0 - smoothstep(0.0, 0.005, abs(r - 0.994));
        float rimInner = 1.0 - smoothstep(0.0, 0.004, abs(r - 0.968));
        float rimLight = 0.45 + 0.55 * max(0.0, dot(radDir, vec2(-0.6, -0.8)));
        col += vec3(0.84, 0.80, 0.76) * rimOuter * rimLight * 0.55;
        col += vec3(0.56, 0.54, 0.52) * rimInner * 0.18;

        outColor = vec4(col, smoothstep(1.0, 0.996, r));
      }`);
    discU = uniforms(discProg, ["uCenterPx", "uRadiusPx", "uViewport", "uRot", "uSpan", "uSpin", "uPhase", "uLightShift", "uPulseR", "uPulseAge", "uPulseCol", "uLabel", "uInk"]);

    /* per instance: aCutGeo = (radius 0..1, angle on the record, half length / record radius, width px),
       aCutKind = (cites several, year known only) */
    cutProg = program(`#version 300 es
      layout(location=0) in vec2 aCorner;
      layout(location=1) in vec4 aCutGeo;
      layout(location=2) in vec2 aCutKind;
      uniform vec2 uCenterPx;
      uniform float uRadiusPx;
      uniform vec2 uViewport;
      uniform float uRot;
      uniform float uCursorNorm;
      uniform float uNeedleAngle;
      out vec2 vCorner;
      out vec2 vKind;
      out float vGlow;
      out float vPlayed;
      void main() {
        float rMid = 0.165 + aCutGeo.x * (0.945 - 0.165);
        float worldAng = aCutGeo.y + uRot;

        // cuts brighten as they pass under the needle
        float angDiff = atan(sin(worldAng - uNeedleAngle), cos(worldAng - uNeedleAngle));
        float glow = exp(-abs(angDiff) * 16.0) * exp(-abs(aCutGeo.x - uCursorNorm) * 65.0);

        vPlayed = aCutGeo.x <= uCursorNorm + 0.0005 ? 1.0 : 0.34;
        vGlow = glow;
        vCorner = aCorner;
        vKind = aCutKind;

        vec2 radDir = vec2(cos(worldAng), sin(worldAng));
        vec2 tanDir = vec2(-radDir.y, radDir.x);
        float halfLenPx = (aCutGeo.z + glow * 0.009) * uRadiusPx;
        float halfWidPx = max(0.55, aCutGeo.w * 0.5 + glow * 1.1);
        vec2 px = uCenterPx + radDir * (rMid * uRadiusPx + aCorner.y * halfLenPx) + tanDir * (aCorner.x * halfWidPx);
        gl_Position = vec4((px.x / uViewport.x) * 2.0 - 1.0, 1.0 - (px.y / uViewport.y) * 2.0, 0.0, 1.0);
      }`, `#version 300 es
      precision highp float;
      in vec2 vCorner;
      in vec2 vKind;
      in float vGlow;
      in float vPlayed;
      uniform vec3 uOne;
      uniform vec3 uSeveral;
      out vec4 outColor;
      void main() {
        float maskX = 1.0 - smoothstep(0.25, 1.0, abs(vCorner.x));
        float maskY = 1.0 - smoothstep(0.65, 1.0, abs(vCorner.y));
        float alphaBase = vKind.y > 0.5 ? 0.34 : 0.78;      // fainter when only the year is known
        float alpha = maskX * maskY * (alphaBase * vPlayed + vGlow * 0.95);
        vec3 col = mix(mix(uOne, uSeveral, step(0.5, vKind.x)), vec3(1.0, 0.97, 0.88), clamp(vGlow * 1.15, 0.0, 1.0));
        outColor = vec4(col, alpha);
      }`);
    cutU = uniforms(cutProg, ["uCenterPx", "uRadiusPx", "uViewport", "uRot", "uCursorNorm", "uNeedleAngle", "uOne", "uSeveral"]);

    var corners = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
    quadVAO = gl.createVertexArray(); gl.bindVertexArray(quadVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    cutVAO = gl.createVertexArray(); gl.bindVertexArray(cutVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, corners, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    cutVBO = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cutVBO);
    gl.bufferData(gl.ARRAY_BUFFER, Math.max(1, dated.length) * 24, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 24, 0); gl.vertexAttribDivisor(1, 1);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 24, 16); gl.vertexAttribDivisor(2, 1);
    gl.bindVertexArray(null);
  } catch (e) { console.error(e); gl = null; }
  if (!gl) { $("noGl").hidden = false; disc.hidden = hud.hidden = true; }

  function uploadCuts() {
    if (!gl) return;
    var buf = new Float32Array(events.length * 6);
    events.forEach(function (i, k) {
      var n = W[i][1].length, faint = W[i][3] & 2 ? 1 : 0, o = k * 6;
      buf[o] = radius(i); buf[o + 1] = angle(i);
      buf[o + 2] = n > 1 ? 0.0085 + Math.min(n - 1, 5) * 0.0024 : faint ? 0.0042 : 0.0062;   // longer when it cites more
      buf[o + 3] = n > 1 ? 1.65 : faint ? 1.35 : 1.15;
      buf[o + 4] = n > 1 ? 1 : 0; buf[o + 5] = faint;
    });
    gl.bindBuffer(gl.ARRAY_BUFFER, cutVBO); gl.bufferSubData(gl.ARRAY_BUFFER, 0, buf);
    cutCount = events.length;
  }

  function drawDisc() {
    if (!gl || !width) return;
    var rot = rotation(), u = clamp01((cursor - t0) / span);
    gl.viewport(0, 0, disc.width, disc.height);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);

    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(discProg);
    gl.uniform2f(discU.uCenterPx, cx * dpr, cy * dpr); gl.uniform1f(discU.uRadiusPx, R * dpr); gl.uniform2f(discU.uViewport, disc.width, disc.height);
    gl.uniform1f(discU.uRot, rot); gl.uniform1f(discU.uSpan, span); gl.uniform1f(discU.uSpin, SPIN);
    gl.uniform1f(discU.uPhase, 0.75 - span - SPIN * NEEDLE / TAU);        // puts every cut in the dark of the groove
    gl.uniform2f(discU.uLightShift, lightX, lightY);
    gl.uniform1f(discU.uPulseR, pulseR); gl.uniform1f(discU.uPulseAge, pulseAge); gl.uniform3fv(discU.uPulseCol, col.one.map(function (v, c) { return v + (col.several[c] - v) * pulseMix; }));
    gl.uniform3fv(discU.uLabel, col.label); gl.uniform3fv(discU.uInk, col.ink);
    gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    if (cutCount) {
      gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ZERO, gl.ONE);       // additive light; the record stays opaque
      gl.useProgram(cutProg);
      gl.uniform2f(cutU.uCenterPx, cx * dpr, cy * dpr); gl.uniform1f(cutU.uRadiusPx, R * dpr); gl.uniform2f(cutU.uViewport, disc.width, disc.height);
      gl.uniform1f(cutU.uRot, rot); gl.uniform1f(cutU.uCursorNorm, u); gl.uniform1f(cutU.uNeedleAngle, needle().a);
      gl.uniform3fv(cutU.uOne, col.one); gl.uniform3fv(cutU.uSeveral, col.several);
      gl.bindVertexArray(cutVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, cutCount);
    }
    gl.bindVertexArray(null);
  }

  // ---------- 2D overlay: label, the needle's arm with its year scale, the needle ----------
  function drawHud() {
    if (!gl || !hudCtx) return;
    var g = hudCtx, cosA = Math.cos(NEEDLE), sinA = Math.sin(NEEDLE), y;
    g.clearRect(0, 0, width, height);
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = C.ink; g.font = "500 " + Math.max(9, R * 0.036) + "px " + C.display;
    g.fillText(V.owner, cx, cy - R * 0.062, R * 0.2);
    g.fillStyle = C["ink-2"]; g.font = Math.max(8, R * 0.027) + "px " + C.ui;
    g.fillText(t0 + "–" + lastYear, cx, cy + R * 0.066, R * 0.2);

    g.strokeStyle = rgba(col.one, 0.26); g.lineCap = "round";
    if (!S.reduce) {
      g.lineWidth = 2; g.beginPath();
      g.moveTo(cx + cosA * R * (R_IN - 0.02), cy + sinA * R * (R_IN - 0.02)); g.lineTo(cx + cosA * R * 0.985, cy + sinA * R * 0.985); g.stroke();
    }
    g.lineWidth = 1; g.strokeStyle = rgba(col.one, 0.4); g.fillStyle = rgba(col.one, 0.7); g.font = "500 10px " + C.ui;
    for (y = t0; y <= lastYear; y += 3) {
      var rr = (R_IN + (y - t0) / span * (R_OUT - R_IN)) * R, tx = cx + cosA * rr, ty = cy + sinA * rr;
