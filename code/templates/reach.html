<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citation Reach</title>
<script>try{var c=localStorage.getItem("theme");if(c==="light"||c==="dark")document.documentElement.setAttribute("data-theme",c);}catch(e){}</script>
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<style>
:root {
  --font-display: "Iowan Old Style", "New York", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --bg: #efeadf;
  --surface: #f7f3ea;
  --disc: #fbf8f2;
  --land: #e4dccb;
  --ink: #23201a;
  --ink-2: #5b5447;
  --ink-3: #6b6356;
  --rule: rgba(35, 32, 26, 0.13);
  --rule-strong: rgba(35, 32, 26, 0.28);
  --ring: rgba(35, 32, 26, 0.20);
  --dot: #1d4b5c;
  --ray: #1d4b5c;
  --accent: #b5412a;
  --accent-soft: rgba(181, 65, 42, 0.12);
  --probe: #2b5f8f;
  --bar: #8b7f69;
  --bar-on: #1d4b5c;
  --focus: #2b5f8f;
  --selection: rgba(181, 65, 42, 0.20);
  --shadow: 0 1px 2px rgba(35, 32, 26, 0.06), 0 8px 24px rgba(35, 32, 26, 0.08);
  --scroll: rgba(35, 32, 26, 0.22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1015;
    --surface: #121820;
    --disc: #0f151c;
    --land: #1b2530;
    --ink: #ece5d6;
    --ink-2: #aaa293;
    --ink-3: #948e82;
    --rule: rgba(236, 229, 214, 0.10);
    --rule-strong: rgba(236, 229, 214, 0.24);
    --ring: rgba(236, 229, 214, 0.17);
    --dot: #e9d8ad;
    --ray: #e9d8ad;
    --accent: #f08a5d;
    --accent-soft: rgba(240, 138, 93, 0.14);
    --probe: #7fb4e0;
    --bar: #5d6670;
    --bar-on: #e9d8ad;
    --focus: #7fb4e0;
    --selection: rgba(240, 138, 93, 0.30);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
    --scroll: rgba(236, 229, 214, 0.20);
  }
}
:root[data-theme="dark"] {
  --bg: #0c1015;
  --surface: #121820;
  --disc: #0f151c;
  --land: #1b2530;
  --ink: #ece5d6;
  --ink-2: #aaa293;
  --ink-3: #948e82;
  --rule: rgba(236, 229, 214, 0.10);
  --rule-strong: rgba(236, 229, 214, 0.24);
  --ring: rgba(236, 229, 214, 0.17);
  --dot: #e9d8ad;
  --ray: #e9d8ad;
  --accent: #f08a5d;
  --accent-soft: rgba(240, 138, 93, 0.14);
  --probe: #7fb4e0;
  --bar: #5d6670;
  --bar-on: #e9d8ad;
  --focus: #7fb4e0;
  --selection: rgba(240, 138, 93, 0.30);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
  --scroll: rgba(236, 229, 214, 0.20);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--scroll) transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  font-variant-numeric: tabular-nums;
  overflow-x: hidden;
}
::selection { background: var(--selection); color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
a { color: inherit; }

.top {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
  padding: 18px 28px 10px;
}
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
h1 {
  margin: 0; font: 500 34px/1 var(--font-display); letter-spacing: -0.01em;
}
.lede { margin: 0; color: var(--ink-2); font-size: 13px; }
.lede b { font-weight: 600; color: var(--ink); }
.tools { display: flex; align-items: center; gap: 8px; }

.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; padding: 2px; }
.seg button {
  border: 0; background: transparent; padding: 4px 11px; border-radius: 999px; cursor: pointer;
  color: var(--ink-2); font-size: 12.5px;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--rule-strong); background: transparent; cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover, .seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"]:hover { color: var(--bg); }
.icon-btn svg { width: 16px; height: 16px; }
.text-btn {
  border: 1px solid var(--rule-strong); background: transparent; border-radius: 999px; padding: 5px 12px;
  cursor: pointer; color: var(--ink-2); font-size: 12.5px;
}
.text-btn:hover { color: var(--ink); }

.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 8px 28px;
  padding: 0 28px 28px; align-items: start;
}
.stage { min-width: 0; display: flex; flex-direction: column; align-items: center; }
.disc-wrap { position: relative; width: 100%; display: flex; justify-content: center; }
#disc { display: block; touch-action: manipulation; border-radius: 50%; cursor: crosshair; }
#disc:focus-visible { outline-offset: -6px; border-radius: 50%; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; max-width: 240px;
  background: var(--surface); border: 1px solid var(--rule-strong); box-shadow: var(--shadow);
  border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.35;
}
.tip .t-name { font: 600 15px/1.2 var(--font-display); }
.tip .t-meta { color: var(--ink-2); }

.timeline {
  width: 100%; max-width: 760px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 12px; margin-top: 6px; margin-bottom: 12px;
}
.play {
  width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg);
  display: grid; place-items: center; cursor: pointer;
}
.play svg { width: 14px; height: 14px; }
.track { position: relative; height: 40px; }
.years { position: absolute; left: 0; right: 0; bottom: -14px; display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); pointer-events: none; padding: 0 1px; }
.more-list { margin-top: 8px; }
#hist:focus-visible { outline-offset: 3px; }
#spark { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 26px; pointer-events: none; }
#year {
  position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; height: 22px;
  -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
}
#year::-webkit-slider-runnable-track { height: 2px; background: var(--rule-strong); border-radius: 2px; }
#year::-moz-range-track { height: 2px; background: var(--rule-strong); border-radius: 2px; }
#year::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--disc);
}
#year::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--disc); }
#year:focus-visible { outline-offset: 0; }
.when { font: 500 15px/1.1 var(--font-display); min-width: 7.5em; text-align: right; white-space: nowrap; }
.when small { display: block; font: 11.5px/1.3 var(--font-ui); color: var(--ink-3); }

.side {
  display: flex; flex-direction: column; gap: 22px; min-width: 0; padding: 6px 6px 6px 0;
  position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain;
}
.figures { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.fig { border-top: 1px solid var(--rule-strong); padding-top: 8px; min-width: 0; }
.fig .k { font-size: 12px; color: var(--ink-3); }
.fig .v { font: 500 28px/1.1 var(--font-display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fig .v .u { font-size: 15px; color: var(--ink-2); margin-left: 2px; }
.fig.wide { grid-column: span 2; }
:root { --pk-bg: var(--surface); --pk-ink: var(--ink); --pk-muted: var(--ink-3); --pk-line: var(--rule-strong);
  --pk-hover: var(--accent-soft); --pk-accent: var(--accent); --pk-shade: rgba(10, 10, 12, 0.45); }
.field .pk-trigger { border: 1px solid var(--rule-strong); background: transparent; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; color: var(--ink); }
.field .pk-trigger:hover { border-color: var(--ink-3); }

h2 { margin: 0 0 8px; font: 500 18px/1.2 var(--font-display); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sec-head h2 { margin: 0; }
#hist { display: block; width: 100%; height: 132px; cursor: crosshair; }
.readout { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); min-height: 1.45em; }
.readout b { color: var(--ink); font-weight: 600; }

.cities { list-style: none; margin: 0; padding: 0; }
.cities li + li { border-top: 1px solid var(--rule); }
.city-btn {
  width: 100%; display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline;
  padding: 7px 4px; background: transparent; border: 0; text-align: left; cursor: pointer; border-radius: 4px;
}
.city-btn:hover { background: var(--accent-soft); }
.city-btn .n { color: var(--ink-3); font-size: 12px; }
.city-btn .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.city-btn .nm span { color: var(--ink-3); font-size: 12px; margin-left: 4px; }
.city-btn .km { color: var(--ink-2); font-size: 12.5px; }
.city-btn .ct { font-weight: 600; min-width: 3em; text-align: right; }

.detail-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.detail-head h2 { font-size: 26px; margin: 0; }
.detail-sub { color: var(--ink-2); margin: 2px 0 12px; }
.chips { display: flex; gap: 8px 18px; flex-wrap: wrap; margin-bottom: 14px; }
.chip b { display: block; font: 500 20px/1.1 var(--font-display); }
.chip span { font-size: 12px; color: var(--ink-3); }
h3 { margin: 14px 0 6px; font: 600 12px/1.2 var(--font-ui); color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
.insts { list-style: none; margin: 0; padding: 0; }
.insts li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.insts li span:first-child { min-width: 0; }
.insts li span:last-child { color: var(--ink-2); }
.papers { list-style: none; margin: 0; padding: 0; }
.papers li { padding: 8px 0; border-top: 1px solid var(--rule); }
.papers a { font: 15px/1.3 var(--font-display); text-decoration: none; }
.papers a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px; }
.papers .m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.papers .m em { font-style: normal; color: var(--ink-2); }
.papers .m em.cite { display: block; margin-top: 1px; padding-left: 10px; border-left: 2px solid var(--rule-strong); }
.papers a, .papers .m { overflow-wrap: anywhere; }
.more { margin-top: 10px; }

dialog {
  border: 1px solid var(--rule-strong); border-radius: 12px; padding: 22px 24px; max-width: min(560px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 12, 16, 0.45); }
dialog h2 { font-size: 22px; }
dialog p, dialog li { color: var(--ink-2); }
dialog ul { padding-left: 18px; }
dialog .close { position: absolute; top: 14px; right: 14px; }
.foot { padding: 0 28px 28px; font-size: 12.5px; }
.foot a { color: var(--ink-2); text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
.foot a:hover { color: var(--ink); }
@media (max-width: 820px) { .foot { padding: 0 16px 24px; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr) 320px; gap: 8px 20px; padding: 0 20px 24px; }
  .top { padding: 16px 20px 8px; }
}
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 0 16px 24px; }
  .top { padding: 14px 16px 6px; }
  h1 { font-size: 30px; }
  .side { padding-top: 10px; position: static; max-height: none; overflow: visible; }
}
@media (max-width: 420px) {
  .timeline { gap: 8px; }
  .when { min-width: 0; font-size: 14px; }
  .fig .v { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
<!--PAPER_PICKER-->
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Reach</h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Distance scale">
      <button type="button" data-scale="linear" aria-pressed="true">Linear</button>
      <button type="button" data-scale="sqrt" aria-pressed="false">Square root</button>
    </div>
    <button type="button" class="text-btn" id="aboutBtn">About the data</button>
    <a class="icon-btn" href="index.html" aria-label="All views" title="All views"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg></a>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="Distance map">
    <div class="disc-wrap" id="discWrap">
      <canvas id="disc" tabindex="0" role="img" aria-label="Azimuthal equidistant map centred on the author’s city. Arrow keys step through cities by distance, Escape clears."></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="timeline">
      <button type="button" class="play" id="playBtn" aria-label="Play"></button>
      <div class="track">
        <canvas id="spark" aria-hidden="true"></canvas>
        <input type="range" id="year" aria-label="Citations through date">
        <div class="years" aria-hidden="true"><span id="yStart"></span><span id="yEnd"></span></div>
      </div>
      <div class="when" id="when"></div>
    </div>
  </section>

  <aside class="side">
    <div class="field"><button type="button" id="paperBtn"></button></div>
    <div class="figures" id="figures">
      <div class="fig"><div class="k">Median distance</div><div class="v" id="fMedian"></div></div>
      <div class="fig"><div class="k">Beyond 5,000 km</div><div class="v" id="fBeyond"></div></div>
      <div class="fig"><div class="k">Countries</div><div class="v" id="fCountries"></div></div>
      <div class="fig"><div class="k">Cities</div><div class="v" id="fCities"></div></div>
      <div class="fig wide"><div class="k">Farthest</div><div class="v" id="fFar"></div></div>
    </div>

    <section aria-labelledby="distH">
      <h2 id="distH">Distance</h2>
      <canvas id="hist" tabindex="0" role="slider" aria-label="Distance band" aria-valuemin="0" aria-valuenow="0"></canvas>
      <p class="readout" id="readout" aria-live="polite"></p>
    </section>

    <section id="listSec" aria-labelledby="citiesH">
      <div class="sec-head">
        <h2 id="citiesH">Cities</h2>
        <div class="seg" role="group" aria-label="Order cities">
          <button type="button" data-order="count" aria-pressed="true">Most</button>
          <button type="button" data-order="far" aria-pressed="false">Farthest</button>
        </div>
      </div>
      <ol class="cities" id="cityList"></ol>
      <button type="button" class="text-btn more-list" id="listMore" hidden>Show more</button>
    </section>

    <section id="detail" hidden>
      <p class="sr" id="dLive" aria-live="polite"></p>
      <div class="detail-head">
        <div>
          <h2 id="dName"></h2>
          <p class="detail-sub" id="dSub"></p>
        </div>
        <button type="button" class="icon-btn" id="dClose" aria-label="Close city">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="chips" id="dChips"></div>
      <p class="readout" id="dEmpty" hidden></p>
      <h3 id="dInstH">Institutions</h3>
      <ul class="insts" id="dInst"></ul>
      <h3 id="dPapH">Citing papers</h3>
      <ul class="papers" id="dPapers"></ul>
      <button type="button" class="text-btn more" id="dMore" hidden>Show more</button>
    </section>
  </aside>
</main>

<footer class="foot"><a href="index.html">All views</a></footer>

<dialog id="about" aria-labelledby="aboutH">
  <button type="button" class="icon-btn close" id="aboutClose" aria-label="Close">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
  </button>
  <h2 id="aboutH">About the data</h2>
  <div id="aboutBody"></div>
</dialog>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var D = window.CITATION_DATA;
  if (!D) { document.getElementById("lede").textContent = "Data file data.js could not be loaded."; return; }
  if (D.owner && document.title.indexOf(D.owner) < 0) document.title += " \u00b7 " + D.owner;

  // ---------- helpers ----------
  var NF = new Intl.NumberFormat("en-US");
  var fmt = function (n) { return NF.format(Math.round(n)); };
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var RAD = Math.PI / 180;
  var R_EARTH = 6371.0088;
  var HALF = Math.PI * R_EARTH; // km from home to antipode (the rim)
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  function svg(paths) {
    return '<svg viewBox="0 0 16 16" aria-hidden="true">' + paths + "</svg>";
  }
  var ICON_PLAY = svg('<path d="M4 2.5v11l9-5.5z" fill="currentColor"/>');
  var ICON_PAUSE = svg('<rect x="3.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor"/>');
  var ICON_SUN = svg('<circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></g>');
  var ICON_MOON = svg('<path d="M13.2 10.2A5.6 5.6 0 0 1 5.8 2.8a5.6 5.6 0 1 0 7.4 7.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>');

  // ---------- projection ----------
  var home = D.home;
  document.getElementById("disc").setAttribute("aria-label", "Azimuthal equidistant map centred on " + home.label + ". Arrow keys step through cities by distance, Escape clears.");
  var phi0 = home.lat * RAD, lam0 = home.lon * RAD, s0 = Math.sin(phi0), c0 = Math.cos(phi0);
  function project(lat, lon) { // -> [rho in 0..1, theta (bearing, rad, clockwise from north)]
    var phi = lat * RAD, dl = lon * RAD - lam0;
    var sp = Math.sin(phi), cp = Math.cos(phi), cdl = Math.cos(dl);
    var cc = Math.max(-1, Math.min(1, s0 * sp + c0 * cp * cdl));
    return [Math.acos(cc) / Math.PI, Math.atan2(Math.sin(dl) * cp, c0 * sp - s0 * cp * cdl)];
  }
  var scaleMode = "linear";
  function f(rho) { return scaleMode === "sqrt" ? Math.sqrt(rho) : rho; }
  function finv(u) { return scaleMode === "sqrt" ? u * u : u; }

  // ---------- asOf / time ----------
  var asOfDate = new Date(String(D.manifest && D.manifest.as_of || "").replace(/(\.\d{3})\d+/, "$1"));
  if (isNaN(asOfDate)) asOfDate = new Date();
  // time in years, with each month exactly a twelfth: the slider steps by month, so month k of year y is [y + k/12, y + (k+1)/12)
  function fracYear(y, m, d) { return y + (m + (d - 1) / new Date(Date.UTC(y, m + 1, 0)).getUTCDate()) / 12; }
  var T_ASOF = fracYear(asOfDate.getUTCFullYear(), asOfDate.getUTCMonth(), asOfDate.getUTCDate());
  function workTime(w) {     // the build dates every dated work, no later than the snapshot; undated works come last
    var p = w.date ? w.date.split("-").map(Number) : [];

    tip.hidden = false;
    var wrap = $("discWrap").getBoundingClientRect(), dr = disc.getBoundingClientRect();
    var px = dr.left - wrap.left + x, py = dr.top - wrap.top + y;
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var left = px + 14, topY = py + 14;
    if (left + tw > wrap.width) left = px - tw - 14;
    if (topY + th > wrap.height) topY = py - th - 14;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = Math.max(0, topY) + "px";
  }
  function discPoint(e) {
    var r = disc.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  disc.addEventListener("pointermove", function (e) {
    var p = discPoint(e);
    var dist = Math.hypot(p[0] - L.cx, p[1] - L.cy);
    var k = pickCity(p[0], p[1]);
    var km = dist <= L.R ? rToKm(dist) : null;
    if (k !== hoverCity || km !== hoverKm) {
      hoverCity = k; hoverKm = k >= 0 ? null : km;
      disc.style.cursor = k >= 0 ? "pointer" : "crosshair";
      showTip(k, p[0], p[1]);
      drawAll();
    } else if (k >= 0) showTip(k, p[0], p[1]);
  });
  disc.addEventListener("pointerleave", function () {
    hoverCity = -1; hoverKm = null; tip.hidden = true; drawAll();
  });
  disc.addEventListener("click", function (e) {
    var p = discPoint(e);
    var k = pickCity(p[0], p[1]);
    if (k >= 0) { select(k); focusOrder = null; }
    else if (selCity >= 0) select(-1);
  });
  disc.addEventListener("keydown", function (e) {
    var keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (e.key in keys) {
      e.preventDefault();
      if (!focusOrder) {
        focusOrder = [];
        for (var i = 0; i < NC; i++) if (cityCount[i]) focusOrder.push(i);
        focusOrder.sort(function (a, b) { return cKm[a] - cKm[b]; });
        focusPos = selCity >= 0 ? focusOrder.indexOf(selCity) : -1;
      }
      var len = focusOrder.length, d = keys[e.key];
      if (!len) return;
      focusPos = focusPos < 0 ? (d > 0 ? 0 : len - 1) : (focusPos + d + len) % len;    // from none: the nearest, or the farthest
      select(focusOrder[focusPos]);
      showTip(focusOrder[focusPos], cX[focusOrder[focusPos]], cY[focusOrder[focusPos]]);
    } else if (e.key === "Escape") {
      tip.hidden = true; select(-1);
    }
  });
  disc.addEventListener("blur", function () { tip.hidden = true; });

  // ---------- histogram pointer ----------
  hist.addEventListener("pointermove", function (e) {
    var r = hist.getBoundingClientRect();
    var x = Math.max(0, Math.min(r.width - 0.01, e.clientX - r.left));
    var b = Math.floor(x / r.width * NB);
    var edges = bandEdges(b);
    hoverBand = [edges[0], edges[1], b];
    hoverKm = finv(x / r.width) * HALF;
    drawAll();
  });
  hist.addEventListener("pointerleave", function () { if (document.activeElement !== hist) { hoverBand = null; hoverKm = null; drawAll(); } });
  function setBand(b) {
    b = Math.max(0, Math.min(NB - 1, b));
    var edges = bandEdges(b);
    hoverBand = [edges[0], edges[1], b];
    hoverKm = edges[1];
    hist.setAttribute("aria-valuenow", String(b));
    hist.setAttribute("aria-valuetext", fmt(edges[0]) + " to " + fmt(edges[1]) + " km, " + fmt(bandCount(b)) + " papers");
    drawAll();
  }
  hist.addEventListener("keydown", function (e) {
    var cur = hoverBand ? hoverBand[2] : -1;
    var step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (step) { e.preventDefault(); setBand(cur < 0 ? 0 : cur + step); }
    else if (e.key === "Home") { e.preventDefault(); setBand(0); }
    else if (e.key === "End") { e.preventDefault(); setBand(NB - 1); }
  });
  hist.addEventListener("focus", function () { if (!hoverBand) setBand(0); });
  hist.addEventListener("blur", function () { hoverBand = null; hoverKm = null; drawAll(); });

  // ---------- toolbar ----------
  document.querySelectorAll("[data-scale]").forEach(function (b) {
    b.addEventListener("click", function () {
      scaleMode = b.getAttribute("data-scale");
      document.querySelectorAll("[data-scale]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      placeCities(); buildStatic(); drawAll();
    });
  });
  document.querySelectorAll("[data-order]").forEach(function (b) {
    b.addEventListener("click", function () {
      listOrder = b.getAttribute("data-order");
      document.querySelectorAll("[data-order]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      updateList();
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && selCity >= 0 && document.activeElement !== disc && !$("about").open) { select(-1); }
  });

  // ---------- about ----------
  (function buildAbout() {
    var st = D.stats || {};
    var body = $("aboutBody");
    var asOfTxt = asOfDate.getUTCDate() + " " + MONTHS[asOfDate.getUTCMonth()] + " " + asOfDate.getUTCFullYear();
    body.append(el("p", null, "Papers citing " + D.owner + "'s Google Scholar list (" + (D.scholar_count || "") + " entries), matched to OpenAlex works and their citing works. Snapshot of " + asOfTxt + "; works dated later are shown at the snapshot date."));
    var ul = el("ul");
    [
      fmt(st.citing_works || D.works.length) + " citing papers; " + fmt(st.mapped_works || finalPlaced) + " have at least one author affiliation with a known city. " + fmt(st.no_affiliation_works != null ? st.no_affiliation_works : D.works.filter(function (w) { return !(w.inst && w.inst.length); }).length) + " have no affiliation and cannot be placed, so they are not on the map or in any distance figure.",
      "A citing paper counts once per city: a paper with authors in several cities counts in each, so city totals sum to more than the number of papers. Countries count each paper once per country.",
      "Distance figures (median, histogram, the within-distance readout) count each paper once, at its author city nearest to " + home.label + ".",
      "The rose outside the rim sums city citations per 10° of bearing, leaving out the home city.",
      "Map: azimuthal equidistant projection centred on " + (home.name || "") + ", " + home.label + ". Distance from the centre and bearing are true; the rim is the antipode, " + fmt(HALF) + " km away. The square-root scale keeps bearings and ring values but stretches the near field.",
      "Self-citations are included. Institution coordinates are usually the headquarters or main campus. " + nOwnerPapers + " of the owner's papers are in OpenAlex" + (D.unmatched && D.unmatched.length ? "; " + D.unmatched.length + " Scholar entries were not found there" : "") + ".",
      "Accent dots mark cities first reached in the 12 months before the shown date."
    ].forEach(function (t) { ul.append(el("li", null, t)); });
    body.append(ul);
  })();
  var about = $("about");
  $("aboutBtn").addEventListener("click", function () { about.showModal(); });
  $("aboutClose").addEventListener("click", function () { about.close(); });
  about.addEventListener("click", function (e) { if (e.target === about) about.close(); });

  // ---------- lede ----------
  function lede() {
    var l = $("lede"); l.innerHTML = "";
    l.append(el("b", null, fmt(works.length)), document.createTextNode(" papers citing " + (works === allWorks ? D.owner : "this paper") + ", measured from " + home.label));
  }
  lede();

  // ---------- paper ----------
  function setPaper(k) {
    if (playing) stop();
    paperKey = k || null;
    works = paperKey ? allWorks.filter(inPaper) : allWorks;
    settle(); rank(); countYears(); _roseMax = 0; lede();
    if (selCity >= 0 && !finalCity[selCity]) select(-1);
    setTime(sliderToT(Number(slider.value)), true);
  }
  var cited = Object.keys(paperGroups).map(function (k) { return paperGroups[k]; }).filter(function (g) { return g.n > 0; })
    .sort(function (a, b) { return b.n - a.n || a.title.localeCompare(b.title); });
  cited.forEach(function (g) { g.yearly = []; for (var y = Y0; y <= Y1; y++) g.yearly.push(0); });
  allWorks.forEach(function (o) {
    if (!isFinite(o.t)) return;
    var y = Math.floor(o.t);
    if (y >= Y0 && y <= Y1) o.keys.forEach(function (k) { if (paperGroups[k].yearly) paperGroups[k].yearly[y - Y0]++; });
  });
  var picker = PaperPicker({ button: $("paperBtn"), papers: cited, total: allWorks.length, allLabel: "All " + cited.length + " cited papers",
    onSelect: setPaper, here: "reach" });

  // ---------- init ----------
  readColors(); updateThemeBtn(); setPlayIcon();
  layout();
  if (picker.initial()) { picker.set(picker.initial()); setPaper(picker.initial()); }
  else setTime(Infinity, true);
  var resizeT = 0;
  function relayout() { clearTimeout(resizeT); resizeT = setTimeout(function () { layout(); drawAll(); }, 80); }
  window.addEventListener("resize", relayout);
  // the histogram and the spark can change width without a window resize (a scrollbar appears in the side column)
  var canvasRO = new ResizeObserver(function () { sizeCanvas(hist, hctx); sizeCanvas(spark, sctx); drawAll(); });
  canvasRO.observe(hist); canvasRO.observe(spark);
  (function watchDpr() {      // moved to a screen of another pixel density
    matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)").addEventListener("change", function () { relayout(); watchDpr(); }, { once: true });
  })();
})();
</script>
</body>
</html>
