<style>
/* Shared by the pages that read views.js (Constellation, Race, Regulars, Record). Tokens match Reach. */
:root {
  --font-display: "Iowan Old Style", "New York", "Palatino Linotype", Palatino, Georgia, serif;
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: #efeadf; --surface: #f7f3ea; --disc: #fbf8f2; --ink: #23201a; --ink-2: #5b5447; --ink-3: #6b6356;
  --rule: rgba(35, 32, 26, 0.13); --rule-strong: rgba(35, 32, 26, 0.28); --dot: #1d4b5c; --accent: #b5412a;
  --accent-soft: rgba(181, 65, 42, 0.12); --probe: #2b5f8f; --bar: #8b7f69; --bar-on: #1d4b5c; --focus: #2b5f8f;
  --selection: rgba(181, 65, 42, 0.20); --shadow: 0 1px 2px rgba(35, 32, 26, 0.06), 0 8px 24px rgba(35, 32, 26, 0.08);
  --scroll: rgba(35, 32, 26, 0.22); color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0c1015; --surface: #121820; --disc: #0f151c; --ink: #ece5d6; --ink-2: #aaa293; --ink-3: #948e82;
  --rule: rgba(236, 229, 214, 0.10); --rule-strong: rgba(236, 229, 214, 0.24); --dot: #e9d8ad; --accent: #f08a5d;
  --accent-soft: rgba(240, 138, 93, 0.14); --probe: #7fb4e0; --bar: #5d6670; --bar-on: #e9d8ad; --focus: #7fb4e0;
  --selection: rgba(240, 138, 93, 0.30); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
  --scroll: rgba(236, 229, 214, 0.20); color-scheme: dark;
}
:root { --pk-bg: var(--surface); --pk-ink: var(--ink); --pk-muted: var(--ink-3); --pk-line: var(--rule-strong);
  --pk-hover: var(--accent-soft); --pk-accent: var(--accent); --pk-shade: rgba(10, 10, 12, 0.45); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--scroll) transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); font-variant-numeric: tabular-nums; overflow-x: hidden; }
::selection { background: var(--selection); color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding: 18px 28px 10px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
h1 { margin: 0; font: 500 34px/1 var(--font-display); letter-spacing: -0.01em; }
.lede { margin: 0; color: var(--ink-2); font-size: 13px; }
.lede b { font-weight: 600; color: var(--ink); }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rule-strong); background: transparent; cursor: pointer; color: var(--ink-2); flex: none; }
.icon-btn:hover, .seg button:hover, .text-btn:hover { color: var(--ink); }
.seg button[aria-pressed="true"]:hover { color: var(--bg); }
.icon-btn svg { width: 16px; height: 16px; }
.text-btn { border: 1px solid var(--rule-strong); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.text-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 8px 28px; padding: 0 28px 28px; align-items: start; }
.stage { min-width: 0; position: relative; }
.stage canvas { display: block; }
.side { display: flex; flex-direction: column; gap: 22px; min-width: 0; padding: 6px 6px 6px 0; position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain; }
.figures { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.fig { border-top: 1px solid var(--rule-strong); padding-top: 8px; min-width: 0; }
.fig .k { font-size: 12px; color: var(--ink-3); }
.fig .v { font: 500 28px/1.1 var(--font-display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fig .v .u { font-size: 15px; color: var(--ink-2); margin-left: 3px; }
.fig .s { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fig.wide { grid-column: span 2; }
.fig.wide .v { font-size: 20px; line-height: 1.25; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
h2 { margin: 0 0 8px; font: 500 18px/1.2 var(--font-display); }
h3 { margin: 14px 0 6px; font: 600 12px/1.2 var(--font-ui); color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sec-head h2 { margin: 0; }
.readout { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); min-height: 1.45em; }
.readout b { color: var(--ink); font-weight: 600; }

/* a ranked list whose rows are buttons */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li + li { border-top: 1px solid var(--rule); }
.row-btn { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 7px 4px; background: transparent; border: 0; text-align: left; cursor: pointer; border-radius: 4px; }
.row-btn:hover, .row-btn.on { background: var(--accent-soft); }
.row-btn .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-btn .sub { grid-column: 1; color: var(--ink-3); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-btn .ct { grid-row: 1; grid-column: 2; font-weight: 600; text-align: right; }
.row-btn .when-s { grid-column: 2; color: var(--ink-3); font-size: 12px; text-align: right; }

.detail-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.detail-head h2 { font-size: 22px; line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
.detail-head h2 a { text-decoration: none; }
.detail-head h2 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.detail-sub { color: var(--ink-2); margin: 4px 0 12px; }
.chips { display: flex; gap: 8px 18px; flex-wrap: wrap; margin-bottom: 14px; }
.chip b { display: block; font: 500 20px/1.1 var(--font-display); }
.chip span { font-size: 12px; color: var(--ink-3); }
.papers { list-style: none; margin: 0; padding: 0; }
.papers li { padding: 8px 0; border-top: 1px solid var(--rule); }
.papers a { font: 15px/1.3 var(--font-display); text-decoration: none; overflow-wrap: anywhere; }
.papers a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 2px; }
.papers .m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.tip { position: absolute; pointer-events: none; z-index: 5; max-width: 280px; background: var(--surface); border: 1px solid var(--rule-strong); box-shadow: var(--shadow); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.35; }
.tip .t-name { font: 600 15px/1.2 var(--font-display); }
.tip .t-meta { color: var(--ink-2); }
.tip .t-meta + .t-meta { margin-top: 2px; }

.timeline { width: 100%; max-width: 760px; margin: 6px auto 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; cursor: pointer; flex: none; }
.play svg { width: 14px; height: 14px; }
.track { position: relative; height: 40px; }
.track .years { position: absolute; left: 0; right: 0; bottom: -14px; display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); pointer-events: none; padding: 0 1px; }
.track canvas { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 26px; pointer-events: none; }
.track input { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; height: 22px; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
.track input::-webkit-slider-runnable-track { height: 2px; background: var(--rule-strong); border-radius: 2px; }
.track input::-moz-range-track { height: 2px; background: var(--rule-strong); border-radius: 2px; }
.track input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.track input::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.track input:focus-visible { outline-offset: 0; }
.when { font: 500 15px/1.1 var(--font-display); min-width: 7.5em; text-align: right; white-space: nowrap; }
.when small { display: block; font: 11.5px/1.3 var(--font-ui); color: var(--ink-3); margin-top: 2px; }

.key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); align-items: center; }
.key i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); margin-right: 6px; }
.key i.several { background: var(--accent); }
.key i.hollow { background: transparent; box-shadow: inset 0 0 0 1.2px var(--dot); }
.field .pk-trigger { border: 1px solid var(--rule-strong); background: transparent; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; color: var(--ink); }
.field .pk-trigger:hover { border-color: var(--ink-3); }

dialog { border: 1px solid var(--rule-strong); border-radius: 12px; padding: 22px 24px; max-width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 12, 16, 0.45); }
dialog h2 { font-size: 22px; padding-right: 36px; }
dialog p, dialog li { color: var(--ink-2); }
dialog ul { padding-left: 18px; }
dialog .close { position: absolute; top: 14px; right: 14px; }

@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr) 320px; gap: 8px 20px; padding: 0 20px 24px; }
  .top { padding: 16px 20px 8px; }
}
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 0 16px 24px; }
  .top { padding: 14px 16px 6px; }
  h1 { font-size: 30px; }
  .side { padding-top: 10px; position: static; max-height: none; overflow: visible; }
}
@media (max-width: 420px) {
  .timeline { gap: 8px; }
  .when { min-width: 0; font-size: 14px; }
  .fig .v { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
<script>
/* window.Shell: theme, formatting, time, playback and small DOM helpers for the pages on views.js. */

    pause: svg('<rect x="3.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="0.8" fill="currentColor"/>'),
    sun: svg('<circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></g>'),
    moon: svg('<path d="M13.2 10.2A5.6 5.6 0 0 1 5.8 2.8a5.6 5.6 0 1 0 7.4 7.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>')
  };

  // ---------- theme: the same localStorage key as the other pages and al-folio ----------
  var darkMQ = matchMedia("(prefers-color-scheme: dark)"), themeFns = [], C = {};
  function stored() { try { var c = localStorage.getItem("theme"); return c === "light" || c === "dark" ? c : null; } catch (e) { return null; } }
  function applyTheme() { root.dataset.theme = stored() || (darkMQ.matches ? "dark" : "light"); }
  function readColors() {
    var cs = getComputedStyle(root);
    ["bg", "surface", "disc", "ink", "ink-2", "ink-3", "rule", "rule-strong", "dot", "accent", "accent-soft", "probe", "bar", "bar-on"].forEach(function (k) { C[k] = cs.getPropertyValue("--" + k).trim(); });
    C.dark = root.dataset.theme === "dark";
    C.display = cs.getPropertyValue("--font-display").trim(); C.ui = cs.getPropertyValue("--font-ui").trim();
  }
  function themeChanged() {
    readColors();
    var b = $("themeBtn");
    if (b) { b.innerHTML = C.dark ? ICON.sun : ICON.moon; b.setAttribute("aria-label", C.dark ? "Switch to light theme" : "Switch to dark theme"); }
    themeFns.forEach(function (f) { f(C); });
  }
  applyTheme(); readColors();
  darkMQ.addEventListener("change", function () { if (!stored()) { applyTheme(); themeChanged(); } });
  addEventListener("storage", function (e) { if (e.key === "theme") { applyTheme(); themeChanged(); } });

  // ---------- time ----------
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var snap = new Date(V.snapshot), sy = snap.getUTCFullYear();
  var tEnd = sy + (snap - Date.UTC(sy, 0, 1)) / (Date.UTC(sy + 1, 0, 1) - Date.UTC(sy, 0, 1));
  /* stored times are rounded to three decimals: never let the end of time fall before the last dated work */
  V.works.forEach(function (w) { if (w[0] != null && w[0] > tEnd) tEnd = w[0]; });
  /* calendar month (0-11) of a fractional year, through the day of the year it encodes */
  function monthOf(t) { var y = Math.floor(t), days = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365; return new Date(Date.UTC(y, 0, 1 + Math.round((t - y) * days))).getUTCMonth(); }
  function monthLabel(t) { return MONTHS[monthOf(t)] + " " + Math.floor(t); }
  var safeLink = function (u) { return /^https?:\/\//i.test(u || "") ? u : "#"; };
  /* a work's date as text; works known only by year say just the year */
  function workDate(w) { return w[0] == null ? "Undated" : (w[3] & 2) ? String(Math.floor(w[0])) : monthLabel(w[0]); }
  function upTo(sorted, t) { var lo = 0, hi = sorted.length; while (lo < hi) { var m = (lo + hi) >> 1; if (sorted[m] <= t) lo = m + 1; else hi = m; } return lo; }
  var allTimes = null;

    function q(p) { return ts.length ? ts[Math.min(ts.length - 1, Math.floor(p * (ts.length - 1)))] : t0 + (t1 - t0) * p; }

  }
  var linear = function (t0, t1) { return { at: function (p) { return t0 + (t1 - t0) * p; }, inverse: function (t) { return (t - t0) / (t1 - t0 || 1); } }; };

  /* Play button + range slider (+ optional yearly sparkline and readout).
     o: {button, slider, when, spark, t0, t1, start, seconds, clock, bars:[{t, n}], label(t) -> [main, small], onTime(t, playing)} */
  function player(o) {
    var time = o.t1, playing = false, raf = 0, clk = o.clock || clock(o.t0, o.t1);
    function setRange(t0, t1, c) { o.t0 = t0; o.t1 = t1; clk = c || clock(t0, t1); o.slider.min = t0.toFixed(2); o.slider.max = t1.toFixed(2); o.slider.step = "0.01"; }

      o.slider.value = time;

    }
    function drawSpark() {
      if (!o.spark || !o.bars) return;
      var s = size(o.spark), g = s.ctx, w = s.width, h = s.height, mx = Math.max.apply(null, o.bars.map(function (b) { return b.n; }).concat([1]));
      g.clearRect(0, 0, w, h);
      var bw = w / o.bars.length;
      o.bars.forEach(function (b, i) {
        if (!b.n) return;

        g.fillStyle = b.t <= time ? C["bar-on"] : C.bar; g.globalAlpha = b.t <= time ? 0.9 : 0.4;
        g.fillRect(i * bw + 1, h - bh, Math.max(1, bw - 2), bh);

    }
    function set(t, silent) { time = Math.min(o.t1, Math.max(o.t0, t)); if (!silent) o.onTime(time, playing); paint(); }
    function stop() { if (!playing) return; playing = false; cancelAnimationFrame(raf); button(); o.onTime(time, false); }
    function button() { o.button.innerHTML = playing ? ICON.pause : ICON.play; o.button.setAttribute("aria-label", playing ? "Pause" : "Play"); }
    function play() {

    return { set: set, stop: stop, play: play, setRange: setRange, get time() { return time; }, get playing() { return playing; } };
  }

  // ---------- canvas, tooltip, details, picker, dialog ----------
  /* backing store from the CSS box (or the given size), DPR capped at 2 */

    return {
      show: function (x, y, nodes) {

        var W = container.clientWidth, tw = t.offsetWidth, th = t.offsetHeight;

        t.style.top = (y - th - 12 < 4 ? y + 16 : y - th - 12) + "px";
      },
      hide: function () { t.hidden = true; }
    };
  }
  var detailsPromise = null;
  /* titles, bylines and links of the citing works, aligned with V.works; loaded on first use */
  function details() {
    if (!detailsPromise) detailsPromise = new Promise(function (ok, fail) {
      if (window.CITATION_VIEW_DETAILS) return ok(window.CITATION_VIEW_DETAILS);
      var s = document.createElement("script"); s.src = "views-details.js"; s.async = true;
      s.onload = function () { ok(window.CITATION_VIEW_DETAILS); };
      s.onerror = function () { detailsPromise = null; fail(new Error("views-details.js failed to load")); };
      document.head.appendChild(s);

    return detailsPromise;
  }
  function paperLink(i, text) { var p = V.papers[i], a = el("a", null, text || p.t); a.href = safeLink(p.link); a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }
  /* a short handle for a paper: the part before a colon ("BERT4Rec"), else the first words */
  function shortName(title, max) {
    max = max || 28; var i = title.indexOf(":");
    if (i > 1 && i <= max) return title.slice(0, i);
    if (title.length <= max) return title;
    var cut = title.slice(0, max), sp = cut.lastIndexOf(" ");
    return (sp > max * 0.5 ? cut.slice(0, sp) : cut).replace(/[\s,;:\-]+$/, "") + "…";
  }
  function picker(button, onSelect) {
    var cited = V.papers.map(function (p, i) { return { key: String(i), title: p.t, year: p.y, n: p.n, yearly: p.yr }; })
      .filter(function (p) { return p.n > 0; });     // same list as the map pages: papers with at least one citing paper
    return window.PaperPicker({ button: button, total: V.stats.works, allLabel: "All " + cited.length + " cited papers",
      papers: cited,
      onSelect: function (k) { onSelect(k === "" ? -1 : +k); } });
  }
  function about(button, dialog) {
    button.addEventListener("click", function () { dialog.showModal(); });
    dialog.querySelector(".close").addEventListener("click", function () { dialog.close(); });
    dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });
  }
  function seg(group, attr, onPick) {
    var buttons = [].slice.call(group.querySelectorAll("button"));
    buttons.forEach(function (b) { b.addEventListener("click", function () {
      buttons.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); }); onPick(b.dataset[attr]); }); });
  }
  /* run fn (which rebuilds lists inside root) and put focus back on the same row of the same list */
  function keepFocus(root, fn) {
    var a = document.activeElement, list = a && root.contains(a) && a.closest ? a.closest("ol, ul") : null, i = list && list.id ? [].indexOf.call(list.querySelectorAll("button, a"), a) : -1, id = list && list.id;
    fn();
    if (i < 0) return;
    var again = document.getElementById(id), items = again && !again.closest("[hidden]") ? again.querySelectorAll("button, a") : [];
    if (items.length) items[Math.min(i, items.length - 1)].focus({ preventScroll: true });
  }
  /* Escape clears a page's selection, unless a dialog or the picker is open (they take Escape themselves) */
  function onEscape(fn) { document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !document.querySelector("dialog[open], .pk-back")) fn(); }); }
  function announce(text) { var l = $("live"); if (l) l.textContent = text; }

  document.addEventListener("DOMContentLoaded", function () {
    var b = $("themeBtn");
    if (b) b.addEventListener("click", function () { try { localStorage.setItem("theme", C.dark ? "light" : "dark"); } catch (e) { root.dataset.theme = C.dark ? "light" : "dark"; themeChanged(); return; } applyTheme(); themeChanged(); });
    themeChanged();
    if (V.owner && document.title.indexOf(V.owner) < 0) document.title += " · " + V.owner;
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { themeFns.forEach(function (f) { f(C); }); });

  window.Shell = { V: V, C: C, $: $, fmt: fmt, el: el, reduce: reduce, ICON: ICON, tEnd: tEnd, monthLabel: monthLabel, monthOf: monthOf, safeLink: safeLink, keepFocus: keepFocus, workDate: workDate, upTo: upTo,
    clock: clock, linear: linear, player: player, size: size, tip: tip, details: details, paperLink: paperLink, shortName: shortName,
    picker: picker, about: about, onEscape: onEscape, seg: seg, announce: announce, onTheme: function (f) { themeFns.push(f); } };
})();
</script>
