<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Citation Constellation</title>
<script src="views.js"></script>
<!--SHELL-->
<!--PAPER_PICKER-->
<style>
.sky { position: relative; height: clamp(380px, calc(100vh - 150px), 900px); }
#sky { width: 100%; height: 100%; touch-action: none; cursor: grab; border-radius: 6px; }
#sky.dragging { cursor: grabbing; }
#sky.pointing { cursor: pointer; }
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
.zoom .icon-btn { background: var(--bg); }
.sky .key { position: absolute; left: 4px; bottom: 8px; pointer-events: none; background: var(--bg); padding: 4px 10px; border-radius: 999px; }
.rings { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin-top: 4px; }
.rings i { flex: 1; background: var(--bar-on); border-radius: 1px 1px 0 0; min-height: 1px; opacity: .85; }
.rings i.off { background: var(--bar); opacity: .4; }
.ring-years { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 3px; }
@media (max-width: 820px) { .sky { height: min(100vw, 70vh); } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Constellation</h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="tools">
    <button type="button" class="text-btn" id="aboutBtn">About the data</button>
    <a class="icon-btn" href="index.html" aria-label="All views" title="All views"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg></a>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="Star map">
    <div class="sky" id="skyWrap">
      <canvas id="sky" tabindex="0" role="application" aria-roledescription="star map" aria-label="Each cited paper is a star. The papers that cite it are dots in rings around it, one ring per year, the oldest inside. Arrow keys move, plus and minus zoom, zero resets, Escape clears the selection."></canvas>
      <div class="key" aria-hidden="true"><span><i></i>cites one</span><span><i class="several"></i>cites several</span></div>
      <div class="zoom">
        <button type="button" class="icon-btn" id="zIn" aria-label="Zoom in"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></button>
        <button type="button" class="icon-btn" id="zOut" aria-label="Zoom out"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button>
        <button type="button" class="icon-btn" id="zFit" aria-label="Show everything"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
      </div>
    </div>
    <div class="timeline">
      <button type="button" class="play" id="playBtn" aria-label="Play"></button>
      <div class="track">
        <canvas id="spark" aria-hidden="true"></canvas>
        <input type="range" id="time" aria-label="Citations through date">
        <div class="years" aria-hidden="true"><span id="yStart"></span><span id="yEnd"></span></div>
      </div>
      <div class="when" id="when" aria-live="off"></div>
    </div>
  </section>

  <aside class="side">
    <div class="field"><button type="button" id="paperBtn"></button></div>
    <div class="figures">
      <div class="fig"><div class="k">Citing papers</div><div class="v" id="fWorks"></div></div>
      <div class="fig"><div class="k">Cite two or more</div><div class="v" id="fMulti"></div></div>
    </div>

    <section id="pairsSec" aria-labelledby="pairsH">
      <h2 id="pairsH">Cited together</h2>
      <ol class="rows" id="pairs"></ol>
    </section>

    <section id="detail" hidden>
      <div class="detail-head">
        <h2 id="dName"></h2>
        <button type="button" class="icon-btn" id="dClose" aria-label="Close paper"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <p class="detail-sub" id="dSub"></p>
      <div class="chips" id="dChips"></div>
      <h3>By year</h3>
      <div class="rings" id="dRings" role="img"></div>
      <div class="ring-years" aria-hidden="true"><span id="rStart"></span><span id="rEnd"></span></div>
      <h3 id="dPartH">Cited together with</h3>
      <ol class="rows" id="dPartners"></ol>
    </section>
  </aside>
</main>

<dialog id="about" aria-labelledby="aboutH">
  <button type="button" class="icon-btn close" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  <h2 id="aboutH">About the data</h2>
  <div id="aboutBody"></div>
</dialog>
<span id="live" class="sr" aria-live="polite"></span>

<script>
(function () {

  var canvas = $("sky"), wrap = $("skyWrap"), tip = S.tip(wrap);
  var GA = Math.PI * (3 - Math.sqrt(5)), CORE = 0.17, TAU = Math.PI * 2;
  var t0 = V.years[0], tEnd = S.tEnd;

  var lists = P.map(function () { return []; });          // dated work indices per paper, in time order
  W.forEach(function (w, i) { if (w[0] != null) w[1].forEach(function (j) { lists[j].push(i); }); });
  var total = lists.reduce(function (a, l) { return a + l.length; }, 0);

          for (var f = 0; f < free.length; f++) {

        var sz = Math.max(1.15, Math.min(5, spacing * 0.56)), ox = sx(P[j].x), oy = sy(P[j].z), dimmed = focus && j !== selected;
        g.globalAlpha = dimmed ? 0.14 : pass ? 0.95 : C.dark ? 0.72 : 0.62;

      partners[selected].forEach(function (p) {

    var to = { x: x, y: y, k: Math.max(K_MIN, Math.min(K_MAX, k)) };
    if (S.reduce) { fly = null; view = to; invalidate(); return; }
    fly = { from: { x: view.x, y: view.y, k: view.k }, to: to, start: performance.now(), ms: 650 }; invalidate();
  }
  function fitStar(j) { flyTo(P[j].x, P[j].z, Math.min(width, height) * 0.36 / (base * P[j].r)); }
  function zoomAt(px, py, factor) {
    fly = null;
    var k = Math.max(K_MIN, Math.min(K_MAX, view.k * factor)), wx = view.x + (px - width / 2) / (base * view.k), wy = view.y + (py - height / 2) / (base * view.k);
    view.x = wx - (px - width / 2) / (base * k); view.y = wy - (py - height / 2) / (base * k); view.k = k; invalidate();
  }

  /* pointer position inside the canvas */
  function ex(e) { return e.clientX - canvas.getBoundingClientRect().left; }
  function ey(e) { return e.clientY - canvas.getBoundingClientRect().top; }

  // ---------- picking ----------
  function pick(mx, my) {
    var scale = base * view.k, best = -1, bd = PICK_R * PICK_R, j, i;
    for (j = 0; j < N; j++) {
      if (!shown(j)) continue;
      var ox = sx(P[j].x), oy = sy(P[j].z), R = P[j].r * scale;
      if (mx < ox - R - PICK_R || mx > ox + R + PICK_R || my < oy - R - PICK_R || my > oy + R + PICK_R) continue;
      for (i = first[j]; i < first[j + 1]; i++) {
        if (dTime[i] > time) continue;
        var ddx = ox + dx[i] * R - mx, ddy = oy + dy[i] * R - my, d = ddx * ddx + ddy * ddy;
        if (d < bd) { bd = d; best = i; }
      }
    }
    var star = -1, sd = Infinity;
    for (j = 0; j < N; j++) {
      if (!shown(j)) continue;
      var dd = Math.hypot(mx - sx(P[j].x), my - sy(P[j].z)), lim = Math.max(10, ringR(j, extent[j]) * scale + 3);
      if (dd < lim && dd < sd) { sd = dd; star = j; }
    }
    // a dot is only worth naming once dots are far enough apart to point at
    if (best >= 0) { var pj = dPaper[best], sp = P[pj].r * scale * Math.sqrt(Math.PI / lists[pj].length); if (sp < MIN_DOT_GAP) best = -1; }
    return { dot: best, star: best >= 0 ? dPaper[best] : star };
  }
  var det = null, detAsked = false, detFailed = false, pointer = null;     // pointer: the last hover position, or null
  function wantDetails() {             // asked once; the tooltip under the pointer is shown again when they arrive
    if (detAsked) return;
    detAsked = true;
    S.details().then(function (d) { det = d; }, function () { detFailed = true; })
      .then(function () { if (hoverDot >= 0 && pointer) showTip(pointer[0], pointer[1]); });
  }
  function showTip(mx, my) {
    if (hoverDot >= 0) {
      var wi = dWork[hoverDot], w = W[wi], nodes = [];
      if (!det) wantDetails();
      nodes.push(el("div", "t-name", det ? det[wi][0] || "Untitled" : detFailed ? "Title unavailable" : "Loading…"));
      nodes.push(el("div", "t-meta", (det && det[wi][1] ? det[wi][1] + " · " : "") + S.workDate(w)));
      if (w[1].length > 1) nodes.push(el("div", "t-meta", "Cites " + w[1].map(function (q) { return S.shortName(P[q].t, 24); }).join(", ")));
      tip.show(mx, my, nodes);
    } else if (hoverStar >= 0) {
      var p = P[hoverStar];
      tip.show(mx, my, [el("div", "t-name", p.t), el("div", "t-meta", (p.y ? p.y + " · " : "") + fmt(total_(hoverStar)) + " citing papers")]);
    } else tip.hide();
  }

  // ---------- pointer, wheel, keys ----------
  var pointers = new Map(), drag = null, pinch = null, moved = false;
  canvas.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;     // the primary button (or a touch) drags; the others are left to the browser
    canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [ex(e), ey(e)]); moved = false; fly = null; pointer = null;
    if (pointers.size === 1) drag = { x: ex(e), y: ey(e), vx: view.x, vy: view.y };
    else if (pointers.size === 2) { var a = [].concat.apply([], Array.from(pointers.values())); pinch = { d: Math.hypot(a[0] - a[2], a[1] - a[3]) || 1 }; drag = null; moved = true; }
  });
  canvas.addEventListener("pointermove", function (e) {
    var mx = ex(e), my = ey(e);
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [mx, my]);
    if (pinch && pointers.size === 2) {
      var a = [].concat.apply([], Array.from(pointers.values())), d = Math.hypot(a[0] - a[2], a[1] - a[3]) || 1;
      zoomAt((a[0] + a[2]) / 2, (a[1] + a[3]) / 2, d / pinch.d); pinch.d = d; return;
    }
    if (drag) {
      if (!moved && Math.hypot(mx - drag.x, my - drag.y) < 4) return;
      moved = true; canvas.classList.add("dragging"); tip.hide();
      view.x = drag.vx - (mx - drag.x) / (base * view.k); view.y = drag.vy - (my - drag.y) / (base * view.k); invalidate(); return;
    }
    if (e.pointerType === "touch") return;
    pointer = [mx, my]; hover(mx, my);
  });
  function hover(mx, my) {
    var hit = pick(mx, my);
    if (hit.dot !== hoverDot || hit.star !== hoverStar) { hoverDot = hit.dot; hoverStar = hit.star; invalidate(); }
    canvas.classList.toggle("pointing", hit.star >= 0 && P[hit.star].n > 0); showTip(mx, my);     // a star nobody cites yet is not selectable
  }
  function release(e) {
    if (!pointers.has(e.pointerId)) return;     // not a press this canvas took (another button)
    var wasDrag = moved; pointers.delete(e.pointerId); canvas.classList.remove("dragging");
    if (pointers.size < 2) pinch = null;
    if (!pointers.size) drag = null;
    if (e.type === "pointerup" && !wasDrag) { var hit = pick(ex(e), ey(e)), j = hit.star >= 0 && P[hit.star].n > 0 ? hit.star : -1; choose(j === selected ? -1 : j, true); }
  }
  canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("pointerleave", function () { pointer = null; if (hoverDot >= 0 || hoverStar >= 0) { hoverDot = hoverStar = -1; invalidate(); } tip.hide(); });
  canvas.addEventListener("wheel", function (e) { e.preventDefault(); zoomAt(ex(e), ey(e), Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022))); tip.hide(); }, { passive: false });
  canvas.addEventListener("dblclick", function (e) { e.preventDefault(); });
  canvas.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;     // browser zoom, history and other shortcuts stay the browser's
    var step = 60 / (base * view.k), k = e.key;
    if (k === "ArrowLeft") view.x -= step; else if (k === "ArrowRight") view.x += step; else if (k === "ArrowUp") view.y -= step; else if (k === "ArrowDown") view.y += step;
    else if (k === "+" || k === "=") zoomAt(width / 2, height / 2, 1.4); else if (k === "-" || k === "_") zoomAt(width / 2, height / 2, 1 / 1.4);
    else if (k === "0") flyTo(0, 0, 1);
    else return;
    e.preventDefault(); if (k !== "0") fly = null; invalidate();
  });
  $("zIn").addEventListener("click", function () { flyTo(view.x, view.y, view.k * 1.7); });
  $("zOut").addEventListener("click", function () { flyTo(view.x, view.y, view.k / 1.7); });
  $("zFit").addEventListener("click", function () { flyTo(0, 0, 1); });

  // ---------- side panel ----------
  var paperPicker = S.picker($("paperBtn"), function (j) { choose(j, true); }, "constellation");
  function choose(j, move) {
    if (j >= 0 && !P[j].n) return;      // a paper nobody cites yet: shown as a star, but not in the paper list, so not selectable
    var start = j >= 0 && ptimes[j].length ? Math.floor(ptimes[j][0]) : null;
    player.setStart(start);     // a replay starts at the paper's first citation
    if (start != null && player.time < start) { player.stop(); player.set(tEnd); }     // paused or playing before it: show the end, as Record does
    selected = j; paperPicker.set(j < 0 ? "" : String(j)); invalidate();
    if (j >= 0 && move) fitStar(j);
    panel(); if (j >= 0) S.announce(P[j].t + ", " + fmt(total_(j)) + " citing papers");
  }
  $("dClose").addEventListener("click", function () { choose(-1); canvas.focus(); });
  function row(name, sub, n, onClick) {
    var li = el("li"), b = el("button", "row-btn"); b.type = "button";
    b.append(el("span", "nm", name), el("span", "ct", fmt(n))); if (sub) b.append(el("span", "sub", sub));
    b.addEventListener("click", onClick); li.append(b); return li;
  }
  function panel() { S.keepFocus(document.querySelector(".side"), fill); }
  /* replace a list only when what it lists changed, so a replay does not rebuild a row under the pointer */
  function list(ol, items, key, make) {
    var sig = items.map(key).join("|");
    if (ol.dataset.sig === sig) return;
    ol.dataset.sig = sig; ol.replaceChildren.apply(ol, items.map(make));
  }
  function fill() {
    $("fWorks").textContent = fmt(stats.works);
    var mv = $("fMulti"); mv.replaceChildren(fmt(stats.multi), el("span", "u", stats.works ? Math.round(100 * stats.multi / stats.works) + "%" : ""));
    var open = selected >= 0; $("detail").hidden = !open; $("pairsSec").hidden = open;
    if (!open) {
      var top = pairs.map(function (p) { return { p: p, c: together(p) }; }).filter(function (o) { return o.c > 0; }).sort(function (a, b) { return b.c - a.c; }).slice(0, 10);
      list($("pairs"), top, function (o) { return o.p.a + "-" + o.p.b + ":" + o.c; }, function (o) {
        return row(S.shortName(P[o.p.a].t, 40), "with " + S.shortName(P[o.p.b].t, 44), o.c, function () {
          var a = P[o.p.a], b = P[o.p.b], span = Math.hypot(a.x - b.x, a.z - b.z) + a.r + b.r;
          choose(o.p.a, false); flyTo((a.x + b.x) / 2, (a.z + b.z) / 2, Math.min(width, height) * 0.84 / (base * span));
        });
      });
      return;
    }
    var p = P[selected], n = total_(selected);
    $("dName").replaceChildren(S.paperLink(selected));
    $("dSub").textContent = (p.y ? "Published " + p.y + " · " : "") + fmt(n) + " citing papers" + (isAll() ? "" : " by " + S.monthLabel(time));
    var shared = isAll() ? undatedMulti[selected] : 0; for (var i = first[selected]; i < first[selected + 1]; i++) if (dMulti[i] && dTime[i] <= time) shared++;
    var chip = el("div", "chip"); chip.append(el("b", null, fmt(shared)), el("span", null, "also cite another paper here"));
    $("dChips").replaceChildren(chip);
    var a = p.yr.findIndex(function (v) { return v > 0; }); if (a < 0) a = 0;
    var mx = Math.max.apply(null, p.yr.concat([1]));
    $("dRings").replaceChildren.apply($("dRings"), p.yr.slice(a).map(function (v, k) { var b = el("i", V.years[a + k] > time ? "off" : ""); b.style.height = Math.max(1, v / mx * 100) + "%"; b.title = V.years[a + k] + ": " + fmt(v); return b; }));
    $("dRings").setAttribute("aria-label", "Citing papers per year: " + p.yr.slice(a).map(function (v, k) { return V.years[a + k] + " " + v; }).join(", "));
    $("rStart").textContent = V.years[a]; $("rEnd").textContent = V.years[V.years.length - 1];
    var part = partners[selected].map(function (q) { return { o: q.a === selected ? q.b : q.a, c: together(q) }; }).filter(function (o) { return o.c > 0; }).sort(function (x, y) { return y.c - x.c; }).slice(0, 10);
    $("dPartH").hidden = !part.length;
    list($("dPartners"), part, function (o) { return selected + ">" + o.o + ":" + o.c; }, function (o) { return row(S.shortName(P[o.o].t, 46), P[o.o].y ? String(P[o.o].y) : "", o.c, function () { choose(o.o, true); }); });
  }

  // ---------- time ----------
  var perYear = V.years.map(function (y) { return { t: y, n: 0 }; });
  W.forEach(function (w) { if (w[0] != null) perYear[Math.floor(w[0]) - t0].n++; });
  $("yStart").textContent = t0; $("yEnd").textContent = V.years[V.years.length - 1];
  var panelTimer = 0;
  var player = S.player({ button: $("playBtn"), slider: $("time"), when: $("when"), spark: $("spark"), t0: t0, t1: tEnd, seconds: 20, bars: perYear,
    label: function (t) { return [t >= tEnd - 0.005 ? "All years" : S.monthLabel(t), ""]; },
    onTime: function (t, isPlaying) {
      time = t; playing = isPlaying; recount(); invalidate();
      if (pointer) hover(pointer[0], pointer[1]);     // the dot under a resting pointer may have come or gone
      if (!isPlaying) { panel(); return; }
      if (!panelTimer) panelTimer = setTimeout(function () { panelTimer = 0; panel(); }, 200);   // the lists need not follow every frame
    } });

  // ---------- about ----------
  $("lede").append(el("b", null, fmt(V.stats.works)), " papers citing " + V.owner + ", ringed around the " + P.filter(function (p) { return p.n > 0; }).length + " papers they cite");
  $("aboutBody").append(
    el("p", null, "Each star is one of " + V.owner + "’s papers. Every paper that cites it is a dot in its halo. The dots are laid out in the order they were published, from the centre outwards, so the halo is made of rings, one per calendar year. Every dot takes the same room, so the area of a ring is the number of citations that year."),
    el("p", null, fmt(V.stats.multi) + " of the " + fmt(V.stats.works) + " citing papers cite two or more of these papers. They are drawn in the accent colour, once in each halo, on the side of the ring that faces the other papers they cite. Within a ring their distance from the centre carries no further meaning."),
    el("p", null, "Stars are placed by a force layout, computed once when the data is built, in which papers that are often cited together attract each other. A line joins two halos when at least " + LINE_MIN + " papers cite both; only the strongest links that connect the stars are drawn, so the lines form figures rather than a mesh, each stopping short of the two stars it joins. Select a star to see the papers it is cited with most often."),
    el("p", null, "Versions of one paper (preprint, proceedings) are merged by title. " + V.stats.undated + " citing papers have no date: they are counted under “All years” but not drawn. Papers known only by year are spread over their year, each on a fixed day. Snapshot " + V.snapshot.slice(0, 10) + ", from OpenAlex."));
  S.about($("aboutBtn"), $("about"));

  S.onEscape(function () { if (selected >= 0) choose(-1); });
  S.onTheme(invalidate);
  new ResizeObserver(resize).observe(canvas);
  S.onDensityChange(resize);
  resize(); recount(); panel(); player.set(tEnd, true);
  if (paperPicker.initial() >= 0) choose(paperPicker.initial(), true);
})();
</script>
</body>
</html>
