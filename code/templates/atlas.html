<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="strict-origin-when-cross-origin">
__MAPLIBRE_CSS__
<title>Citation Atlas</title>
<script>try{if(new URLSearchParams(location.search).has('embed'))document.documentElement.dataset.embed='';}catch(e){}{let c=null;try{c=localStorage.getItem('theme');}catch(e){}document.documentElement.dataset.theme=c==="light"||c==="dark"?c:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}</script>
<style>
:root{
 --bg:#05070c;--bg-2:#0a0e16;--ink:#ece8df;--ink-2:#b9b6ae;--muted:#8a909c;--hair:#1c222d;--hair-2:#2a313d;
 --amber:#ffb76b;--amber-hi:#ffd9a8;--cool:#8fd3ff;
 --sel:#6b4a26;--link-line:#ffb76b66;--glass:#080b12cc;--hover:#ffffff0d;--pressed:#ffffff12;--tip-bg:#0c1119f2;--shadow:#000c;
 --play-hover:#ffb76b14;--bar-lit:#ffb76b8c;--panel-bg:linear-gradient(180deg,#080b12,#06080d);--select-hover:#3a4250;
 --home-bar:#8fd3ff44;--bar-from:#ffb76b55;--cites:#e2b98a;
 --serif:"Iowan Old Style","New York","Palatino",Georgia,serif;
 --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
 --panel:360px;--ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
:root[data-theme=light]{--bg:#f5f2ec;--bg-2:#fffdf9;--ink:#1d1b17;--ink-2:#4b473f;--muted:#6c675d;--hair:#e4ded3;--hair-2:#d2cabb;
 --amber:#b5560f;--amber-hi:#9a4508;--cool:#1d6aa8;--sel:#f2cfa6;--link-line:#b5560f55;--glass:#fbf9f5d9;--hover:#0000000a;--pressed:#0000000f;
 --tip-bg:#fffdf9f5;--shadow:#5a4a3040;--play-hover:#b5560f12;--bar-lit:#d98a4a;--panel-bg:linear-gradient(180deg,#f8f5ef,#f3efe7);--select-hover:#bfb6a5;
 --home-bar:#1d6aa844;--bar-from:#b5560f40;--cites:#8a4a14;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--sel);color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration-color:var(--link-line);text-underline-offset:.22em}
a:hover{text-decoration-color:var(--amber)}
:focus-visible{outline:1.5px solid var(--amber);outline-offset:3px;border-radius:3px}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
li{list-style:none}
.num{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) var(--panel);grid-template-rows:auto minmax(0,1fr) auto;height:100svh;min-height:640px}
.head{grid-column:1;padding:34px 40px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:32px}
.acts{flex:none;display:flex;gap:4px;margin-top:2px}
.theme .sun{display:none}.theme[data-mode=dark] .sun{display:block}.theme[data-mode=dark] .moon{display:none}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.1vw,46px);line-height:1.18;letter-spacing:-.012em}
h1 em{font-style:normal;color:var(--amber-hi)}
h1 .keep{display:inline-block;white-space:nowrap}
h1 .ptitle{display:block;margin-top:10px;font-size:max(17px,.46em);line-height:1.35;letter-spacing:0;color:var(--ink-2);max-width:46ch;text-wrap:balance}
.sub{margin-top:12px;color:var(--ink-2);font-size:14px}
.sub .num{font-size:15px;color:var(--ink)}
.map{grid-column:1;position:relative;min-height:0}
#tiles{position:absolute;inset:0;background:var(--bg)}
html[data-offline] :is(.find,.zoom,.modes,.timeline,.panel,.notes){display:none}
#tiles .offline{position:absolute;inset:0;display:grid;place-content:center;padding:20px;text-align:center;color:var(--ink-2);font-size:14px}
.map canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.maplibregl-ctrl-attrib{font:11px/1.4 var(--sans)!important;background:var(--glass)!important;color:var(--muted)!important}
.maplibregl-ctrl-attrib a{color:var(--ink-2)!important}
.maplibregl-ctrl-attrib-button{filter:var(--attrib-icon,none)}
html[data-theme=dark]{--attrib-icon:invert(1)}
.maplibregl-canvas:focus-visible{outline:1.5px solid var(--amber);outline-offset:-2px}
.map canvas.drag{cursor:grabbing}
.map canvas.hit{cursor:pointer}
.zoom{position:absolute;left:40px;bottom:14px;display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:10px;background:var(--glass);border:1px solid var(--hair)}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);transition:background .2s,color .2s}
.icon:hover{background:var(--hover);color:var(--ink)}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.modes{position:absolute;top:10px;right:24px;display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);backdrop-filter:blur(6px)}
.modes button{padding:4px 13px;border-radius:999px;font-size:12.5px;color:var(--muted);transition:color .2s,background .3s var(--ease)}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed=true]{background:var(--pressed);color:var(--ink)}
.inst button{all:unset;cursor:pointer;flex:1;min-width:0}
.inst button:hover,.inst button:focus-visible{color:var(--ink);text-decoration:underline;text-decoration-color:var(--link-line)}
.feed{position:absolute;right:24px;bottom:52px;width:min(330px,40%);display:flex;flex-direction:column;gap:10px;pointer-events:none}
.feed li{animation:feed-in .5s var(--ease) both;transition:opacity .4s}
.feed li:nth-child(2){opacity:.55}.feed li:nth-child(3){opacity:.25}
.feed b{display:block;font-weight:500;font-size:13px;color:var(--amber-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed span{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.feed p{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
@keyframes feed-in{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.find{position:absolute;left:26px;top:10px;width:min(330px,calc(100% - 200px));z-index:3}
.find>svg{position:absolute;z-index:1;left:12px;top:11px;width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;pointer-events:none}
.find input{width:100%;height:38px;padding:0 12px 0 34px;border-radius:999px;border:1px solid var(--hair-2);background:var(--glass);backdrop-filter:blur(8px);font-size:13.5px;outline:none;transition:border-color .2s}
.find input:focus{border-color:var(--amber)}
.find input::placeholder{color:var(--muted)}
.find input::-webkit-search-cancel-button{display:none}
.find ul{margin-top:6px;padding:6px;border-radius:12px;border:1px solid var(--hair-2);background:var(--bg-2);box-shadow:0 14px 40px -12px var(--shadow);max-height:340px;overflow:auto}
.find li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.find li[aria-selected=true],.find li:hover{background:var(--hover)}
.find .fm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find .fm b{font-weight:500;color:var(--ink)}
.find .fm small{color:var(--muted);font-size:12px;margin-left:7px}
.find .fk{flex:none;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.find .find-empty{color:var(--muted);cursor:default}
.tip{position:absolute;pointer-events:none;padding:9px 12px 8px;background:var(--tip-bg);border:1px solid var(--hair-2);border-radius:8px;font-size:13px;line-height:1.45;white-space:nowrap;box-shadow:0 10px 30px -8px var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .2s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-weight:500;color:var(--ink)}
.tip span{color:var(--ink-2)}
.tip .num{color:var(--amber-hi);font-size:14px}

/* timeline */
.timeline{grid-column:1;display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:18px;padding:6px 40px 26px}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--hair-2);display:grid;place-items:center;color:var(--ink);transition:border-color .2s,background .2s}
.play:hover{border-color:var(--amber);background:var(--play-hover)}
.play svg{width:14px;height:14px;fill:currentColor}
.year{font-family:var(--serif);font-size:34px;line-height:1;min-width:2.6em;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.track{position:relative;height:58px;cursor:ew-resize;touch-action:none}
.bars{position:absolute;inset:0 0 18px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;background:var(--hair-2);border-radius:1.5px 1.5px 0 0;min-height:2px;transition:background .25s}
.bar.lit{background:var(--bar-lit)}
.bar.now{background:var(--amber)}
.ticks{position:absolute;left:0;right:0;bottom:0;height:14px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.cursor{position:absolute;top:-4px;bottom:16px;width:1px;background:var(--amber-hi);pointer-events:none}
.cursor::after{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--amber-hi)}

/* panel */
.panel{grid-column:2;grid-row:1/4;border-left:1px solid var(--hair);background:var(--panel-bg);display:flex;flex-direction:column;min-height:0}
.panel-top{padding:30px 26px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.select{position:relative}
.select .pk-trigger{color:var(--ink);background:var(--bg-2);border:1px solid var(--hair-2);border-radius:9px;height:40px;padding:0 10px 0 13px;font-size:14px;cursor:pointer}
.select .pk-trigger:hover{border-color:var(--select-hover)}
:root{--pk-bg:var(--bg-2);--pk-ink:var(--ink);--pk-muted:var(--muted);--pk-line:var(--hair-2);--pk-hover:var(--hover);--pk-accent:var(--amber);--pk-shade:var(--shadow)}
.seg{display:flex;gap:18px;border-bottom:1px solid var(--hair)}
.seg button{padding:8px 0 10px;color:var(--muted);font-size:14px;border-bottom:1.5px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.seg button[aria-selected=true]{color:var(--ink);border-color:var(--amber)}
.seg button:hover{color:var(--ink)}
.search{width:100%;background:transparent;border:0;border-bottom:1px solid var(--hair);padding:6px 0 9px;font-size:14px;outline:none}
.search:focus{border-color:var(--amber)}
.search::placeholder{color:var(--muted)}
.scroll{overflow:auto;overscroll-behavior:contain;padding:0 26px 26px;flex:1;min-height:0}
.scroll.detail{padding-top:26px}
.row.home .ct{color:var(--cool)}
.row.home i b{background:linear-gradient(90deg,var(--home-bar),var(--cool))}
.row{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;align-items:baseline;column-gap:10px;width:100%;text-align:left;padding:10px 0 9px;position:relative;color:var(--ink-2);transition:color .15s}
.row:hover,.row.hl{color:var(--ink)}
.row .rk{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--muted);font-size:12px;margin-left:7px}
.row .ct{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;color:var(--ink);font-size:15px}
.row i{grid-column:2/4;height:2px;margin-top:7px;background:var(--hair);border-radius:1px;overflow:hidden;display:block}
.row i b{display:block;height:100%;background:linear-gradient(90deg,var(--bar-from),var(--amber));transform-origin:left;transition:transform .5s var(--ease)}
.row:hover i b,.row.hl i b{background:var(--amber-hi)}
.more{margin-top:14px;color:var(--muted);font-size:13px}
.more:hover{color:var(--ink)}
.empty{color:var(--muted);padding:18px 0;font-size:14px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin:4px 0 18px}
.back:hover{color:var(--ink)}
.back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.d-name{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.d-meta{color:var(--muted);font-size:13px;margin-top:6px}
.d-count{margin-top:18px;color:var(--ink-2);font-size:14px}
.d-count .num{font-size:26px;color:var(--amber-hi);margin-right:5px}
h3{font-size:12px;font-weight:500;color:var(--muted);margin:30px 0 6px;letter-spacing:.06em}
.inst{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--hair)}
.inst .num{color:var(--ink)}
.inst.more-inst{color:var(--muted);border-bottom:0}
.paper{padding:15px 0 14px;border-bottom:1px solid var(--hair)}
.paper a{display:block;font-size:14px;line-height:1.5;color:var(--ink);text-decoration:none}
.paper a:hover{color:var(--amber-hi)}
.paper p{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.55}
.paper .cites{display:block;margin-top:2px}
.paper p .yr{color:var(--ink-2);font-variant-numeric:tabular-nums;margin-right:8px}
.paper .cites{color:var(--cites)}
.paper.loading{color:var(--muted);font-size:13px}

/* notes */
.notes{max-width:1180px;margin:0 auto;padding:88px 40px 72px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:72px;border-top:1px solid var(--hair)}
.notes h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;margin-bottom:20px}
.notes p{color:var(--ink-2);font-size:14.5px;line-height:1.85;max-width:62ch}
.notes p+p{margin-top:12px}
.notes .num{color:var(--ink)}
.notes ul{margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.notes li{padding:9px 0;border-bottom:1px solid var(--hair)}
.notes details{margin-top:22px;font-size:13.5px;color:var(--ink-2)}
.notes summary{cursor:pointer;color:var(--ink);padding:6px 0}
.notes details li{padding:6px 0}
.foot{max-width:1180px;margin:0 auto;padding:0 40px 40px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:1100px){:root{--panel:300px}}
/* embedded in another page (al-folio): match the host's background, text and rules; size to the frame */
.full{display:none}
html[data-embed]{--bg:#1c1c1d;--bg-2:#232325;--panel-bg:#1c1c1d;--glass:#1c1c1dd9;--ink:#e8e8e8;--hair:#2c2c30;--hair-2:#3b3b40}
html[data-embed][data-theme=light]{--bg:#fff;--bg-2:#fff;--panel-bg:#fff;--glass:#ffffffe0;--ink:#111;--hair:#e7e4de;--hair-2:#d8d3ca}
html[data-embed] .acts,html[data-embed] .notes,html[data-embed] .foot,html[data-embed] .feed{display:none}
html[data-embed] .full{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:13px;color:var(--muted);text-decoration:none;margin-top:6px}
html[data-embed] .full:hover{color:var(--ink)}
html[data-embed] .full svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
html[data-embed] .stage{height:640px;min-height:0}
html[data-embed] .head{padding:22px 26px 0}
html[data-embed] h1{font-size:clamp(24px,3vw,34px)}
html[data-embed] .timeline{padding:4px 26px 18px}
html[data-embed] .zoom{left:26px}
html[data-embed] .panel-top{padding:22px 20px 12px}
html[data-embed] .scroll{padding:0 20px 20px}
@media (max-width:760px){
 html[data-embed] .zoom{left:20px}
 .find{left:20px;right:20px;width:auto;top:-96px}
 html[data-embed] .stage{height:auto}
 html[data-embed] .head{flex-wrap:wrap;gap:10px 20px}
 html[data-embed] .full{order:3}
 .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;height:auto;min-height:0}
 .head{padding:26px 20px 4px;gap:12px}
 h1{font-size:clamp(26px,7vw,34px)}
 .map{grid-row:2;aspect-ratio:2.05/1;margin-top:8px}
 .map{margin-top:100px;aspect-ratio:1.35/1}
 .zoom{left:20px;right:auto;top:-46px;bottom:auto;flex-direction:row;padding:1px}
 .modes{top:-44px;right:20px}
 .feed{display:none}
 .icon{width:32px;height:32px}
 .timeline{grid-row:3;padding:4px 20px 20px;gap:12px}
 .year{font-size:26px}
 .panel{grid-column:1;grid-row:4;border-left:0;border-top:1px solid var(--hair)}
 .panel-top{padding:24px 20px 12px}
 .scroll{padding:0 20px 24px;overflow:visible}
 .scroll.detail{padding-top:22px}
 .notes{grid-template-columns:1fr;gap:44px;padding:60px 20px 52px}
 .foot{padding:0 20px 32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage">
 <header class="head">
  <div>
   <h1 id="headline"></h1>
   <p class="sub" id="sub"></p>
  </div>
  <a class="full" href="atlas.html" target="_top">Open full page<svg viewBox="0 0 14 14"><path d="M5 3h6v6M11 3 3.5 10.5"/></svg></a>
  <span class="acts"><a class="icon home" href="index.html" aria-label="All views" title="All views"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5M4 6.5V13h3V9.5h2V13h3V6.5"/></svg></a>
  <button class="icon theme" id="theme" aria-label="Switch theme"><svg class="sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><svg class="moon" viewBox="0 0 16 16"><path d="M13 9.6A5.5 5.5 0 0 1 6.4 3a5.5 5.5 0 1 0 6.6 6.6z"/></svg></button></span>
 </header>
 <div class="map" id="mapbox">
  <div id="tiles"></div>
  <canvas id="map" role="img" aria-label="World map of the cities whose institutions cite these papers. Exact counts are in the city list."></canvas>
  <div class="modes" id="modes" role="group" aria-label="Projection" hidden><button id="m-flat" aria-pressed="true">Map</button><button id="m-globe" aria-pressed="false">Globe</button></div>
  <div class="find" role="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input id="find" type="search" placeholder="Find a city, country or institution" aria-label="Find a city, country or institution" role="combobox" aria-expanded="false" aria-controls="find-list" aria-autocomplete="list" autocomplete="off" spellcheck="false"><ul id="find-list" role="listbox" aria-label="Matches" hidden></ul><span class="sr-only" id="find-status" aria-live="polite"></span></div>
  <div class="zoom">
   <button class="icon" id="zin" aria-label="Zoom in"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
   <button class="icon" id="zout" aria-label="Zoom out"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
   <button class="icon" id="zreset" aria-label="Reset view"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
  </div>
    <ol class="feed" id="feed" aria-hidden="true"></ol>
  <div class="tip" id="tip" aria-hidden="true"></div>
 </div>
 <div class="timeline">
  <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 14 14" id="play-icon"><path d="M3 1.5v11l9.5-5.5z"/></svg></button>
  <div class="year" id="year" aria-hidden="true"></div>
  <div class="track" id="track" role="slider" tabindex="0" aria-label="Time" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
   <div class="bars" id="bars"></div><div class="ticks" id="ticks"></div><div class="cursor" id="cursor"></div>
  </div>
 </div>
 <aside class="panel" aria-label="Cities, institutions and countries ranked">
  <div class="panel-top" id="panel-top">
   <div class="select"><button type="button" id="paper"></button></div>

 tip.classList.add('on');const tw=tip.offsetWidth;tip.style.left=Math.min(W-tw-8,Math.max(8,e.point.x+14))+'px';tip.style.top=Math.max(8,e.point.y-54)+'px';});

map.on('click',e=>{const hit=nearest(e.point.x,e.point.y);if(!hit)return;listOpener=null;S.stack=[{kind:'city',id:hit.c.id}];openCity(hit.c.id,false);scroll.querySelector('.back')?.focus({preventScroll:true});if(innerWidth<=760)$('scroll').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});});

function focusCity(c){faceCity(c);}
function focusCountry(code){const cs=D.cities.filter(c=>c.country===code).sort((a,b)=>b.count-a.count);if(!cs.length)return;if(projBusy){pendingFocus=()=>focusCountry(code);return;}
 if(projMode==='globe'){faceCity(cs[0]);return;}
 const ref=cs[0].lon;let b=null;for(const c of cs){let l=c.lon;while(l-ref>180)l-=360;while(l-ref<-180)l+=360;b=b?[[Math.min(b[0][0],l),Math.min(b[0][1],c.lat)],[Math.max(b[1][0],l),Math.max(b[1][1],c.lat)]]:[[l,c.lat],[l,c.lat]];}
 map.fitBounds(b,{padding:70,maxZoom:5.5,duration:reduce?0:900});}
/* ---------- search: cities, countries and institutions; choosing one moves the map and opens its detail ---------- */
const FIND=(()=>{
 const fold=s=>(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase();
 const instCity=new Map(),instN=new Map(),countryN=new Map();
 for(const c of D.cities)for(const i of c.institutions)if(!instCity.has(i))instCity.set(i,c);
 for(const i of instCity.keys())if(D.institutions[i]?.n)instN.set(i,D.institutions[i].n);
 for(const w of D.works){
  for(const k of new Set(w.cities.map(id=>cityById.get(id)?.country).filter(Boolean)))countryN.set(k,(countryN.get(k)||0)+1);}
 const items=[];
 const nameN=new Map();for(const c of D.cities)nameN.set(c.name,(nameN.get(c.name)||0)+1);
 for(const c of D.cities){const cn=regionName(c.country),where=[nameN.get(c.name)>1&&c.region!==c.name?c.region:'',cn===c.name?'':cn].filter(Boolean).join(', ');items.push({kind:'City',label:c.name,sub:where,n:c.count,city:c,text:fold(c.name+' '+cn+' '+(c.region||''))});}
 for(const [k,n] of countryN)items.push({kind:'Country',label:regionName(k),sub:'',n,code:k,text:fold(regionName(k)+' '+k)});
 for(const [i,n] of instN){const c=instCity.get(i),name=D.institutions[i]?.display_name||i;items.push({kind:'Institution',label:name,sub:c.name,n,city:c,id:i,text:fold(name+' '+c.name)});}
 return {items,fold};})();
const findInput=$('find'),findList=$('find-list'),findStatus=$('find-status');let findHits=[],findAt=-1;
function findClose(){findList.hidden=true;findInput.setAttribute('aria-expanded','false');findInput.removeAttribute('aria-activedescendant');findAt=-1;}
function findRender(){
 const q=FIND.fold(findInput.value.trim());findList.replaceChildren();if(!q){findHits=[];findStatus.textContent='';findClose();return;}
 const rank=it=>it.text.startsWith(q)?0:(' '+it.text).includes(' '+q)?1:2;
 findHits=FIND.items.filter(it=>it.text.includes(q)).sort((a,b)=>rank(a)-rank(b)||b.n-a.n).slice(0,8);
 if(!findHits.length){const li=el('li','find-empty','No matching place or institution');li.setAttribute('role','option');li.setAttribute('aria-disabled','true');findList.append(li);}
 findStatus.textContent=findHits.length?`${findHits.length} match${findHits.length===1?'':'es'}`:'No matches';
 findHits.forEach((it,i)=>{const li=el('li');li.id='find-'+i;li.setAttribute('role','option');li.setAttribute('aria-selected','false');
  const main=el('span','fm');main.append(el('b',null,it.label));if(it.sub)main.append(el('small',null,it.sub));
  li.append(main,el('span','fk',fmt(it.n)));li.title=it.kind+' · '+fmt(it.n)+' citing papers';
  li.addEventListener('mousedown',e=>{e.preventDefault();findPick(i);});findList.append(li);});
 findAt=-1;findList.hidden=false;findInput.setAttribute('aria-expanded','true');}
function findMove(d){if(!findHits.length)return;findAt=(findAt+d+findHits.length)%findHits.length;
 [...findList.children].forEach((li,i)=>li.setAttribute('aria-selected',String(i===findAt)));findInput.setAttribute('aria-activedescendant','find-'+findAt);
 findList.children[findAt]?.scrollIntoView({block:'nearest'});}
function findPick(i){const it=findHits[i];if(!it)return;findInput.value=it.label;findClose();
 // show everything up to today, for every paper, so the chosen place has its full detail
 setPlaying(false);if(S.t<TEND){S.t=TEND;syncTime();}
 if(S.filter)setFilter('');
 listOpener=null;
 if(it.kind==='Country'){S.stack=[{kind:'country',id:it.code}];openCountry(it.code,false);focusCountry(it.code);}
 else if(it.kind==='Institution'){S.stack=[{kind:'inst',id:it.id}];openInst(it.id,false);faceInst(it.id);}
 else{S.stack=[{kind:'city',id:it.city.id}];openCity(it.city.id,false);focusCity(it.city);}
 kick(1200);}
findInput.addEventListener('input',findRender);
findInput.addEventListener('focus',()=>{if(findInput.value.trim())findRender();});
findInput.addEventListener('blur',()=>setTimeout(findClose,120));
findInput.addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'){e.preventDefault();if(findList.hidden)findRender();findMove(1);}
 else if(e.key==='ArrowUp'){e.preventDefault();findMove(-1);}
 else if(e.key==='Enter'){e.preventDefault();findPick(findAt>=0?findAt:0);}
 else if(e.key==='Escape'){if(!findList.hidden){e.preventDefault();e.stopPropagation();findClose();}}});

addEventListener('citation-details',()=>{const top=S.stack[S.stack.length-1];if(top&&top.kind!=='country')openTop(top,true);});
/* ---------- live feed: the paper behind each city that lights up ---------- */
const feed=$('feed');let feedLast=null,feedAt=0,feedTimer=0;
function syncFeed(){
 if(!(S.playing||scrubbing)||!V.events.length)return;
 const now=performance.now();if(now-feedAt<420)return;
 const i=upto(V.eventT,S.t)-1;if(i<0)return;const x=V.events[i];if(x===feedLast)return;feedLast=x;feedAt=now;
 const w=x.firstWork,inst=new Set(x.c.institutions),here=w?w.inst.filter(id=>inst.has(id)):[];
 const li=el('li');li.append(el('b',null,D.institutions[here[0]]?.display_name||x.c.name),el('span',null,x.c.name+' · '+regionName(x.c.country)+' · '+Math.floor(x.first)),el('p',null,w?.title||''));
 feed.prepend(li);while(feed.children.length>3)feed.lastChild.remove();
 clearTimeout(feedTimer);feedTimer=setTimeout(()=>feed.replaceChildren(),2600);
}

/* ---------- notes ---------- */
(function notes(){
 const s=D.stats,m=$('method'),c=$('coverage'),P=(...parts)=>{const p=el('p');p.append(...parts);return p;};
 m.append(P(`Starting from the ${D.scholar_count} papers listed on ${D.owner}'s Google Scholar profile, each title was matched in OpenAlex and kept only when the byline includes ${D.owner}: ${groups.length} papers (${D.targets.length} records, preprint and published versions kept separately). Every paper citing them was then collected and de-duplicated by OpenAlex ID.`),
  P('Each citing paper is placed at the cities of its authors\' institutions at the time. A paper counts once per city; a collaboration across cities counts in each, so city totals add up to more than the number of papers. Self-citations are included.'),
  P('Light and arc intensity follow the square root of a city\'s count. Arcs follow great circles from ',D.home?.name||'the author\'s institution',' and show a connection, not a route. Basemap: ',TILES.credit,'.'));
 const pct=v=>(100*v/Math.max(1,s.citing_works)).toFixed(1)+'%';
 c.append(P('Of ',num(s.citing_works),' citing papers, ',num(s.mapped_works),` (${pct(s.mapped_works)}) can be placed in a city; `,num(s.no_affiliation_works),' have no affiliation and cannot be placed.'),
  P(D.manifest.complete?'All citing papers and institutions were retrieved.':'Retrieval is incomplete; the page shows what was collected.'));
 const ul=el('ul');['Institution coordinates are usually the headquarters or main campus.','OpenAlex may truncate author lists at 100 names ('+fmt(s.possibly_truncated_works)+(s.possibly_truncated_works===1?' paper':' papers')+' affected).','OpenAlex citation links differ from Google Scholar\'s; totals are usually lower.'].forEach(t=>ul.append(el('li',null,t)));c.append(ul);
 if(D.unmatched.length){const d=el('details');d.append(el('summary',null,`${D.unmatched.length} Scholar papers not found in OpenAlex`));const u=el('ul');D.unmatched.forEach(r=>u.append(el('li',null,`${r.title} (${r.citations} Scholar citations)`)));d.append(u);c.append(d);}
 $('foot-left').textContent='Snapshot '+String(D.manifest.as_of||'').slice(0,10);$('credit').textContent=TILES.credit;
})();

/* ---------- start ---------- */
derive();
new ResizeObserver(()=>{resize();buildTimeline();syncTime();}).observe(box);
renderList();
if(!reduce){S.t=Y0;syncTime();map.once('load',()=>{
  if(GLOBE){projBusy=true;map.easeTo({...globeView(),duration:1500,easing:t=>1-Math.pow(1-t,3)});map.once('moveend',()=>{projBusy=false;if(pendingFocus){syncModes();runPending();}else morph(false,2200);});setTimeout(()=>{if(autoOK)setPlaying(true);},900);}
  else setTimeout(()=>{if(autoOK)setPlaying(true);},400);});}
else{S.t=TEND;syncTime();}
themeReady=true;kick(800);
if(EMBED&&window.parent!==window){const post=()=>parent.postMessage({type:'citation-geo-height',height:document.documentElement.scrollHeight},'*');new ResizeObserver(post).observe(document.body);addEventListener('load',post);}
</script>
