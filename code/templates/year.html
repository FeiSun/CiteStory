<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>The Year in Citations</title>
<meta name="description" content="One year of citations to one researcher's work, told with the same dots from start to end.">
<script>
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
try{history.scrollRestoration='manual';}catch(e){}   // the page is one sequence: always open at its start

<style>
:root{
  --serif:"Iowan Old Style","Iowan Old Style BT",ui-serif,"New York",Charter,"Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif CJK SC",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --bg:#f5f0e6; --card:#fbf8f2; --ink:#1f1b16; --ink-2:#554d43; --ink-3:#6a6256;
  --rule:#d8cfbe; --sea:#efe9dd; --land:#e2d9c6; --land-line:#cbbfa8; --fog:#f5f0e6;
  --accent:#b8401f; --accent-soft:#e9b8a3; --sel:#f1c9b6; --gold:#c8921a;
  --c-asia:#1d5566; --c-na:#c0782b; --c-eu:#72987a; --c-af:#8c4568; --c-sa:#4b6ea6; --c-oc:#a39348; --c-ot:#9b9284;
  --shadow:0 1px 0 rgba(40,30,20,.04),0 8px 30px -12px rgba(40,30,20,.18);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121418; --card:#181b21; --ink:#ede6d7; --ink-2:#b7ae9e; --ink-3:#9a9387;
  --rule:#2d3139; --sea:#161a20; --land:#252a32; --land-line:#353b45; --fog:#121418;
  --accent:#f08c5f; --accent-soft:#6e3a26; --sel:#4a2f25; --gold:#f0c25a;
  --c-asia:#6fb6bb; --c-na:#e39d55; --c-eu:#93bd94; --c-af:#cf86a9; --c-sa:#86a6dc; --c-oc:#d2c27a; --c-ot:#8d877c;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --card:#181b21; --ink:#ede6d7; --ink-2:#b7ae9e; --ink-3:#9a9387;
    --rule:#2d3139; --sea:#161a20; --land:#252a32; --land-line:#353b45; --fog:#121418;
    --accent:#f08c5f; --accent-soft:#6e3a26; --sel:#4a2f25; --gold:#f0c25a;
    --c-asia:#6fb6bb; --c-na:#e39d55; --c-eu:#93bd94; --c-af:#cf86a9; --c-sa:#86a6dc; --c-oc:#d2c27a; --c-ot:#8d877c;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity;overflow-anchor:none;-webkit-text-size-adjust:100%;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
::selection{background:var(--sel);color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;
  font-variant-numeric:tabular-nums lining-nums;overflow-x:hidden}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}

#stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.bar{position:fixed;top:12px;left:14px;right:14px;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none;font-family:var(--sans)}
.bar>*{pointer-events:auto}
.bar .gap{flex:1;pointer-events:none}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);display:grid;place-items:center;
  cursor:pointer;text-decoration:none;font-size:13px;font-weight:600;padding:0}
.ib:hover{border-color:var(--ink-3);color:var(--ink)}
.ib svg{width:17px;height:17px}
.ib[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ib .i-sun,.ib .i-pause,.ib.pic{display:none}
:root[data-theme="dark"] .ib .i-sun{display:block}
:root[data-theme="dark"] .ib .i-moon{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ib .i-sun{display:block}
  :root:not([data-theme="light"]) .ib .i-moon{display:none}
}
.ib[aria-pressed="true"] .i-play{display:none}
.ib[aria-pressed="true"] .i-pause{display:block}

main{position:relative;z-index:1;pointer-events:none}
.scene{height:100vh;height:100svh;scroll-snap-align:start;display:flex;align-items:flex-end;
  padding:0 clamp(20px,4.5vw,72px) clamp(36px,9vh,96px)}
.text{pointer-events:auto;width:min(31%,27rem);will-change:opacity}
.text h2{font-weight:500;font-size:clamp(30px,3.4vw,50px);line-height:1.06;letter-spacing:-.016em;margin:0 0 18px}
.text p{margin:0 0 12px;font-size:clamp(16.5px,1.25vw,19px);line-height:1.6;color:var(--ink-2);
  text-wrap:pretty}     /* ragged right, even word spaces; the browser avoids a lone last word and evens the right edge */
.text p b{color:var(--ink);font-weight:600}
.text p.gift{color:var(--ink);border-left:2px solid var(--gold);padding-left:12px}
.text p q{font-style:italic;quotes:"\201C" "\201D"}
:root[lang="zh"] .text p q{font-style:normal;quotes:"\300A" "\300B"}
.text .note{font-family:var(--sans);font-size:13px;color:var(--ink-3)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;font-family:var(--sans);font-size:14px}
.acts button,.acts a{border:1px solid var(--rule);background:var(--card);border-radius:20px;padding:8px 16px;cursor:pointer;text-decoration:none}
.acts button:hover,.acts a:hover{border-color:var(--accent);color:var(--accent)}
.find{margin-top:16px;font-family:var(--sans);font-size:14px}
.find input{width:100%;max-width:20rem;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 16px;font:inherit}
.find input:focus{border-color:var(--accent);outline:none}
.find .hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.find .hits button{border:0;background:none;padding:3px 0;margin-right:10px;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.2em}
.find .hits button:hover{color:var(--accent);text-decoration-color:var(--accent)}
.find .hits span{color:var(--ink-3)}
.find .acts{margin-top:10px}
.find .acts[hidden]{display:none}
.rail{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column}
.rail button{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.rail button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:.35;transition:opacity .2s,transform .25s,background .2s}
.rail button:hover::before{opacity:.8}
.rail button[aria-current]::before{opacity:1;background:var(--accent);transform:scale(1.45)}
/* small tools by the picture: Listen with its speeds on the ring, and saving the scene */
.tools{position:fixed;z-index:4;display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12.5px;transition:opacity .2s}
.player{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 3px;border:1px solid var(--rule);border-radius:16px;background:var(--card)}
.player[hidden],.tb[hidden]{display:none}
#printCard{display:none}
@media print{
  @page{size:1080px 1350px;margin:0}
  html,body{background:none!important;margin:0!important}
  body>*:not(#printCard){display:none!important}
  #printCard{display:block!important;width:1080px;height:1350px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printCard svg{display:block;width:1080px;height:1350px}
}
.player .pp{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.player .pp svg{width:11px;height:11px}
.player .pp .i-pause,.player[data-on] .pp .i-play{display:none}
.player[data-on] .pp .i-pause{display:block}
.player .pl{color:var(--ink-2);margin:0 6px 0 4px}
.player .sp{display:flex;border-left:1px solid var(--rule);padding-left:4px}
.player .sp button{border:0;background:none;padding:3px 6px;border-radius:10px;color:var(--ink-3);font:inherit;cursor:pointer}
.player .sp button:hover{color:var(--ink)}
.player .sp button[aria-pressed="true"]{color:var(--ink);background:var(--bg)}
.tb{width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);padding:0;display:grid;place-items:center;cursor:pointer}
.tb:hover{border-color:var(--ink-3);color:var(--ink)}
.tb svg{width:15px;height:15px}
.tip{position:fixed;z-index:6;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:12.5px;line-height:1.35;
  padding:8px 11px;border-radius:4px;max-width:290px;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .12s}
.tip.on{opacity:1}
.tip b{display:block;font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.3}
.tip span{display:block;margin-top:3px;opacity:.8}
.after{position:relative;z-index:2;background:var(--bg);border-top:1px solid var(--rule)}
.about{max-width:1180px;margin:0 auto;padding:clamp(56px,9vh,96px) 24px 40px;display:grid;grid-template-columns:200px minmax(0,68ch);gap:24px 48px}
.about h2{font-weight:500;font-size:26px;line-height:1.15;margin:0}
.about p{margin:0 0 14px;color:var(--ink-2);font-size:17px}
.foot{max-width:1180px;margin:0 auto;padding:24px 24px 56px;font-family:var(--sans);font-size:13px;color:var(--ink-3)}
.empty{position:relative;z-index:2;max-width:40rem;margin:0 auto;padding:22vh 24px;font-size:20px;color:var(--ink-2)}
@media (max-width:860px){
  body{font-size:17px}
  .scene{padding:0 0 0}
  .text{width:100%;max-height:50svh;overflow:auto;padding:26px 20px 26px;background:linear-gradient(to bottom,transparent,var(--bg) 26px)}
  .text h2{font-size:27px;margin-bottom:10px}
  .text p{font-size:16px;line-height:1.5;margin-bottom:8px}
  .rail{display:none}
  .ib.pic{display:grid}
  .tools .tb{display:none}
  .about{grid-template-columns:minmax(0,1fr);padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-snap-type:none}
  *,*::before,*::after{transition-duration:0s!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="Each dot is one paper that cited this work in the year; the text of each section gives the numbers."></canvas>
<div class="bar">
  <a class="ib" href="index.html" id="homeBtn" aria-label="All views" title="All views"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 11.25 12 4.5l8.25 6.75M6 9.75V19.5h4.5v-5.25h3v5.25H18V9.75"/></svg></a>

  <button class="ib pic" id="picBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10.5M8 10.5l4 4 4-4M5 18.5h14"/></svg></button>
  <button class="ib" id="playBtn" type="button" aria-pressed="false"><svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z"/></svg></button>

    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
  </button>
</div>
<main id="scenes"></main>
<nav class="rail" id="rail" aria-label="Sections"></nav>

    <button class="pp" id="ppBtn" type="button"><svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
    <span class="pl" id="ppLbl"></span>

  </div>

</div>

  <section class="about" aria-labelledby="aboutTitle"><h2 id="aboutTitle"></h2><div id="aboutBody"></div></section>
  <footer class="foot"><a href="index.html" id="footHome"></a> · <a href="https://github.com/FeiSun/CiteStory" id="footRepo" rel="noopener"></a></footer>
</div>

<script src="data.js"></script>
<script src="year.js"></script>
<script>
(function(){
'use strict';
// a path that also keeps its outline as SVG path data, so that a card can be written out as an SVG
const svgN=v=>String(Math.round(v*1e4)/1e4);
function svgArc(x,y,r,a0,a1,ccw,has,n){n=n||svgN;let sw=ccw?a0-a1:a1-a0;const T=2*Math.PI;
  if(sw>=T||sw<=-T)sw=T;else{sw=((sw%T)+T)%T;}
  const p=a=>[x+r*Math.cos(a),y+r*Math.sin(a)],s=p(a0);let d=(has?'L':'M')+n(s[0])+' '+n(s[1]);if(!sw)return d;
  const k=Math.ceil(sw/(Math.PI*.999)),st=sw/k*(ccw?-1:1);for(let i=1;i<=k;i++){const e=p(a0+st*i);d+='A'+n(r)+' '+n(r)+' 0 0 '+(ccw?0:1)+' '+n(e[0])+' '+n(e[1]);}return d;}
const Path2D=class extends window.Path2D{
  constructor(d){super(d);this.d=typeof d==='string'?d:'';this.has=false;}
  moveTo(x,y){super.moveTo(x,y);this.d+='M'+svgN(x)+' '+svgN(y);this.has=true;}
  lineTo(x,y){super.lineTo(x,y);this.d+='L'+svgN(x)+' '+svgN(y);this.has=true;}
  closePath(){super.closePath();this.d+='Z';}
  rect(x,y,w,h){super.rect(x,y,w,h);this.d+='M'+svgN(x)+' '+svgN(y)+'h'+svgN(w)+'v'+svgN(h)+'h'+svgN(-w)+'Z';this.has=true;}
  arc(x,y,r,a0,a1,ccw){super.arc(x,y,r,a0,a1,ccw);this.d+=svgArc(x,y,r,a0,a1,ccw,this.has);this.has=true;}};
const D=window.CITATION_DATA,Y=window.CITATION_YEAR,$=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
const HIST={};if(Y)(Y.history||[]).forEach(h=>{HIST[h[0]]=h[1];});       // citing papers of every year up to this one
const ALL=Object.keys(HIST).map(Number).filter(y=>HIST[y]>0).sort((a,b)=>a-b);
if(!D||!Y||!Y.review){$('after').remove();
  $('scenes').appendChild(el('p','empty',!D||!Y?'The data files (data.js, year.js) could not be loaded.':'No dated citations yet.'));return;}

/* ---------- the year (chosen when the page is built) and the language ---------- */
const Q=new URLSearchParams(location.search),SNAP=new Date(Y.snapshot),SNAP_Y=SNAP.getUTCFullYear();
const year=Y.year,YR=Y.review,P=Y.papers,OWNER=Y.owner||D.owner||'';
let LANG=Q.get('lang');try{LANG=LANG||localStorage.getItem('citestory-lang');}catch(e){}
if(LANG!=='en'&&LANG!=='zh')LANG=/^zh\b/i.test(navigator.language||'')?'zh':'en';
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const L=(en,zh)=>LANG==='zh'?zh:en;
const NF=new Intl.NumberFormat('en-US'),fmt=n=>NF.format(Math.round(n));
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function day(iso,yearOnly){const y=+iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10);
  if(yearOnly)return L('during '+y,y+' 年内');
  return y===year?L(d+' '+MONTHS[m-1],m+' 月 '+d+' 日'):L(d+' '+MONTHS[m-1]+' '+y,y+' 年 '+m+' 月 '+d+' 日');}
function doy(iso){return Math.round((Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(+iso.slice(0,4),0,1))/864e5)+1;}
function join(a){if(a.length<2)return a.join('');return LANG==='zh'?a.join('、'):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function shortTitle(t,max){t=String(t||'');const c=t.indexOf(':');if(c>3&&c<=max)return t.slice(0,c);
  if(t.length<=max)return t;const s=t.slice(0,max),k=s.lastIndexOf(' ');return (k>max*0.5?s.slice(0,k):s).trimEnd()+'…';}
const NAME_FULL={'Dem. Rep. Congo':'Democratic Republic of the Congo','Bosnia and Herz.':'Bosnia and Herzegovina','Central African Rep.':'Central African Republic','Dominican Rep.':'Dominican Republic','Eq. Guinea':'Equatorial Guinea','S. Sudan':'South Sudan'};
const CONTS=['Asia','North America','Europe','Africa','South America','Oceania'];
const CONT_VAR={'Asia':'--c-asia','North America':'--c-na','Europe':'--c-eu','Africa':'--c-af','South America':'--c-sa','Oceania':'--c-oc','Other':'--c-ot'};
const CONT_ZH={'Asia':'亚洲','North America':'北美洲','Europe':'欧洲','Africa':'非洲','South America':'南美洲','Oceania':'大洋洲'};
let ZH_NAMES=null;try{ZH_NAMES=new Intl.DisplayNames(['zh-CN'],{type:'region'});}catch(e){}
function country(iso){const c=(D.countries||{})[iso]||(iso==='MO'?{name:'Macao',continent:'Asia'}:null);
  let zh=null;if(LANG==='zh'&&ZH_NAMES&&/^[A-Z]{2}$/.test(iso||'')){try{zh=ZH_NAMES.of(iso);}catch(e){}}
  const n=zh&&zh!==iso?zh:(c&&c.name)||iso||'';return {name:NAME_FULL[n]||n.replace(/\bIs\.$/,'Islands').replace(/\bRep\./,'Republic'),continent:c&&CONTS.indexOf(c.continent)>=0?c.continent:'Other'};}
const CITY={},CITY_CONT={};D.cities.forEach(c=>{CITY[c.id]=c;CITY_CONT[c.id]=country(c.country).continent;});
const ZHC=Y.zh||{},cityName=id=>CITY[id]?(LANG==='zh'&&ZHC[id])||CITY[id].name:'';     // Chinese names come from code/city_names_zh.json
const homeLabel=()=>D.home?(LANG==='zh'&&Y.home_zh)||D.home.label:'',stopCity=s=>(LANG==='zh'&&s.city_zh)||s.city;
const placeOf=x=>x.c!=null&&CITY[x.c]?cityFull(x.c):x.place||'';     // where a work was written: its first listed city
const cityFull=id=>{if(!CITY[id])return '';const n=cityName(id),c=country(CITY[id].country).name,en=((D.countries||{})[CITY[id].country]||{}).name,same=c===n||en===CITY[id].name||(LANG==='zh'&&ZHC[id]&&/^(HK|MO|SG|TW)$/.test(CITY[id].country));
  return same||!c?n:LANG==='zh'&&ZHC[id]?(n.indexOf(c)===0?n:c+n):n+(LANG==='zh'?'，':', ')+c;};     // in Chinese the country comes first: 越南芹苴
function safeUrl(u){try{const x=new URL(u);if(x.protocol==='http:'||x.protocol==='https:')return x.href;}catch(e){}return null;}
function workUrl(w){return (w.doi&&safeUrl(w.doi))||(/^W\d+$/.test(w.id)?'https://openalex.org/'+w.id:null);}

/* ---------- the dots: one per citing paper of the year, in date order ---------- */
const DOTS=YR.works.map((r,k)=>{const w=D.works[r[0]],cs=(w.cities||[]).filter(id=>CITY[id]).slice(0,60);
  return {k:k,w:w,doy:r[1],yo:r[2]&1,ret:r[2]&2,own:r[2]&4,ps:r[3],cs:cs,cont:cs.length?CITY_CONT[cs[0]]:'Other'};});
const N=DOTS.length,BYI={};DOTS.forEach(d=>{BYI[YR.works[d.k][0]]=d;});
const NEW_CITY={},KNOWN={};

/* ---------- layouts: every one returns the dots it shows as {k, q, x, y, r, c, a} ---------- */
// what the colours say: a swatch per continent

// swatches and labels in rows no wider than w; returns the number of rows, and draws them when y is given

// the year as a ring: 1 January at the top and on clockwise; each day is a ray of its papers, out from the inner circle
function layRing(b){

  const per=new Array(days+2).fill(0);dated.forEach(d=>{per[d.doy]++;});const top=Math.max.apply(null,per.concat([1]));

  const mk=(YR.marks||[]).filter(m=>!m.yo&&BYI[m.i]).slice(-1)[0],mkDot=mk?inst.find(d=>d.k===BYI[mk.i].k):null,mkLine=mk?L(fmt(mk.mark)+'th citing paper ever','有记录以来第 '+fmt(mk.mark)+' 篇引用'):'';

    const ls=[[(i?'':L('Busiest: ','最忙：'))+day(p[0]),'--ink'],[papers(p[1]),'--ink-2']];if(mk&&mk.date===p[0])ls.push([mkLine,'--accent']);

  const E=YR.ends||{},endsAt=[E.first,E.last&&E.first&&E.last.i!==E.first.i?E.last:null].map((e,i)=>{const d=e&&!e.yo&&BYI[e.i];if(!d)return null;
    const o=inst.find(x=>x.k===d.k),t=doy(e.date),at=tip(t,6),ls=[[(i?L(YR.complete?'Last paper: ':'Latest paper: ',YR.complete?'最后一篇：':'最近一篇：'):L('First paper: ','第一篇：'))+day(e.date),'--ink-2']];
    if(e.c!=null&&CITY[e.c])ls.push([cityName(e.c),'--ink-3']);

        text(LANG==='zh'?(WIDE?(m+1)+'月':String(m+1)):WIDE?MONTHS[m].slice(0,3):MONTHS[m].charAt(0),o[0],o[1],{align:'center',col:'--ink-3',size:WIDE?11:10,halo:0});}

/* ---------- from one layout to the next: the same dot keeps going; a dot with no twin splits from or folds into its paper ---------- */
function layout(k){return LAY[k]||(LAY[k]=SC[k].lay(plot()));}
function transition(k){if(TR[k])return TR[k];const A=layout(k).inst,B=layout(k+1).inst,aKey=new Map(),aDot=new Map(),bDot=new Map(),used=new Uint8Array(A.length),T=[];
  A.forEach((d,i)=>{aKey.set(d.k*64+d.q,i);if(!aDot.has(d.k))aDot.set(d.k,i);});B.forEach((d,j)=>{if(!bDot.has(d.k))bDot.set(d.k,j);});
  const byTime=SC[k+1].order==='time'||SC[k].order==='time',sp=.34,st=d=>sp*(byTime?.8*d.k/Math.max(1,N-1)+.2*hash(d.k):hash(d.k));
  B.forEach(d=>{let i=aKey.get(d.k*64+d.q);if(i!=null){used[i]=1;T.push({f:A[i],t:d,fa:A[i].a,ta:d.a,st:st(d)});return;}
    i=aDot.get(d.k);if(i!=null)T.push({f:A[i],t:d,fa:A[i].a,ta:d.a,st:st(d)});else T.push({f:d,t:d,fa:0,ta:d.a,st:st(d)});});
  A.forEach((d,i)=>{if(used[i])return;const j=bDot.get(d.k);if(j!=null)T.push({f:d,t:B[j],fa:d.a,ta:0,st:st(d),gone:1});else T.push({f:d,t:d,fa:d.a,ta:0,st:st(d),gone:1});});
  T.sp=sp;return (TR[k]=T);}
const cssCache=new Map();
function dotStyle(c,a){const q=Math.round(a*24),key=(c[0]<<16|c[1]<<8|c[2])*32+q;let s=cssCache.get(key);if(!s){s=rgba(c,(q/24).toFixed(3));cssCache.set(key,s);}return s;}
function disc(x,y,r,c,a){if(a<.02)return;ctx.fillStyle=dotStyle(c,a);if(r<1.15){ctx.fillRect(x-r,y-r,2*r,2*r);return;}ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
let scroll=0,raf=0,cur=-1;
function vh(){return Math.max(1,cards.length?cards[0].parentNode.offsetHeight:SH);}
function pos(){return Math.max(0,Math.min(SC.length-1,window.scrollY/vh()||0));}
function draw(now){raf=0;if(!SC.length)return;const s=pos(),k=Math.min(SC.length-1,Math.floor(s+1e-6)),f=s-k;
  let p=k>=SC.length-1?0:Math.max(0,Math.min(1,(f-.14)/.72));if(RM.matches)p=f<.5?0:1;const e=ease(p);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,SW,SH);ctx.globalAlpha=1;
  const A=layout(k),B=p>0?layout(k+1):null;
  if(sound&&Math.abs(s-CAL_K)>.3)stopSound();
  if((SCRUB||HOVER)&&!DRAG&&(p>0||!A.scrub)){SCRUB=0;HOVER=0;TR=[];}     // leaving the ring: undialled before a transition keeps the dimmed dots
  if(A.pre)A.pre();if(B&&B.pre)B.pre();
  if(A.base)A.base(1-e,now);if(B&&B.base)B.base(e,now);
  const G=[];
  if(!B)for(let i=0;i<A.inst.length;i++){const d=A.inst[i];disc(d.x,d.y,d.r,d.c,d.a);if(GIFTS&&d.a>.3&&GIFTS.has(d.k))G.push(d.x,d.y,d.r);}
  else{const T=transition(k),sp=T.sp;for(let i=0;i<T.length;i++){const m=T[i],q=ease(Math.max(0,Math.min(1,(p-m.st)/(1-sp)))),a=m.fa+(m.ta-m.fa)*q;if(a<.02)continue;
    const dx=m.t.x-m.f.x,dy=m.t.y-m.f.y;let x=m.f.x+dx*q,y=m.f.y+dy*q;
    if(q>0&&q<1){const dist=Math.sqrt(dx*dx+dy*dy);if(dist>24){const lift=Math.sin(Math.PI*q)*Math.min(dist*.1,40)*(m.f.k&1?1:-1);x-=dy/dist*lift;y+=dx/dist*lift;}}
    const c=q<.5?m.f.c:m.t.c,rr=m.f.r+(m.t.r-m.f.r)*q;disc(x,y,rr,c,a);if(GIFTS&&GIFTS.has(m.f.k)&&a>.3)G.push(x,y,rr);}}

  if(A.over)A.over(1-e,now);if(B&&B.over)B.over(e,now);ctx.globalAlpha=1;
  const near=Math.round(s);if(near!==cur){cur=near;$('rail').querySelectorAll('button').forEach((b,i)=>{if(i===near)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});}
  cards.forEach((c,i)=>{c.style.opacity=String(Math.max(0,Math.min(1,1.25-Math.abs(s-i)*2.6)));});
  placeTools(s);
  rest=p===0?A:(p===1?B:null);
  if(((A.live&&p<.5)||(B&&B.live&&p>=.5))&&!RM.matches&&!document.hidden)ask();
  if(sound&&!document.hidden)ask();
  if(G.length&&!RM.matches&&!document.hidden)ask();}     // the halos breathe
let rest=null;
// the tools follow the scene in view and fade with its text; below the picture's right edge on a wide screen, at its top right on a phone
function placeTools(s){const k=Math.round(s),sc=SC[k],op=Math.max(0,Math.min(1,1.25-Math.abs(s-k)*2.6)),T=$('tools'),b=plot();
  $('player').hidden=!(sc&&sc.listen);$('saveBtn').hidden=!sc||!!sc.close;
  T.style.opacity=String(op);T.style.pointerEvents=op>.5?'auto':'none';T.style.right=Math.round(SW-(b.x+b.w))+'px';T.style.top=Math.round(WIDE?b.y+b.h+12:b.y+b.h-34)+'px';T.style.visibility=op<.05?'hidden':'';}     // on a phone, the lower right corner of the picture, clear of the dial
// a soft gold halo that breathes, around each dot of the name the page was sent to
function glow(G,now){const b=RM.matches?1:.5+.5*Math.sin((now||0)/520),gold=COL['--gold'];

    ctx.fillStyle=rgba(gold,.12+.14*b);ctx.beginPath();ctx.arc(x,y,r+e*(2+b),0,6.2832);ctx.fill();
    ctx.strokeStyle=rgba(gold,.55+.4*b);ctx.lineWidth=Math.min(1.4,.5+r*.5);ctx.beginPath();ctx.arc(x,y,r+e*(1+.5*b),0,6.2832);ctx.stroke();}}

function rebuild(){const was=WIDE;size();if(was!==WIDE)buildText();LAY=[];TR=[];ask();}

/* ---------- hover: which paper is this dot ---------- */
const tip=$('tip');let hot=null;
function nearest(x,y,lim){if(!rest)return null;let best=null,bd=(lim||12)*(lim||12);const a=rest.inst;for(let i=0;i<a.length;i++){if(a[i].a<.25)continue;const dx=a[i].x-x,dy=a[i].y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=a[i];}}return best;}
function showTip(d){hot=d;if(!d){tip.classList.remove('on');stage.style.cursor='';return;}const dot=DOTS[d.k],w=dot.w;tip.textContent='';
  tip.appendChild(el('b',null,w.title||L('Loading the title…','正在载入标题…')));
  const who=w.authors&&w.authors.length?w.authors[0].name+(w.authors.length>1?L(' et al.',' 等'):''):'';
  tip.appendChild(el('span',null,[who,dot.yo?String(year):day(w.date||''),dot.cs.length?cityFull(dot.cs[0]):''].filter(Boolean).join(' · ')));
  tip.style.left=Math.max(150,Math.min(SW-150,d.x))+'px';tip.style.top=Math.max(70,d.y)+'px';tip.classList.add('on');stage.style.cursor=workUrl(w)?'pointer':'';}
const nameAt=(x,y)=>rest&&rest.hit?rest.hit(x,y):-1;
const dayAt=(x,y)=>rest&&rest.scrub?rest.scrub(x,y):0;     // the rim of the ring at rest, or 0
// held, the hand follows the pointer round the year and each day rings; let go during Listen, the year plays on from there

// to the share sheet when there is one and it takes pictures, otherwise a download
async function send(blob,name,share){if(!blob)return;
  if(share){try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){const u=publicUrl();await navigator.share(u?{files:[f],title:document.title,text:u}:{files:[f],title:document.title});return;}}
    catch(e){if(e&&e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
// a PDF through the browser's own print: the card as an SVG on a page of its size, so that lines, dots and text stay vector and the fonts are embedded
function savePdf(){let d=$('printCard');if(!d){d=document.createElement('div');d.id='printCard';document.body.appendChild(d);}

  const done=()=>{document.title=t;d.textContent='';window.removeEventListener('afterprint',done);};window.addEventListener('afterprint',done);window.print();}
