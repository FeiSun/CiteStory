<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Where the Citations Came From</title>
<meta name="description" content="An editorial scrollytelling piece on the geography of papers citing one researcher's work.">
<script>
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --serif:"Iowan Old Style","Iowan Old Style BT",ui-serif,"New York",Charter,"Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --bg:#f5f0e6; --bg-2:#ece5d6; --card:#fbf8f2; --ink:#1f1b16; --ink-2:#554d43; --ink-3:#6a6256;
  --rule:#d8cfbe; --sea:#efe9dd; --land:#e2d9c6; --land-line:#cbbfa8; --grat:#e3dccd;
  --dot:#1d5566; --accent:#b8401f; --accent-soft:#e9b8a3; --sel:#f1c9b6;
  --pa:#1d5566; --pb:#a86e0c; --pc:#7b3d6c;
  --c-asia:#1d5566; --c-na:#c0782b; --c-eu:#72987a; --c-af:#8c4568; --c-sa:#4b6ea6; --c-oc:#a39348; --c-ot:#9b9284;
  --t-asia:#fbf8f2; --t-na:#1f1b16; --t-eu:#1f1b16; --t-af:#fbf8f2; --t-sa:#fbf8f2; --t-oc:#1f1b16; --t-ot:#1f1b16;
  --shadow:0 1px 0 rgba(40,30,20,.04),0 8px 30px -12px rgba(40,30,20,.18);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121418; --bg-2:#1a1d23; --card:#181b21; --ink:#ede6d7; --ink-2:#b7ae9e; --ink-3:#9a9387;
  --rule:#2d3139; --sea:#161a20; --land:#252a32; --land-line:#353b45; --grat:#1d2128;
  --dot:#7cc3c6; --accent:#f08c5f; --accent-soft:#6e3a26; --sel:#4a2f25;
  --pa:#7cc3c6; --pb:#e6b85c; --pc:#cf95c5;
  --c-asia:#6fb6bb; --c-na:#e39d55; --c-eu:#93bd94; --c-af:#cf86a9; --c-sa:#86a6dc; --c-oc:#d2c27a; --c-ot:#8d877c; --t-asia:#121418; --t-na:#121418; --t-eu:#121418; --t-af:#121418; --t-sa:#121418; --t-oc:#121418; --t-ot:#121418;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --bg-2:#1a1d23; --card:#181b21; --ink:#ede6d7; --ink-2:#b7ae9e; --ink-3:#9a9387;
    --rule:#2d3139; --sea:#161a20; --land:#252a32; --land-line:#353b45; --grat:#1d2128;
    --dot:#7cc3c6; --accent:#f08c5f; --accent-soft:#6e3a26; --sel:#4a2f25;
    --pa:#7cc3c6; --pb:#e6b85c; --pc:#cf95c5;
    --c-asia:#6fb6bb; --c-na:#e39d55; --c-eu:#93bd94; --c-af:#cf86a9; --c-sa:#86a6dc; --c-oc:#d2c27a; --c-ot:#8d877c; --t-asia:#121418; --t-na:#121418; --t-eu:#121418; --t-af:#121418; --t-sa:#121418; --t-oc:#121418; --t-ot:#121418;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scrollbar-color:var(--rule) var(--bg);-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::selection{background:var(--sel);color:var(--ink)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;
  font-variant-numeric:tabular-nums lining-nums;overflow-x:hidden;transition:background-color .3s,color .3s}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button,input,select{font:inherit;color:inherit}

/* theme toggle */
.theme-btn{position:fixed;top:14px;right:14px;z-index:30;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.theme-btn:hover{border-color:var(--ink-3)}
.theme-btn{transition:opacity .2s,visibility .2s}.theme-btn.tucked{opacity:0;visibility:hidden;pointer-events:none}
.theme-btn.home{right:62px}
.theme-btn svg{width:18px;height:18px}
.theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .i-sun{display:block}
  :root:not([data-theme="light"]) .theme-btn .i-moon{display:none}
}

/* hero */
.hero{max-width:1180px;margin:0 auto;padding:clamp(72px,14vh,150px) 24px clamp(48px,9vh,96px)}
.hero h1{font-weight:500;font-size:clamp(44px,7.6vw,104px);line-height:.98;letter-spacing:-.022em;margin:0 0 34px;max-width:12ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.dek{font-size:clamp(20px,2.1vw,25px);line-height:1.45;color:var(--ink-2);max-width:62ch;margin:0}
.dek strong{color:var(--ink);font-weight:600}
.byline{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-top:34px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.byline .scroll-cue{display:inline-flex;align-items:center;gap:8px}
.byline svg{width:14px;height:14px}

/* scrolly */
.scrolly{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);border-top:1px solid var(--rule)}
.steps{position:relative;z-index:1;padding:0 clamp(20px,3.5vw,56px) 30vh}
.graphic{position:sticky;top:0;height:100vh;height:100svh;z-index:0;border-left:1px solid var(--rule);background:var(--sea);overflow:hidden}
.step{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:6vh 0}
.step:first-child{min-height:70vh}
.step .card{max-width:34rem;opacity:.7;transition:opacity .45s}
.step.is-active .card{opacity:1}
.step.chap-start{padding-top:14vh}
.step.chap-start .card{border-top:1px solid var(--rule);padding-top:26px}
.step h2{font-weight:500;font-size:clamp(28px,2.7vw,38px);line-height:1.12;letter-spacing:-.012em;margin:0 0 16px}
.step p{margin:0 0 14px;font-size:clamp(17px,1.3vw,19.5px);line-height:1.62;color:var(--ink-2)}
.step p strong{color:var(--ink);font-weight:600}
.step p .sw{display:inline-block;width:.62em;height:.62em;border-radius:50%;margin:0 .22em 0 .08em;vertical-align:.04em}
.step p q{font-style:italic;quotes:"\201C" "\201D"}

.g-head{position:absolute;left:22px;top:18px;right:118px;z-index:3;pointer-events:none}
.g-title{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.01em;transition:opacity .3s;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-sub{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:2px}
.graphic canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#sBase,#sOver{pointer-events:none}
.tip.s-tip{white-space:normal;width:max-content;max-width:290px;padding:8px 11px;z-index:5}
.tip.s-tip b{display:block;font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.3}
.tip.s-tip .m{margin-top:3px;opacity:.8}
.tip.s-tip.below{transform:translate(-50%,14px)}
.rail{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;gap:0}
.rail button{width:24px;height:24px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.rail button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:.35;transition:opacity .2s,transform .25s,background .2s}
.rail button:hover::before{opacity:.8}
.rail button[aria-current]::before{opacity:1;background:var(--accent);transform:scale(1.45)}

/* explore */
.explore{border-top:1px solid var(--rule);padding:clamp(56px,10vh,110px) 24px 40px;max-width:1440px;margin:0 auto}
.sec-head{max-width:1180px;margin:0 auto 34px}
.sec-head h2{font-weight:500;font-size:clamp(34px,4.4vw,58px);line-height:1.02;letter-spacing:-.018em;margin:0 0 16px}
.sec-head p{color:var(--ink-2);max-width:64ch;margin:0;font-size:19px}
.ex-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.ex-map{position:relative;min-height:620px;background:var(--sea);border-right:1px solid var(--rule)}
.ex-map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-x pan-y}
.ex-map canvas.dragging{cursor:grabbing}
.ex-map canvas.pan{touch-action:none}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--card);z-index:2}
.zoom button{width:36px;height:36px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.zoom button+button{border-top:1px solid var(--rule)}
.zoom button:hover{color:var(--ink);background:var(--bg-2)}
.zoom svg{width:16px;height:16px}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:12.5px;line-height:1.35;
  padding:6px 9px;border-radius:4px;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.ex-side{display:flex;flex-direction:column;min-height:0;max-height:760px;font-family:var(--sans)}
.ctrls{padding:16px 18px;border-bottom:1px solid var(--rule);display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.field input{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:5px;padding:8px 10px;font-size:14px;font-family:var(--sans)}
.field .pk-trigger{border:1px solid var(--rule);background:var(--bg);border-radius:5px;padding:8px 10px;font-size:14px;font-family:var(--sans);color:var(--ink)}
.field .pk-trigger:hover{border-color:var(--ink-3)}
:root{--pk-bg:var(--card);--pk-ink:var(--ink);--pk-muted:var(--ink-3);--pk-line:var(--rule);--pk-hover:var(--bg-2);--pk-accent:var(--accent);--pk-shade:rgba(20,14,8,.35)}
.city-list{list-style:none;margin:0;padding:6px 8px;overflow:auto;flex:0 0 auto;max-height:260px;border-bottom:1px solid var(--rule)}
.city-list button{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:13.5px}
.city-list button:hover{background:var(--bg-2)}
.city-list button.more{display:block;margin:4px 0 0;color:var(--ink-3)}
.city-list button[aria-pressed="true"]{background:var(--sel)}
.city-list .cn{color:var(--ink-3);font-weight:400}
.city-list .c{font-weight:600;color:var(--ink-2)}
.empty{padding:10px;color:var(--ink-3);font-size:13px}
.detail{padding:18px 18px 22px;overflow:auto;flex:1;min-height:180px}
.detail h3{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;margin:0 0 4px}
.detail .meta{font-size:13px;color:var(--ink-3);margin:0 0 16px}
.detail h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px;font-weight:600}
.detail ul{list-style:none;margin:0;padding:0}
.detail .insts li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--bg-2)}
.detail .insts span:last-child{font-weight:600;color:var(--ink-2)}
.detail .papers li{padding:8px 0;border-bottom:1px solid var(--bg-2)}
.detail .papers a{font-family:var(--serif);font-size:15.5px;line-height:1.35;display:block}
.detail .papers .pm{font-size:12px;color:var(--ink-3);margin-top:3px;overflow-wrap:anywhere}
.more{margin-top:12px;border:1px solid var(--rule);background:var(--bg);border-radius:5px;padding:7px 12px;font-size:13px;cursor:pointer}
.more:hover{border-color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:14px;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* about */
.foot{max-width:1180px;margin:0 auto;padding:28px 24px 56px;border-top:1px solid var(--rule);font-family:var(--sans);font-size:13px;color:var(--ink-3)}
.about{max-width:1180px;margin:0 auto;padding:clamp(56px,9vh,96px) 24px 72px;display:grid;grid-template-columns:200px minmax(0,68ch);gap:24px 48px}
.about h2{font-weight:500;font-size:26px;line-height:1.15;margin:0}
.about p{margin:0 0 14px;color:var(--ink-2);font-size:17px}
.about p strong{color:var(--ink);font-weight:600}

@media (max-width:1100px){.ex-grid{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:860px){
  body{font-size:17px}
  .scrolly{display:flex;flex-direction:column}
  .graphic{order:-1;position:sticky;top:0;height:54vh;height:54svh;border-left:0;border-bottom:1px solid var(--rule);z-index:2}
  .steps{padding:0 18px 24vh}
  .step{min-height:66vh;justify-content:flex-start;padding:4vh 0 0}
  .step.chap-start{padding-top:4vh}
  .step:first-child{min-height:60vh}
  .step .card{background:var(--card);border:1px solid var(--rule);padding:18px 18px 6px;border-radius:6px;box-shadow:var(--shadow);opacity:1}
  .step h2{font-size:25px}
  .g-head{left:16px;top:12px;right:64px}
  .rail{display:none}
  .theme-btn{position:absolute;top:10px;right:10px;width:36px;height:36px}
  .theme-btn.home{right:54px}
  .ex-grid{grid-template-columns:minmax(0,1fr)}
  .ex-map{min-height:0;aspect-ratio:1.55;border-right:0;border-bottom:1px solid var(--rule)}
  .ex-side{max-height:none}
  .explore{padding-left:16px;padding-right:16px}
  .about{grid-template-columns:minmax(0,1fr);padding-left:18px;padding-right:18px}
  .hero{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="theme-btn home" href="index.html" aria-label="All views" title="All views"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 11.25 12 4.5l8.25 6.75M6 9.75V19.5h4.5v-5.25h3v5.25H18V9.75"/></svg></a>
<button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme">
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
</button>

<header class="hero">
  <h1>Where the citations <em>came from</em></h1>
  <p class="dek" id="dek"></p>
  <div class="byline"><span id="snap"></span><span class="scroll-cue"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v10M3.5 8.5 8 13l4.5-4.5"/></svg>Scroll to begin</span></div>
</header>

<main>
<section class="scrolly" aria-label="Story">
  <div class="steps" id="steps"></div>
  <div class="graphic" id="graphic">
    <canvas id="sBase" aria-hidden="true"></canvas>
    <canvas id="sDots" role="img" aria-label="Each dot is one citing paper; the step text beside it gives the numbers."></canvas>

    <div class="g-head" aria-hidden="true"><div class="g-title" id="gTitle"></div><div class="g-sub" id="gSub"></div></div>
    <div class="tip s-tip" id="sTip" role="presentation"></div>
    <nav class="rail" id="rail" aria-label="Story steps"></nav>
  </div>
</section>

<section class="explore" id="explore" aria-labelledby="exTitle">
  <div class="sec-head">
    <h2 id="exTitle">Every city on the map</h2>
    <p id="exDek"></p>
  </div>
  <div class="ex-grid">
    <div class="ex-map" id="exMap">
      <canvas id="exCanvas" role="img" aria-label="Map of citing cities; the city list beside it selects the same cities."></canvas>
      <div class="tip" id="tip" role="presentation"></div>
      <div class="zoom">
        <button type="button" id="zIn" aria-label="Zoom in"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
        <button type="button" id="zOut" aria-label="Zoom out"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg></button>
        <button type="button" id="zReset" aria-label="Reset view"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M13.5 6V2.5H10M2.5 10v3.5H6M13.5 10v3.5H10"/></svg></button>
      </div>
    </div>
    <div class="ex-side">
      <div class="ctrls">
        <div class="field"><label for="paperSel">Paper</label>
          <button type="button" id="paperSel"></button>
        </div>
        <div class="field"><label for="citySearch">City</label><input id="citySearch" type="search" placeholder="City, country or region" autocomplete="off"></div>
      </div>
      <ul class="city-list" id="cityList" aria-label="Cities"></ul>
      <div class="detail" id="detail"></div>
      <p class="sr" id="exLive" aria-live="polite"></p>
    </div>
  </div>
</section>

<section class="about" aria-labelledby="aboutTitle">
  <h2 id="aboutTitle">About the data</h2>
  <div id="aboutBody"></div>
</section>
</main>
<footer class="foot"><a href="index.html">All views</a></footer>

<script>
(function(){
'use strict';
var D=window.CITATION_DATA;
if(!D){document.getElementById('dek').textContent='The data file (data.js) could not be loaded.';return;}

/* ---------- helpers ---------- */
var NF=new Intl.NumberFormat('en-US');
function fmt(n){return NF.format(Math.round(n));}
function pct(a,b){return b?Math.round(100*a/b)+'%':'0%';}
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function listJoin(a){if(a.length<2)return a.join('');return a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
function safeUrl(u){try{var x=new URL(u);if(x.protocol==='http:'||x.protocol==='https:')return x.href;}catch(e){}return null;}
function workUrl(w){return (w.doi&&safeUrl(w.doi))||(/^W\d+$/.test(w.id)?'https://openalex.org/'+w.id:null);}
var RM=window.matchMedia('(prefers-reduced-motion: reduce)');
function hav(la1,lo1,la2,lo2){var r=Math.PI/180,a=Math.sin((la2-la1)*r/2),b=Math.sin((lo2-lo1)*r/2);
  var h=a*a+Math.cos(la1*r)*Math.cos(la2*r)*b*b;return 2*6371.0088*Math.asin(Math.min(1,Math.sqrt(h)));}

/* ---------- data model ---------- */
var ASOF=(function(s){var d=new Date(String(s).replace(/(\.\d{3})\d+/,'$1'));return isNaN(d)?new Date(String(s).slice(0,10)+'T00:00:00Z'):d;})(D.manifest.as_of);

});
W.forEach(function(w){w.gs.forEach(function(g){GROUPS[g].n++;if(w.ci.length)GROUPS[g].placed++;});});
GLIST.sort(function(a,b){return b.n-a.n;});

/* ---------- facts (all computed) ---------- */
var F={};

var dated=W.filter(function(w){return w.yr!=null;});

F.years=[];for(var y=F.y0;y<=ASOF_Y;y++)F.years.push(y);

// first year
F.first=dated.filter(function(w){return w.yr===F.y0;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
(function(){var gc={};F.first.forEach(function(w){w.gs.forEach(function(g){gc[g]=(gc[g]||0)+1;});});
  var best=Object.keys(gc).sort(function(a,b){return gc[b]-gc[a];})[0];F.firstPaper=GROUPS[best];F.firstPaperN=gc[best]||0;
  var placed=F.first.filter(function(w){return w.ci.length;});F.firstPlaced=placed.length;
  var kc={};placed.forEach(function(w){w.conts.forEach(function(k){kc[k]=(kc[k]||0)+1;});});
  F.firstCont=Object.keys(kc).sort(function(a,b){return kc[b]-kc[a];})[0];F.firstContN=kc[F.firstCont]||0;

// papers
var HOME_ISO=D.home.country;

// continents
F.contYear={};CONTS.forEach(function(k){F.contYear[k]=F.years.map(function(){return 0;});});

// home
(function(){var h=D.home;var best=-1;CITIES.forEach(function(c,i){if(c.id===h.city)best=i;});   // the build names the home city

/* ---------- projection: Equal Earth, centred on 10°E ---------- */

var CX=new Float32Array(NC),CY=new Float32Array(NC);
CITIES.forEach(function(c,i){var p=proj(rel(c.lon),c.lat);CX[i]=p[0];CY[i]=p[1];});
var HOME_XY=isFinite(D.home.lat)&&isFinite(D.home.lon)?proj(rel(D.home.lon),D.home.lat):[CX[F.home],CY[F.home]];
var LAND=new Path2D(),LANDISO={};
(function(){
  (D.land||[]).forEach(function(f){
    var P=LANDISO[f.iso]||(LANDISO[f.iso]=new Path2D());
    f.polygons.forEach(function(poly){poly.forEach(function(ring){
      if(!ring.length)return;var un=[],prev=null,mn=Infinity,mx=-Infinity;
      for(var k=0;k<ring.length;k++){var r=rel(ring[k][0]);if(prev!=null){while(r-prev>180)r-=360;while(r-prev<-180)r+=360;}prev=r;un.push(r);if(r<mn)mn=r;if(r>mx)mx=r;}
      var offs=[0];if(mx>180)offs.push(-360);if(mn<-180)offs.push(360);
      offs.forEach(function(o){for(var k=0;k<ring.length;k++){var p=proj(un[k]+o,ring[k][1]);if(k===0){LAND.moveTo(p[0],p[1]);P.moveTo(p[0],p[1]);}else{LAND.lineTo(p[0],p[1]);P.lineTo(p[0],p[1]);}}LAND.closePath();P.closePath();});
    });});
  });
})();
var OUTLINE=new Path2D(),GRAT=new Path2D();
(function(){var k,p;for(k=-90;k<=90;k+=2){p=proj(180,k);k===-90?OUTLINE.moveTo(p[0],p[1]):OUTLINE.lineTo(p[0],p[1]);}
  for(k=90;k>=-90;k-=2){p=proj(-180,k);OUTLINE.lineTo(p[0],p[1]);}OUTLINE.closePath();
  for(var lon=-180;lon<=180;lon+=30){for(k=-90;k<=90;k+=3){p=proj(lon,k);k===-90?GRAT.moveTo(p[0],p[1]):GRAT.lineTo(p[0],p[1]);}}
  for(var lat=-60;lat<=60;lat+=30){for(k=-180;k<=180;k+=4){p=proj(k,lat);k===-180?GRAT.moveTo(p[0],p[1]):GRAT.lineTo(p[0],p[1]);}}})();
function bboxOf(lon0,lat0,lon1,lat1){var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(var i=0;i<=12;i++)for(var j=0;j<=12;j++){var lon=lon0+(lon1-lon0)*i/12,lat=lat0+(lat1-lat0)*j/12;
    var p=proj(lon1-lon0>=359?-180+360*i/12:rel(lon),lat);if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];}
  return [x0,y0,x1,y1];}
var VIEWS={world:bboxOf(-180,-56,180,80),europe:bboxOf(-11,36,32,61),eastasia:bboxOf(98,17,134,44)};
// great-circle arcs from home

/* ---------- theme ---------- */
var COL={};
function hexRgb(h){h=h.trim().replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}

/* ---------- explorer map: circles per city, home marker, selection, zoom and pan ---------- */

  return {cx:(b[0]+b[2])/2,cy:(b[1]+b[3])/2,s:s};};

/* state: {counts, color, bbox, highlight:[i]} */

    F.years.forEach(function(y,yi){var x=P.x+(yi+0.5)*o.slot;if((yi%every===0&&F.years.length-1-yi>=every)||yi===F.years.length-1)txt(ctx,String(y),x,base+14,'center',COL['--ink-3'],a);
      if(y===F.split||y===F.split+1||yi===peakIdx)txt(ctx,fmt(o.n[yi]),x,base-Math.ceil(o.n[yi]/o.cols)*o.py-10,'center',COL['--ink'],a,'600');});
    legend(ctx,[['--ink-3','Through '+F.split],['--dot','From '+(F.split+1)]],a);return;}
  if(o.kind==='area'||o.kind==='share'){var xs=function(u){return P.x+u/Math.max(1,o.ny-1)*P.w;},base2=P.y+P.h;
    ctx.strokeStyle=rgba(COL['--ink-3'],.5*a);o.order.forEach(function(ct){ctx.beginPath();for(i=o.i1;i<o.ny;i++){var y=o.bounds[i][ct][0];i>o.i1?ctx.lineTo(xs(i),y):ctx.moveTo(xs(i),y);}ctx.stroke();});
    ctx.strokeStyle=rgba(COL['--ink-3'],a);ctx.beginPath();ctx.moveTo(P.x,base2+0.5);ctx.lineTo(P.x+P.w,base2+0.5);ctx.stroke();
    var ev=P.w/o.ny<40?(P.w/o.ny<22?4:2):1;F.years.forEach(function(y,yi){if((yi%ev===0&&o.ny-1-yi>=ev)||yi===o.ny-1)txt(ctx,String(y),xs(yi),base2+14,yi===0?'left':yi===o.ny-1?'right':'center',COL['--ink-3'],a);});
    if(o.share)[0,50,100].forEach(function(v){txt(ctx,v+'%',P.x-8,base2-P.h*v/100,'right',COL['--ink-3'],a);});
    else ticks(o.mx).forEach(function(v){var y=base2-P.h*v/o.mx;if(v&&y>=P.y-2)txt(ctx,fmt(v),P.x-8,y,'right',COL['--ink-3'],a);});
    o.order.forEach(function(ct){var b=o.bounds[o.ny-1][ct],h=b[1]-b[0];if(h<15)return;txt(ctx,ct,P.x+P.w-6,(b[0]+b[1])/2,'right',COL['--ink'],a,'600');});
    legend(ctx,o.order.map(function(ct){return [CONT_VAR[ct],ct];}),a);return;}
  if(o.kind==='labs'){ctx.font='400 12px '+SANS;F.instTop.forEach(function(x,r){var y=P.y+(r+0.5)*o.rowH;
      if(o.narrow){var yb=y+o.rowH*0.18;txt(ctx,fitText(ctx,x.name,P.w),P.x,yb-o.thick/2-8,'left',COL['--ink'],a,r===0?'600':'400');txt(ctx,fmt(o.n[r]),o.ends[r]+8,yb,'left',COL['--ink-2'],a,'600');return;}
      txt(ctx,fitText(ctx,x.name,o.x0-P.x-14),o.x0-12,y,'right',COL['--ink'],a,r===0?'600':'400');txt(ctx,fmt(o.n[r]),o.ends[r]+8,y,'left',COL['--ink-2'],a,'600');});}}
function legend(ctx,items,a){var x=plotBox().x,y=TOP+8;ctx.font='400 11.5px '+SANS;
  items.forEach(function(L){var w=ctx.measureText(L[1]).width+28;if(x+w>SW-30){x=plotBox().x;y+=17;}
    ctx.fillStyle=rgba(COL[L[0]],a);ctx.beginPath();ctx.arc(x+4,y,4,0,6.2832);ctx.fill();txt(ctx,L[1],x+12,y,'left',COL['--ink-2'],a);x+=w;});}
function ticks(max){var step=Math.pow(10,Math.floor(Math.log10(Math.max(1,max))));if(max/step<3)step/=2;var t=[];for(var v=0;v<=max+1e-9;v+=step)t.push(v);return t;}

/* ---------- hover: paper, place and the paper it cites ---------- */
var hover=-1,grid=null,GC=12;
function buildGrid(){var L=LIVE,n=L.n;grid=new Map();for(var i=0;i<n;i++){if(BUF[i*7+5]<0.3)continue;var gk=Math.floor(BUF[i*7]/GC)*4096+Math.floor(BUF[i*7+1]/GC);var a=grid.get(gk);if(a)a.push(i);else grid.set(gk,[i]);}}
function nearest(x,y){if(!grid)return -1;var best=-1,bd=Infinity,gx=Math.floor(x/GC),gy=Math.floor(y/GC);
  for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){var l=grid.get((gx+a)*4096+gy+b);if(!l)continue;
    for(var j=0;j<l.length;j++){var i=l[j],dx=BUF[i*7]-x,dy=BUF[i*7+1]-y,d=dx*dx+dy*dy,r=Math.max(5,BUF[i*7+6]);if(d<=r*r&&d<bd){bd=d;best=i;}}}
  return best;}
function place(f,i){var q=f.q[i],w=W[f.k[i]];
  if(f.kind==='map'){var c=CITIES[q],cn=country(c.country).name;return c.name+(cn!==c.name?', '+cn:'');}
  if(f.kind==='labs')return F.instTop[q-Q_INST].name;
  if(f.kind==='area'||f.kind==='share')return F.contsUsed[q-Q_CONT];
  if(!w.ci.length)return 'No listed affiliation';var names=w.ci.slice(0,2).map(function(c){return CITIES[c].name;});return names.join(', ')+(w.ci.length>2?' and '+(w.ci.length-2)+' more':'');}
function showTip(i){var f=LIVE.form,w=W[f.k[i]];sTip.textContent='';
  sTip.appendChild(el('b',null,D.detailsLoaded?(w.raw.title||'Untitled'):D.detailsFailed?'Title could not be loaded':'Loading title…'));
  sTip.appendChild(el('div','m',(w.yr!=null?w.yr:'Undated')+' · '+place(f,i)));
  if(w.gs.length)sTip.appendChild(el('div','m','Cites '+quoted(GROUPS[w.gs[0]].title)+(w.gs.length>1?' and '+(w.gs.length-1)+' more':'')));
  var x=BUF[i*7],y=BUF[i*7+1];sTip.style.left=Math.max(Math.min(150,SW/2),Math.min(SW-150,x))+'px';sTip.style.top=y+'px';sTip.classList.toggle('below',y<150);sTip.classList.add('on');}
function hideTip(){sTip.classList.remove('on');}
function setHover(i){if(i===hover)return;hover=i;if(i>=0)showTip(i);else hideTip();if(LIVE&&LIVE.p>=1)drawOver(1,LIVE.cam1);}
dotC.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse'||!LIVE||LIVE.p<1)return;var r=dotC.getBoundingClientRect();setHover(nearest(e.clientX-r.left,e.clientY-r.top));});
dotC.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')setHover(-1);});
var tap=null;
dotC.addEventListener('pointerdown',function(e){tap=e.pointerType==='mouse'?null:{x:e.clientX,y:e.clientY,t:performance.now()};});
dotC.addEventListener('pointerup',function(e){var t=tap;tap=null;if(!t||!LIVE||LIVE.p<1)return;
  if(Math.abs(e.clientX-t.x)+Math.abs(e.clientY-t.y)>8||performance.now()-t.t>350)return;var r=dotC.getBoundingClientRect();setHover(nearest(e.clientX-r.left,e.clientY-r.top));});
dotC.addEventListener('pointercancel',function(){tap=null;});
['citation-details','citation-details-failed'].forEach(function(ev){window.addEventListener(ev,function(){if(hover>=0)showTip(hover);});});

/* ---------- scrolly ---------- */
var gTitle=$('gTitle'),gSub=$('gSub'),cur=-1;
function activate(k,animate){if(k===cur)return;var s=STEPS[k];cur=k;
  stepsEl.querySelectorAll('.step').forEach(function(e,i){e.classList.toggle('is-active',i===k);});
  rail.querySelectorAll('button').forEach(function(b,i){if(i===k)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
  gTitle.textContent=s.g[0];gSub.textContent=s.g[1]||'';measureTop();go(buildForm(s),animate);}
// the stage content starts below the header, whose height depends on the title and the stage width
function measureTop(){var h=gTitle.parentNode;TOP=Math.max(44,h.offsetTop+h.offsetHeight+4);}
function rebuild(){if(cur<0)return;var k=cur;cur=-1;LIVE=null;lastCam=fitCam(VIEWS.world);activate(k,false);}
var io=null;
function setupIO(){if(io)io.disconnect();var mobile=window.matchMedia('(max-width:860px)').matches;
  if(!mobile){io=new IntersectionObserver(function(es){var last=null;es.forEach(function(e){if(e.isIntersecting)last=e;});if(last)activate(+last.target.dataset.i,true);},{rootMargin:'-50% 0px -49% 0px'});
    stepsEl.querySelectorAll('.step').forEach(function(e){io.observe(e);});return;}
  /* phones: the active step is the topmost card still visible below the sticky graphic */
  var vis={},gh=G.getBoundingClientRect().height;
  io=new IntersectionObserver(function(es){es.forEach(function(e){var i=+e.target.parentNode.dataset.i;if(e.isIntersecting)vis[i]=1;else delete vis[i];});
    var ks=Object.keys(vis).map(Number);if(ks.length)activate(Math.min.apply(null,ks),true);},{rootMargin:'-'+Math.round(gh+48)+'px 0px 0px 0px'});
  stepsEl.querySelectorAll('.step .card').forEach(function(e){io.observe(e);});}
sizeCanvases();activate(0,false);setupIO();
var ioT=0;window.addEventListener('resize',function(){clearTimeout(ioT);ioT=setTimeout(setupIO,200);});
function sizeKey(){var r=G.getBoundingClientRect();return Math.round(r.width)+'x'+Math.round(r.height);}
var rsT=0,lastSize=sizeKey();new ResizeObserver(function(){var sz=sizeKey();if(sz===lastSize)return;lastSize=sz;
  clearTimeout(rsT);rsT=setTimeout(function(){sizeCanvases();rebuild();},120);}).observe(G);

/* ---------- explore ---------- */
var exMap=new MapView($('exCanvas'),{key:true});
var exCounts=F.ALL,exGroup='',selCity=-1;
(function(){var cited=GLIST.filter(function(G){return G.n>0;});
  cited.forEach(function(G){G.yearly=F.years.map(function(){return 0;});});
  W.forEach(function(w){if(w.yr==null)return;w.gs.forEach(function(g){var G=GROUPS[g];if(G.yearly)G.yearly[w.yr-F.y0]++;});});
  var pk=PaperPicker({button:$('paperSel'),papers:cited,total:F.total,allLabel:'All '+cited.length+' cited papers',here:'story',onSelect:function(k){exGroup=k;applyFilter();}});
  exGroup=pk.initial();if(exGroup)pk.set(exGroup);})();
$('exDek').textContent='Circle area shows citing papers per city. The map covers '+fmt(F.placed)+' of '+fmt(F.total)+' citing papers; the other '+fmt(F.unplaced)+' list no affiliation.';
function applyFilter(){exCounts=exGroup?counts(function(w){return w.gs.indexOf(exGroup)>=0;}):F.ALL;
  var keep=exMap.view&&exMap.userView?exMap.view:null;
  exMap.set({counts:exCounts,bbox:VIEWS.world,highlight:HOME_HL,color:'--dot'});
  if(keep){exMap.view=keep;exMap.userView=true;exMap.computeRadii();exMap.draw();}
  if(selCity>=0&&!(exCounts[selCity]>0))selectCity(-1);else if(selCity>=0)renderDetail(selCity);
  renderList();}
var search=$('citySearch'),listEl=$('cityList');
var listAll=false;
search.addEventListener('input',function(){listAll=false;renderList();});
function renderList(){var q=search.value.trim().toLowerCase(),ids=[];
  for(var i=0;i<NC;i++){if(!(exCounts[i]>0))continue;if(q){var c=CITIES[i];if((c.name+' '+country(c.country).name+' '+(c.region||'')).toLowerCase().indexOf(q)<0)continue;}ids.push(i);}
  ids.sort(function(a,b){return exCounts[b]-exCounts[a];});listEl.textContent='';
  if(!ids.length){listEl.appendChild(el('li','empty','No matching city'));return;}
  (listAll?ids:ids.slice(0,60)).forEach(function(i){var li=el('li'),b=el('button');b.type='button';b.dataset.i=i;b.setAttribute('aria-pressed',String(i===selCity));
    var nm=el('span');nm.appendChild(document.createTextNode(CITIES[i].name+' '));var cnm=country(CITIES[i].country).name;if(cnm!==CITIES[i].name)nm.appendChild(el('span','cn',cnm));
    b.appendChild(nm);b.appendChild(el('span','c',fmt(exCounts[i])));b.addEventListener('click',function(){selectCity(i);});li.appendChild(b);listEl.appendChild(li);});
  if(!listAll&&ids.length>60){var li=el('li'),mb=el('button','more','Show all '+fmt(ids.length)+' cities');mb.type='button';
    mb.addEventListener('click',function(){listAll=true;renderList();var nb=listEl.querySelector('li:nth-child(61) button');if(nb)nb.focus();});li.appendChild(mb);listEl.appendChild(li);}}
var detail=$('detail');
function renderDetail(i){detail.textContent='';
  if(i<0){detail.appendChild(el('p','hint','Select a city on the map or in the list.'));return;}
  var c=CITIES[i],ws=CITY_WORKS[i].filter(function(w){return !exGroup||w.gs.indexOf(exGroup)>=0;});
  function rk(w){return w.raw.yo&&w.yr!=null?w.yr+'-00':w.date||String(w.yr||'');}   // a year-only date sorts after that year's dated papers
  ws.sort(function(a,b){var x=rk(a),y=rk(b);return x<y?1:x>y?-1:0;});
  detail.appendChild(el('h3',null,c.name));
  detail.appendChild(el('p','meta',[c.region,country(c.country).name].filter(function(x){return x&&x!==c.name;}).join(', ')+' · '+fmt(ws.length)+' citing paper'+(ws.length===1?'':'s')+(i===F.home&&F.homeExact?' · home':'')));
  var here={};(c.institutions||[]).forEach(function(x){here[x]=0;});
  ws.forEach(function(w){w.inst.forEach(function(x){if(x in here)here[x]++;});});
  var il=Object.keys(here).filter(function(x){return here[x]>0;}).sort(function(a,b){return here[b]-here[a];});
  if(il.length){detail.appendChild(el('h4',null,'Institutions'));var ul=el('ul','insts');
    il.slice(0,8).forEach(function(x){var li=el('li');li.appendChild(el('span',null,(INST[x]&&INST[x].display_name)||x));li.appendChild(el('span',null,fmt(here[x])));ul.appendChild(li);});detail.appendChild(ul);
    if(il.length>8)detail.appendChild(el('p','meta','and '+fmt(il.length-8)+' more'));}
  detail.appendChild(el('h4',null,'Citing papers'));
  if(!D.detailsLoaded){detail.appendChild(el('p','hint',D.detailsFailed?'Titles could not be loaded':'Loading papers\u2026'));return;}
  var pl=el('ul','papers');detail.appendChild(pl);var shown=0;
  function more(){ws.slice(shown,shown+25).forEach(function(w){var li=el('li'),u=workUrl(w.raw),t=w.raw.title||'Untitled';
      if(u){var a=el('a',null,t);a.href=u;a.target='_blank';a.rel='noopener noreferrer';li.appendChild(a);}else li.appendChild(el('span',null,t));
      li.appendChild(el('div','pm',(w.yr!=null?w.yr:'Undated')+' · cites '+w.gs.map(function(g){return quoted(GROUPS[g].title);}).join('; ')));pl.appendChild(li);});
    shown=Math.min(ws.length,shown+25);btn.hidden=shown>=ws.length;btn.textContent='Show more ('+fmt(ws.length-shown)+' left)';}
  var btn=el('button','more');btn.type='button';btn.addEventListener('click',more);detail.appendChild(btn);more();}
function selectCity(i){selCity=i;exMap.sel=i;exMap.draw();renderDetail(i);
  $('exLive').textContent=i<0?'':CITIES[i].name+', '+fmt(exCounts[i])+' citing paper'+(exCounts[i]===1?'':'s');
  listEl.querySelectorAll('button[data-i]').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.i===i));});}
var exC=$('exCanvas'),tip=$('tip'),drag=null;
/* touch: one finger scrolls the page at world view; once zoomed in it pans the map */
function syncPan(){exC.classList.toggle('pan',!!exMap.view&&exMap.view.s>exMap.worldS()*1.02);}
exC.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'?e.button===0:(e.isPrimary&&exC.classList.contains('pan'))){drag={x:e.clientX,y:e.clientY,cx:exMap.view.cx,cy:exMap.view.cy,moved:false};exC.setPointerCapture(e.pointerId);}
  else drag={x:e.clientX,y:e.clientY,moved:false,touch:true};});
exC.addEventListener('pointermove',function(e){var r=exC.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  if(drag&&!drag.touch){var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;exC.classList.add('dragging');}
    if(drag.moved){exMap.view={cx:drag.cx-dx/exMap.view.s,cy:drag.cy-dy/exMap.view.s,s:exMap.view.s};exMap.userView=true;tip.classList.remove('on');exMap.draw();return;}}
  if(e.pointerType!=='mouse')return;var h=exMap.hit(px,py);if(h!==exMap.hover){exMap.hover=h;exMap.draw();}
  if(h>=0){tip.textContent='';var b=el('b',null,CITIES[h].name);tip.appendChild(b);tip.appendChild(document.createTextNode(' · '+fmt(exCounts[h])+' paper'+(exCounts[h]===1?'':'s')));
    tip.style.left=px+'px';tip.style.top=py+'px';tip.classList.add('on');exC.style.cursor='pointer';}else{tip.classList.remove('on');exC.style.cursor='';}});
exC.addEventListener('pointerup',function(e){var r=exC.getBoundingClientRect();if(drag&&!drag.moved){var h=exMap.hit(e.clientX-r.left,e.clientY-r.top);if(h>=0)selectCity(h);}
  drag=null;exC.classList.remove('dragging');});
exC.addEventListener('pointercancel',function(){drag=null;exC.classList.remove('dragging');});
exC.addEventListener('pointerleave',function(){if(exMap.hover>=0){exMap.hover=-1;exMap.draw();}tip.classList.remove('on');});
exC.addEventListener('wheel',function(e){if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();var r=exC.getBoundingClientRect();exMap.zoomAt(Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);syncPan();},{passive:false});
exC.addEventListener('dblclick',function(e){var r=exC.getBoundingClientRect();exMap.zoomAt(2,e.clientX-r.left,e.clientY-r.top);syncPan();});
$('zIn').addEventListener('click',function(){exMap.zoomAt(1.6);syncPan();});
$('zOut').addEventListener('click',function(){exMap.zoomAt(1/1.6);syncPan();});
$('zReset').addEventListener('click',function(){exMap.userView=false;exMap.view=exMap.fit(VIEWS.world);exMap.computeRadii();exMap.draw();syncPan();});
applyFilter();renderDetail(-1);
['citation-details','citation-details-failed'].forEach(function(ev){window.addEventListener(ev,function(){if(selCity>=0)renderDetail(selCity);});});

/* ---------- about ---------- */
(function(){var b=$('aboutBody');var ms=D.stats||{};
  b.appendChild(P(['The list of ',OWNER,'’s papers comes from the Google Scholar profile (',fmt(D.scholar_count||0),' entries). ',fmt(GLIST.length),' papers were matched to OpenAlex, where preprint and proceedings versions of one paper are separate records (',fmt(D.targets.length),' records, merged here by title); ',fmt((D.unmatched||[]).length),' Scholar entries were not found. Every work OpenAlex lists as citing a matched paper is included: ',{b:fmt(F.total)},' citing papers, snapshot of ',asofText,'.']));
  b.appendChild(P(['Papers are placed by their authors’ institutions, whose coordinates are usually a headquarters or main campus. ',{b:fmt(F.unplaced)},' citing papers list no affiliation and cannot be placed; they are counted in totals but not on the map. ',F.undated?fmt(F.undated)+' papers carry no year and are left out of the yearly charts. ':'','Papers dated after the snapshot are counted in '+ASOF_Y+'.']));
  b.appendChild(P(['A paper counts once in each city, country, continent or institution among its authors, so those totals sum to more than the number of papers. Self-citations are included. Country names follow Natural Earth; Hong Kong, Macao and Taiwan are listed separately from mainland China.']));
})();

/* ---------- theme toggle ---------- */
var root=document.documentElement,mq=window.matchMedia('(prefers-color-scheme: dark)');
function effective(){var t=root.getAttribute('data-theme');return t||(mq.matches?'dark':'light');}
function themeLabel(){$('themeBtn').setAttribute('aria-label',effective()==='dark'?'Switch to light theme':'Switch to dark theme');}
function onTheme(){readColors();exMap.draw();rebuild();themeLabel();}
$('themeBtn').addEventListener('click',function(){var n=effective()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}onTheme();});
mq.addEventListener('change',function(){if(!root.getAttribute('data-theme'))onTheme();});
window.addEventListener('storage',function(e){if(e.key!=='theme')return;if(e.newValue==='light'||e.newValue==='dark')root.setAttribute('data-theme',e.newValue);else root.removeAttribute('data-theme');onTheme();});
themeLabel();
})();
/* While the pinned chart scrolls away at the end of the story, the fixed buttons would sit on its labels: hide them until it is gone. */
(function(){var g=document.getElementById('graphic'),bs=document.querySelectorAll('.theme-btn'),raf=0;
  function check(){raf=0;var r=g.getBoundingClientRect(),t=r.top<-2&&r.bottom>64;bs.forEach(function(b){b.classList.toggle('tucked',t);});}
  addEventListener('scroll',function(){if(!raf)raf=requestAnimationFrame(check);},{passive:true});addEventListener('resize',check);check();})();
</script>
