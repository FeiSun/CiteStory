<!doctype html>
<meta charset="utf-8">
<title>CiteStory promo stage</title>
<!-- ?mode=intro | outro | frame&name=Atlas&tag=Where in the world&i=0&n=8
     "frame" is the 1920x1080 surround for a view: backdrop, caption strip, and a transparent 1664x936 window. -->
<style>
:root{--bg:#f5f2ec;--stage:#e6dfd2;--ink:#1d1b17;--ink-2:#4b473f;--muted:#6c675d;--hair:#cfc6b5;--accent:#b5560f;
  --serif:"Iowan Old Style","New York","Palatino",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.card{position:absolute;inset:0;background:var(--stage);display:flex;flex-direction:column;justify-content:center;padding:0 168px}
h1{font:400 208px/1 var(--serif);letter-spacing:-.02em}
h1 em,h2 em{font-style:normal;color:var(--accent)}
h2{font:400 112px/1.08 var(--serif);letter-spacing:-.015em}
.lede{font:400 46px/1.35 var(--serif);color:var(--ink-2);margin-top:44px;max-width:1300px}
.rule{height:1px;background:var(--hair);margin:64px 0 40px;transform-origin:left}
.names{font:400 34px/1 var(--sans);color:var(--muted);letter-spacing:.01em}
.url{font:500 44px/1 var(--sans);color:var(--ink);margin-top:44px}
.mark{font:400 60px/1 var(--serif);margin-bottom:40px}.mark em{font-style:normal;color:var(--accent)}
.in{animation:in .9s cubic-bezier(.2,.7,.2,1) both}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-18px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* frame */
.hole{position:absolute;left:128px;top:40px;width:1664px;height:936px;border-radius:14px;box-shadow:0 0 0 3000px var(--stage)}
.edge{position:absolute;left:127px;top:39px;width:1666px;height:938px;border-radius:15px;border:1px solid var(--hair)}
.cap{position:absolute;left:128px;right:128px;top:976px;height:104px;display:flex;align-items:center;gap:22px}
.cap b{font:400 44px/1 var(--serif);letter-spacing:-.01em}
.cap span{font:400 31px/1 var(--sans);color:var(--muted);padding-top:8px}
.dots{margin-left:auto;display:flex;gap:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--hair)}
.dots i.on{background:var(--accent)}
</style>
<body>
<script>
const q = new URLSearchParams(location.search), mode = q.get('mode');
const h = (tag, cls, html, delay) => { const e = document.createElement(tag); if (cls) e.className = cls; e.innerHTML = html || ''; if (delay != null) e.style.animationDelay = delay + 's'; return e; };
if (mode === 'frame') {
  const cap = h('div', 'cap');
  const b = h('b'); b.textContent = q.get('name'); const s = h('span'); s.textContent = q.get('tag');
  const dots = h('div', 'dots'); for (let k = 0; k < +q.get('n'); k++) dots.append(h('i', k === +q.get('i') ? 'on' : ''));
  cap.append(b, s, dots);
  document.body.append(h('div', 'hole'), h('div', 'edge'), cap);
} else {
  const card = h('div', 'card');
  if (mode === 'intro') card.append(
    h('h1', '', 'Cite<em>Story</em>'),
    h('p', 'lede in', 'The story behind your citations: who reads your work, where, and since when.', .15));
  if (mode === 'intro') setTimeout(() => { card.style.animation = 'out .45s ease-in both'; }, 1750);
  else card.append(
    h('p', 'mark in', 'Cite<em>Story</em>', 0),
    h('h2', 'in', 'One Google Scholar link.<br><em>Eight</em> ways to see who cites you.', .1),
    h('div', 'rule grow', '', .6),
    h('p', 'names in', 'Atlas &nbsp;·&nbsp; Reach &nbsp;·&nbsp; Story &nbsp;·&nbsp; Flow &nbsp;·&nbsp; Constellation &nbsp;·&nbsp; Race &nbsp;·&nbsp; Regulars &nbsp;·&nbsp; Record', .8),
    h('p', 'url in', 'Open source &nbsp;·&nbsp; github.com/FeiSun/CiteStory', 1.1));
  document.body.append(card);
}
</script>
